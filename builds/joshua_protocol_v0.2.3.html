<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#03060a">
<title>JOSHUA PROTOCOL v0.2.3</title>
<style>
  :root {
    --bg-deep: #03060a;
    --bg-panel: #06101a;
    --bg-panel-2: #0a1824;
    --grid-line: #0e2030;
    --cyan: #4ee2ff;
    --cyan-dim: #2a8aa0;
    --amber: #ffb84d;
    --amber-dim: #a07028;
    --magenta: #ff4ea8;
    --magenta-dim: #a02868;
    --red: #ff3a3a;
    --red-dim: #802020;
    --green: #5cff8a;
    --white: #e8f4ff;
    --muted: #5a7080;
    --term-glow: rgba(78, 226, 255, 0.15);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: var(--bg-deep); color: var(--white);
    font-family: 'JetBrains Mono', 'Courier New', ui-monospace, monospace;
    font-size: 13px; line-height: 1.4;
    user-select: none; -webkit-user-select: none;
    touch-action: manipulation;
    overscroll-behavior: none;
  }
  #app {
    width: 100vw; height: 100vh; height: 100dvh;
    display: flex; flex-direction: column;
    position: relative;
    background: linear-gradient(180deg, #04080d 0%, #03060a 100%);
    overflow: hidden;
  }
  #app::after {
    content: ''; position: fixed; inset: 0; pointer-events: none;
    background: repeating-linear-gradient(
      0deg, rgba(78,226,255,0.025) 0px, rgba(78,226,255,0.025) 1px,
      transparent 1px, transparent 3px);
    z-index: 100;
  }
  #status-bar {
    flex: 0 0 auto;
    padding: 6px 10px;
    background: linear-gradient(180deg, #08141e 0%, #050b13 100%);
    border-bottom: 1px solid var(--grid-line);
    display: grid; grid-template-columns: auto 1fr auto;
    align-items: center; gap: 8px;
    font-size: 10px; letter-spacing: 0.05em;
  }
  .status-tag { color: var(--cyan); text-transform: uppercase; }
  .status-val { color: var(--white); font-weight: bold; }
  .status-mid { text-align: center; color: var(--muted); }
  .threat-low { color: var(--green); }
  .threat-med { color: var(--amber); }
  .threat-high { color: var(--red); animation: pulseRed 1.2s infinite; }
  @keyframes pulseRed { 0%,100% { opacity: 1; } 50% { opacity: 0.5; } }

  #map-area {
    flex: 1 1 auto;
    position: relative; overflow: hidden;
    min-height: 220px;
  }
  #map-canvas { width: 100%; height: 100%; display: block; }

  #view-toggle {
    position: absolute; top: 8px; left: 50%;
    transform: translateX(-50%);
    display: none; gap: 0;
    background: rgba(3, 6, 10, 0.88);
    border: 1px solid var(--cyan-dim);
    border-radius: 3px; overflow: hidden;
    z-index: 5;
  }
  #view-toggle.active { display: flex; }
  .view-btn {
    padding: 5px 9px;
    background: transparent; border: none;
    color: var(--muted);
    font-family: inherit; font-size: 9px;
    letter-spacing: 0.1em; cursor: pointer;
    border-right: 1px solid var(--grid-line);
    text-transform: uppercase;
  }
  .view-btn:last-child { border-right: none; }
  .view-btn.active {
    color: var(--cyan);
    background: rgba(78,226,255,0.1);
  }

  #settings-btn {
    position: absolute; top: 6px; right: 6px;
    width: 28px; height: 28px;
    background: rgba(3,6,10,0.7);
    border: 1px solid var(--cyan-dim);
    border-radius: 3px;
    color: var(--cyan);
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    z-index: 5; font-size: 14px;
  }

  .map-overlay-text {
    position: absolute; pointer-events: none;
    font-size: 9px; color: var(--cyan-dim);
    letter-spacing: 0.1em; text-transform: uppercase;
  }
  .tap-hint {
    position: absolute; bottom: 4px; left: 0; right: 0;
    text-align: center;
    font-size: 9px; color: var(--muted);
    pointer-events: none;
    text-transform: uppercase; letter-spacing: 0.1em;
  }

  #terminal {
    flex: 0 0 160px; height: 160px; max-height: 160px;
    background: linear-gradient(180deg, #050d15 0%, #030709 100%);
    border-top: 1px solid var(--cyan-dim);
    border-bottom: 1px solid var(--grid-line);
    display: flex; flex-direction: column;
    position: relative;
    box-shadow: inset 0 0 30px var(--term-glow);
    overflow: hidden;
  }
  #terminal-tabs {
    flex: 0 0 auto; display: flex;
    border-bottom: 1px solid var(--grid-line);
    background: #04090e;
  }
  .term-tab {
    flex: 1; padding: 5px 4px;
    background: transparent; border: none;
    color: var(--muted);
    font-family: inherit; font-size: 10px;
    letter-spacing: 0.08em; text-transform: uppercase;
    cursor: pointer;
    border-right: 1px solid var(--grid-line);
    transition: all 0.15s;
  }
  .term-tab:last-child { border-right: none; }
  .term-tab.active {
    color: var(--cyan);
    background: linear-gradient(180deg, rgba(78,226,255,0.08) 0%, transparent 100%);
    border-bottom: 2px solid var(--cyan);
  }
  .term-tab .badge {
    display: inline-block; background: var(--red);
    color: var(--white); font-size: 8px;
    padding: 1px 4px; border-radius: 6px; margin-left: 2px;
  }
  #terminal-content {
    flex: 1; overflow-y: auto;
    padding: 6px 8px;
    font-size: 11px; line-height: 1.5;
    scroll-behavior: smooth;
  }
  #terminal-content::-webkit-scrollbar { width: 4px; }
  #terminal-content::-webkit-scrollbar-track { background: transparent; }
  #terminal-content::-webkit-scrollbar-thumb { background: var(--cyan-dim); }

  .log-line { margin-bottom: 3px; word-wrap: break-word; }
  .log-time { color: var(--muted); margin-right: 6px; }
  .log-info { color: var(--white); }
  .log-warn { color: var(--amber); }
  .log-crit { color: var(--red); }
  .log-good { color: var(--green); }
  .log-cyan { color: var(--cyan); }
  .log-josh { color: var(--cyan); border-left: 2px solid var(--cyan); padding-left: 6px; margin: 4px 0; }
  .log-vigil { color: var(--cyan); }
  .log-wraith { color: var(--magenta); }
  .log-anchor { color: var(--amber); }
  .log-tech { color: var(--magenta-dim); font-size: 10px; }
  .log-divider { color: var(--grid-line); margin: 4px 0; letter-spacing: -1px; }
  .framework-tag {
    display: inline-block; font-size: 8px;
    padding: 0 4px; margin-left: 4px;
    border: 1px solid var(--magenta-dim);
    color: var(--magenta);
    border-radius: 2px; letter-spacing: 0.05em;
  }
  .framework-tag.attack { border-color: #c04080; color: #ff6090; }
  .framework-tag.ics { border-color: #c08020; color: #ffaa50; }
  .framework-tag.sparta { border-color: #4080c0; color: #60a0ff; }
  .framework-tag.atlas { border-color: #40c080; color: #60ffa0; }
  .framework-tag.d3fend { border-color: #2a8aa0; color: #4ee2ff; }

  .codex-entry {
    margin-bottom: 12px; padding-bottom: 8px;
    border-bottom: 1px solid var(--grid-line);
  }
  .codex-id { color: var(--cyan); font-weight: bold; font-size: 11px; }
  .codex-name { color: var(--white); font-weight: bold; }
  .codex-desc { color: var(--muted); font-size: 10px; margin-top: 3px; }
  .codex-tools { color: var(--green); font-size: 9px; margin-top: 3px; }
  .codex-counters { color: var(--amber); font-size: 9px; margin-top: 2px; }

  #agent-strip {
    flex: 0 0 auto;
    padding: 4px 6px;
    background: #04090e;
    border-top: 1px solid var(--grid-line);
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 4px;
  }
  .agent-card {
    background: linear-gradient(180deg, #0a141d 0%, #060c14 100%);
    border: 1px solid var(--grid-line);
    border-radius: 2px;
    padding: 3px;
    display: flex; align-items: center; gap: 5px;
    cursor: pointer;
    transition: all 0.2s;
    position: relative; overflow: hidden;
    min-height: 44px;
  }
  .agent-card.active {
    border-color: var(--accent);
    box-shadow: 0 0 12px var(--accent-glow);
  }
  .agent-card.exhausted { opacity: 0.4; }
  .agent-card.speaking::before {
    content: ''; position: absolute; inset: 0;
    background: radial-gradient(circle at 20% 50%, var(--accent-glow) 0%, transparent 60%);
    pointer-events: none;
    animation: speakPulse 0.8s ease-out;
  }
  @keyframes speakPulse { 0% { opacity: 1; } 100% { opacity: 0; } }
  .agent-portrait { width: 36px; height: 36px; flex: 0 0 auto; }
  .agent-info { flex: 1; min-width: 0; }
  .agent-name {
    font-size: 11px; font-weight: bold;
    color: var(--accent); letter-spacing: 0.05em;
  }
  .agent-class {
    font-size: 9px; color: var(--muted);
    text-transform: uppercase;
  }
  .agent-status {
    font-size: 9px; color: var(--white);
    margin-top: 2px;
  }

  #action-bar {
    flex: 0 0 auto;
    padding: 5px 6px 6px;
    background: #02050a;
    border-top: 1px solid var(--cyan-dim);
    display: flex; gap: 5px;
  }
  .action-btn {
    flex: 1;
    padding: 8px 6px;
    background: linear-gradient(180deg, #0d1c2a 0%, #07111a 100%);
    border: 1px solid var(--cyan-dim);
    color: var(--cyan);
    font-family: inherit; font-size: 11px;
    font-weight: bold; letter-spacing: 0.08em;
    text-transform: uppercase;
    cursor: pointer;
    border-radius: 2px;
    transition: all 0.15s;
    position: relative;
  }
  .action-btn:active { transform: scale(0.97); }
  .action-btn:disabled { opacity: 0.3; cursor: not-allowed; }
  .action-btn.primary {
    background: linear-gradient(180deg, #0f3848 0%, #082028 100%);
    border-color: var(--cyan);
    box-shadow: 0 0 8px rgba(78,226,255,0.3);
  }
  .action-btn.danger { border-color: var(--red); color: var(--red); }
  .action-btn.attract { animation: attractPulse 1.4s ease-in-out infinite; }
  @keyframes attractPulse {
    0%, 100% { box-shadow: 0 0 8px rgba(78,226,255,0.3); }
    50% { box-shadow: 0 0 18px rgba(78,226,255,0.85), 0 0 30px rgba(78,226,255,0.4); }
  }

  .modal {
    position: absolute; inset: 0;
    background: rgba(3, 6, 10, 0.92);
    z-index: 50;
    display: flex; align-items: center; justify-content: center;
    padding: 16px;
    backdrop-filter: blur(2px);
    overflow-y: auto;
  }
  .modal-content {
    width: 100%; max-width: 360px;
    background: linear-gradient(180deg, #0a1824 0%, #050b13 100%);
    border: 1px solid var(--cyan);
    box-shadow: 0 0 24px rgba(78,226,255,0.4);
    padding: 14px;
    font-size: 11px;
    max-height: 90vh; overflow-y: auto;
  }
  .modal-title {
    font-size: 13px; font-weight: bold;
    color: var(--cyan);
    text-transform: uppercase; letter-spacing: 0.1em;
    margin-bottom: 8px;
    border-bottom: 1px solid var(--grid-line);
    padding-bottom: 6px;
  }
  .modal-body { margin-bottom: 12px; line-height: 1.6; }
  .modal-body p { margin-bottom: 8px; }

  .mission-card {
    background: linear-gradient(180deg, #0a141d 0%, #060c14 100%);
    border: 1px solid var(--grid-line);
    border-radius: 2px;
    padding: 10px; margin-bottom: 8px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .mission-card:hover, .mission-card:active {
    border-color: var(--cyan);
    box-shadow: 0 0 12px rgba(78,226,255,0.3);
  }
  .mission-name {
    font-size: 12px; font-weight: bold;
    color: var(--cyan); margin-bottom: 4px;
    letter-spacing: 0.05em;
  }
  .mission-domain {
    font-size: 9px; color: var(--amber);
    text-transform: uppercase; margin-bottom: 6px;
  }
  .mission-desc {
    font-size: 10px; color: var(--muted);
    line-height: 1.5;
  }

  #boot {
    position: absolute; inset: 0;
    background: var(--bg-deep);
    z-index: 200;
    display: flex; flex-direction: column;
    justify-content: center; align-items: center;
    padding: 20px; font-size: 12px;
  }
  #boot-text {
    width: 100%; max-width: 320px;
    color: var(--cyan);
    white-space: pre-wrap;
    line-height: 1.6;
    min-height: 280px;
  }
  .cursor::after {
    content: '_';
    animation: blink 0.8s infinite;
    color: var(--cyan);
  }
  @keyframes blink { 0%,49% { opacity: 1; } 50%,100% { opacity: 0; } }

  #replay-overlay {
    position: absolute; inset: 0;
    background: rgba(3,6,10,0.95);
    z-index: 30;
    display: none;
    flex-direction: column;
    padding: 16px;
  }
  #replay-overlay.active { display: flex; }
  .replay-title {
    font-size: 11px; color: var(--cyan);
    letter-spacing: 0.15em; text-transform: uppercase;
    margin-bottom: 8px; text-align: center;
  }
  #replay-canvas {
    flex: 1;
    width: 100%;
    border: 1px solid var(--cyan-dim);
    background: #03060a;
    min-height: 100px;
  }
  .replay-card-stack {
    display: flex; gap: 6px;
    overflow-x: auto;
    padding: 8px 0;
    flex: 0 0 auto;
  }
  .replay-card {
    flex: 0 0 auto;
    width: 110px;
    padding: 6px;
    background: linear-gradient(180deg, #0a141d 0%, #060c14 100%);
    border: 1px solid var(--magenta-dim);
    border-radius: 2px;
    font-size: 9px;
    opacity: 0;
    transform: translateY(8px);
    transition: all 0.4s;
  }
  .replay-card.shown { opacity: 1; transform: translateY(0); }
  .replay-card.counter { border-color: var(--green); }
  .replay-card .rc-id {
    color: var(--magenta); font-weight: bold;
    margin-bottom: 2px; font-size: 10px;
  }
  .replay-card.counter .rc-id { color: var(--green); }
  .replay-card .rc-name { color: var(--white); margin-bottom: 3px; }
  .replay-card .rc-fw {
    font-size: 8px; color: var(--muted);
    letter-spacing: 0.05em;
  }
  #replay-skip { margin-top: 8px; flex: 0 0 auto; }

  .settings-row {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 10px;
    padding: 6px 0;
    border-bottom: 1px solid var(--grid-line);
  }
  .settings-label {
    color: var(--cyan); font-size: 11px;
    text-transform: uppercase; letter-spacing: 0.05em;
  }
  .verbosity-toggle {
    display: flex; gap: 0;
    border: 1px solid var(--cyan-dim);
    border-radius: 2px;
    overflow: hidden;
  }
  .verbosity-btn {
    padding: 5px 10px;
    background: transparent; border: none;
    color: var(--muted);
    font-family: inherit; font-size: 10px;
    cursor: pointer;
    text-transform: uppercase; letter-spacing: 0.05em;
    border-right: 1px solid var(--grid-line);
  }
  .verbosity-btn:last-child { border-right: none; }
  .verbosity-btn.active {
    color: var(--cyan);
    background: rgba(78,226,255,0.15);
  }

  /* v0.2.1: tappable technique IDs in log */
  .tech-tap {
    color: var(--cyan);
    text-decoration: underline dotted;
    text-decoration-color: var(--cyan-dim);
    cursor: pointer;
    font-weight: bold;
  }
  .tech-tap:hover, .tech-tap:active {
    color: var(--white);
    background: rgba(78,226,255,0.15);
    text-decoration-color: var(--cyan);
  }

  /* v0.2.1: full-screen debrief */
  .debrief-overlay {
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, #050d15 0%, #03060a 100%);
    z-index: 60;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .debrief-header {
    flex: 0 0 auto;
    padding: 14px 16px 10px;
    background: linear-gradient(180deg, #08141e 0%, #050b13 100%);
  }
  .debrief-tabs {
    flex: 0 0 auto;
    display: flex;
    border-bottom: 1px solid var(--grid-line);
    background: #04090e;
  }
  .debrief-tab {
    flex: 1;
    padding: 9px 4px;
    background: transparent;
    border: none;
    color: var(--muted);
    font-family: inherit;
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    cursor: pointer;
    border-right: 1px solid var(--grid-line);
  }
  .debrief-tab:last-child { border-right: none; }
  .debrief-tab.active {
    color: var(--cyan);
    background: linear-gradient(180deg, rgba(78,226,255,0.08) 0%, transparent 100%);
    border-bottom: 2px solid var(--cyan);
  }
  .debrief-body {
    flex: 1;
    overflow-y: auto;
    padding: 14px;
    font-size: 11px;
    line-height: 1.5;
  }
  .debrief-footer {
    flex: 0 0 auto;
    padding: 8px;
    background: #02050a;
    border-top: 1px solid var(--cyan-dim);
    display: flex;
    gap: 6px;
  }

  .rubric-overall {
    text-align: center;
    margin-bottom: 14px;
    padding: 10px;
    background: rgba(78,226,255,0.04);
    border: 1px solid var(--cyan-dim);
    border-radius: 2px;
  }
  .rubric-row {
    margin-bottom: 12px;
    padding-bottom: 10px;
    border-bottom: 1px solid var(--grid-line);
  }
  .rubric-label {
    color: var(--cyan);
    font-size: 10px;
    font-weight: bold;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }
  .rubric-bar-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 4px;
  }
  .rubric-bar {
    font-family: monospace;
    letter-spacing: -1px;
    font-size: 12px;
  }
  .rubric-score {
    color: var(--white);
    font-weight: bold;
    min-width: 28px;
    text-align: right;
  }
  .rubric-tag {
    font-size: 9px;
    letter-spacing: 0.08em;
  }
  .rubric-detail {
    color: var(--muted);
    font-size: 10px;
    margin-top: 4px;
  }

  .trend-block {
    margin-bottom: 12px;
    padding: 8px;
    background: rgba(78,226,255,0.03);
    border: 1px solid var(--grid-line);
    border-radius: 2px;
  }
  .trend-label {
    color: var(--cyan);
    font-size: 9px;
    font-weight: bold;
    letter-spacing: 0.1em;
  }
  .trend-spark {
    font-size: 18px;
    letter-spacing: 1px;
    margin: 4px 0;
    line-height: 1;
  }
  .trend-detail {
    color: var(--muted);
    font-size: 9px;
  }

  .moves-table {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    line-height: 1.7;
  }
  .moves-row {
    padding: 2px 4px;
    border-bottom: 1px dotted var(--grid-line);
    white-space: nowrap;
    overflow-x: auto;
  }
  .moves-rnd { color: var(--muted); margin-right: 8px; }
  .moves-agent { font-weight: bold; margin-right: 6px; }
  .moves-action { color: var(--cyan-dim); margin-right: 6px; }
  .moves-target { color: var(--white); margin-right: 6px; }
  .moves-outcome { font-weight: bold; }

  /* Modal codex card recommendations */
  .rec-line {
    line-height: 1.5;
    color: var(--white);
  }

  /* v0.2.2: LANDSCAPE LAYOUT
     Two-column grid: map+agents+action on left, terminal full-height on right.
     Trigger when viewport is wider than tall AND has enough width to be useful. */
  @media (orientation: landscape) and (min-width: 640px) {
    #app {
      display: grid;
      grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr);
      grid-template-rows: auto 1fr auto auto;
      grid-template-areas:
        "status   status"
        "map      terminal"
        "agents   terminal"
        "actions  terminal";
      gap: 0;
    }
    #status-bar { grid-area: status; }
    #map-area {
      grid-area: map;
      min-height: 0;
      border-right: 1px solid var(--cyan-dim);
    }
    #agent-strip {
      grid-area: agents;
      border-right: 1px solid var(--cyan-dim);
      border-top: 1px solid var(--grid-line);
    }
    #action-bar {
      grid-area: actions;
      border-right: 1px solid var(--cyan-dim);
      border-top: 1px solid var(--cyan-dim);
    }
    #terminal {
      grid-area: terminal;
      flex: unset;
      height: auto;
      max-height: unset;
      min-height: 0;
      border-top: none;
      border-bottom: none;
      border-left: 1px solid var(--cyan-dim);
    }
    /* Terminal content gets all the breathing room it needs */
    #terminal-content {
      font-size: 12px;
      line-height: 1.6;
      padding: 10px 12px;
    }
    .term-tab {
      padding: 8px 4px;
      font-size: 11px;
    }
    /* Slightly larger map overlay text since we have more room */
    .map-overlay-text {
      font-size: 10px;
    }
    /* Modals stay reasonable */
    .modal-content {
      max-width: 460px;
    }
    /* Mission select goes wider in landscape with cards side-by-side
       so everything fits without scrolling on short viewports */
    #mission-select-modal .modal-content {
      max-width: 720px;
    }
    #mission-select-modal .modal-body {
      margin-bottom: 8px;
    }
    #mission-select-modal .mission-cards-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

const GM_EARTH = 398600.4418;       // km³/s²
const R_EARTH  = 6378.137;          // km WGS-84
const J2       = 1.08263e-3;
const C        = 299792.458;        // km/s

const DEG = Math.PI / 180;
const RAD = 180 / Math.PI;

const deg = r => r * RAD;
const rad = d => d * DEG;
const clamp = (x, lo, hi) => Math.max(lo, Math.min(hi, x));

// AeroSec-Lab simplified SGP4 orbit propagation
function propagateOrbit(orbit, minutesFromEpoch) {
  const { incl, raan, ecc, aop, ma, mm } = orbit;
  const a_km = orbit.a_km || Math.pow(GM_EARTH / Math.pow(2*Math.PI*mm/86400, 2), 1/3);
  const n = mm * 2 * Math.PI / 1440;
  const M = rad(ma) + n * minutesFromEpoch;
  let E = M;
  for (let i = 0; i < 10; i++) E = E - (E - ecc*Math.sin(E) - M)/(1 - ecc*Math.cos(E));
  const nu = 2 * Math.atan2(Math.sqrt(1+ecc)*Math.sin(E/2), Math.sqrt(1-ecc)*Math.cos(E/2));
  const r = a_km * (1 - ecc*Math.cos(E));
  const xp = r * Math.cos(nu);
  const yp = r * Math.sin(nu);
  const o = rad(raan), w = rad(aop), i = rad(incl);
  const cos = Math.cos, sin = Math.sin;
  const R00 = cos(o)*cos(w)-sin(o)*sin(w)*cos(i);
  const R01 = -cos(o)*sin(w)-sin(o)*cos(w)*cos(i);
  const R10 = sin(o)*cos(w)+cos(o)*sin(w)*cos(i);
  const R11 = -sin(o)*sin(w)+cos(o)*cos(w)*cos(i);
  const R20 = sin(w)*sin(i);
  const R21 = cos(w)*sin(i);
  return {
    pos: [R00*xp+R01*yp, R10*xp+R11*yp, R20*xp+R21*yp],
    r,
    altitude_km: r - R_EARTH,
  };
}

function eciToGeodetic(pos_eci, gmst) {
  const [x, y, z] = pos_eci;
  const lon_rad = Math.atan2(y, x) - gmst;
  const lon = ((deg(lon_rad) + 180) % 360 + 360) % 360 - 180;
  const r = Math.sqrt(x*x + y*y + z*z);
  const lat = deg(Math.asin(z/r));
  const alt = r - R_EARTH;
  return { lat, lon, alt };
}

}

function bfsPath(startId, endId) {
  const visited = new Set([startId]);
  const queue = [[startId]];
  while (queue.length) {
    const path = queue.shift();
    const last = path[path.length - 1];
    if (last === endId) return path;
    const adj = adjacent(last);
    for (const n of adj) {
      if (!visited.has(n.id)) {
        visited.add(n.id);
        queue.push([...path, n.id]);
      }
    }
  }
  return null;
}

  const nodeDefs = [
    { id: 'SUB-A', type: 'substation', label: 'SUB-A' },
    { id: 'SUB-B', type: 'substation', label: 'SUB-B' },
    { id: 'SUB-C', type: 'substation', label: 'SUB-C' },
    { id: 'SUB-D', type: 'substation', label: 'SUB-D' },
    { id: 'GEN-1', type: 'generator',  label: 'GEN-1' },
    { id: 'GEN-2', type: 'generator',  label: 'GEN-2' },
    { id: 'GEN-3', type: 'generator',  label: 'GEN-3' },
    { id: 'CTRL',  type: 'control',    label: 'CTRL'  },
  ];
  STATE.nodes = nodeDefs.map(d => ({
    ...d, x: 0, y: 0,
    state: 'healthy',
    resilience: 0,
    pulsePhase: Math.random() * Math.PI * 2,
  }));
  STATE.links = [
    ['CTRL','SUB-A'], ['CTRL','SUB-B'], ['CTRL','SUB-C'], ['CTRL','SUB-D'],
    ['GEN-1','SUB-A'], ['GEN-1','SUB-B'],
    ['GEN-2','SUB-B'], ['GEN-2','SUB-C'],
    ['GEN-3','SUB-C'], ['GEN-3','SUB-D'],
    ['SUB-A','SUB-B'], ['SUB-C','SUB-D'],
  ];
  document.getElementById('view-toggle').classList.remove('active');
  layoutEnergyGrid();
}

function layoutEnergyGrid() {
  const margin = 32;
  const w = CW - margin * 2;
  const h = CH - margin * 2;
  const byId = {};
  STATE.nodes.forEach(n => byId[n.id] = n);
  ['GEN-1','GEN-2','GEN-3'].forEach((id, i) => {
    const n = byId[id]; if (!n) return;
    n.x = margin + w * (0.2 + i * 0.3);
    n.y = margin + h * 0.18;
  });
  ['SUB-A','SUB-B','SUB-C','SUB-D'].forEach((id, i) => {
    const n = byId[id]; if (!n) return;
    n.x = margin + w * (0.12 + i * 0.25);
    n.y = margin + h * 0.55;
  });
  if (byId['CTRL']) {
    byId['CTRL'].x = margin + w * 0.5;
    byId['CTRL'].y = margin + h * 0.88;
  }
}

function renderEnergyMap() {
  drawBackgroundGrid();
  STATE.links.forEach(([a, b]) => drawLink(getNode(a), getNode(b)));
  updateParticles();
  drawParticles();
  STATE.nodes.forEach(drawNode);
  updateAttackChains();
  drawAttackChains();
  if (STATE.selectedTarget) {
    const n = getNode(STATE.selectedTarget);
    if (n) drawSelectionHalo(n);
  }
  STATE.plannedActions.forEach((a, idx) => {
    const n = getNode(a.target);
    if (!n) return;
    const ag = STATE.agents[a.agent];
    drawQueueMarker(n, ag.color, idx);
  });
}

// 8. SATELLITE MISSION (NIGHTWATCH)
// =============================================================================
function setupSatelliteOps() {
  const assets = [
    { id:'NWATCH-1', type:'sat-geo', label:'NWATCH-1',
      orbit:{ incl: 0.05, raan: 60, ecc: 0.0001, aop: 0, ma: 0, mm: 1.0027 } },
    { id:'NWATCH-2', type:'sat-leo', label:'NWATCH-2',
      orbit:{ incl: 97.5, raan: 30, ecc: 0.0012, aop: 0, ma: 0, mm: 15.2 } },
    { id:'NWATCH-3', type:'sat-leo', label:'NWATCH-3',
      orbit:{ incl: 97.5, raan: 30, ecc: 0.0012, aop: 0, ma: 180, mm: 15.2 } },
    { id:'KEYSTONE', type:'ground', label:'KEYSTONE GS', lat: 39.0, lon: -77.0 },
    { id:'MCC',      type:'mcc',    label:'MISSION CTRL', lat: 34.0, lon: -118.0 },
  ];
  STATE.nodes = assets.map(a => ({
    ...a,
    state: 'healthy',
    resilience: 0,
    pulsePhase: Math.random() * Math.PI * 2,
    eciPos: null,
    geoPos: null,
    x: 0, y: 0,
  }));
  STATE.links = [
    ['NWATCH-1','KEYSTONE'],
    ['NWATCH-2','KEYSTONE'],
    ['NWATCH-3','KEYSTONE'],
    ['KEYSTONE','MCC'],
  ];
  STATE.rpoVehicle = {
    id:'RPO-X', type:'sat-leo', label:'RPO-X',
    state: 'attacked',
    orbit: { incl: 97.5, raan: 30, ecc: 0.0012, aop: 0, ma: -15, mm: 15.21 },
    closingRate: 0.05,
    eciPos: null, geoPos: null, x: 0, y: 0,
    pulsePhase: 0,
  };
  STATE.simTimeMin = 0;
  STATE.satView = 'orbital';
  document.getElementById('view-toggle').classList.add('active');
}

function projectLatLonToScreen(lat, lon, view) {
  if (view === 'orbital') {
    const ea = { x: 0, y: CH * 0.55, w: CW, h: CH * 0.40 };
    return {
      x: ea.x + ((lon + 180) / 360) * ea.w,
      y: ea.y + ((90 - lat) / 180) * ea.h,
    };
  } else if (view === 'ground') {
    return {
      x: ((lon + 180) / 360) * CW,
      y: ((90 - lat) / 180) * CH,
    };
  }
  return { x: CW/2, y: CH/2 };
}

function projectOrbitToScreen(eciPos) {
  const cx = CW/2, cy = CH * 0.27;
  const r = Math.min(CW, CH * 0.5) * 0.40;
  const scale = r / 45000;
  return { x: cx + eciPos[0] * scale, y: cy - eciPos[1] * scale };
}

function updateSatellitePositions() {
  STATE.simTimeMin += 0.4;
  STATE.nodes.forEach(n => {
    if (n.type === 'sat-geo' || n.type === 'sat-leo') {
      const { pos } = propagateOrbit(n.orbit, STATE.simTimeMin);
      n.eciPos = pos;
      const gmst = (STATE.simTimeMin / 1440) * 2 * Math.PI;
      n.geoPos = eciToGeodetic(pos, gmst);
    }
  });
  if (STATE.rpoVehicle) {
    STATE.rpoVehicle.orbit.ma += STATE.rpoVehicle.closingRate * 0.4;
    const { pos } = propagateOrbit(STATE.rpoVehicle.orbit, STATE.simTimeMin);
    STATE.rpoVehicle.eciPos = pos;
    const gmst = (STATE.simTimeMin / 1440) * 2 * Math.PI;
    STATE.rpoVehicle.geoPos = eciToGeodetic(pos, gmst);
  }
}

function renderSatelliteMap() {
  updateSatellitePositions();
  if (STATE.satView === 'orbital')      renderOrbitalView();
  else if (STATE.satView === 'ground')  renderGroundView();
  else if (STATE.satView === 'tactical')renderTacticalView();
  updateAttackChains();
  drawAttackChains();
  if (STATE.selectedTarget) {
    const n = getNode(STATE.selectedTarget);
    if (n && typeof n.x === 'number') drawSelectionHalo(n);
  }
  STATE.plannedActions.forEach((a, idx) => {
    const n = getNode(a.target);
    if (!n || typeof n.x !== 'number') return;
    const ag = STATE.agents[a.agent];
    drawQueueMarker(n, ag.color, idx);
  });
}

function renderOrbitalView() {
  drawStarfield();
  drawStylizedEarth();
  STATE.nodes.forEach(n => {
    if (n.type === 'sat-geo' || n.type === 'sat-leo') drawOrbitTrace(n, false);
  });
  if (STATE.rpoVehicle) drawOrbitTrace(STATE.rpoVehicle, true);
  STATE.nodes.forEach(n => {
    if (n.type === 'sat-geo' || n.type === 'sat-leo') drawGroundTrack(n);
  });
  STATE.nodes.forEach(n => {
    if (n.type === 'ground' || n.type === 'mcc') {
      const p = projectLatLonToScreen(n.lat, n.lon, 'orbital');
      n.x = p.x; n.y = p.y;
      drawGroundNode(n);
    }
  });
  STATE.nodes.forEach(n => {
    if (n.type === 'sat-geo' || n.type === 'sat-leo') {
      const p = projectOrbitToScreen(n.eciPos);
      n.x = p.x; n.y = p.y;
      drawSatNode(n);
    }
  });
  if (STATE.rpoVehicle) {
    const p = projectOrbitToScreen(STATE.rpoVehicle.eciPos);
    STATE.rpoVehicle.x = p.x; STATE.rpoVehicle.y = p.y;
    drawRPONode(STATE.rpoVehicle);
  }
  drawSatLinks();
}

function renderGroundView() {
  drawWorldMapBackground();
  STATE.nodes.forEach(n => {
    if (n.type === 'sat-geo' || n.type === 'sat-leo') drawSatSubpoint(n);
  });
  STATE.nodes.forEach(n => {
    if (n.type === 'ground' || n.type === 'mcc') {
      const p = projectLatLonToScreen(n.lat, n.lon, 'ground');
      n.x = p.x; n.y = p.y;
      drawGroundNode(n);
    }
  });
  const ks = getNode('KEYSTONE'), mcc = getNode('MCC');
  if (ks && mcc) drawLink(ks, mcc);
}

function renderTacticalView() {
  const targetId = STATE.inspectingNode || 'NWATCH-2';
  const target = getNode(targetId) || getNode('NWATCH-2');
  if (!target) return;
  drawStarfield();
  const cx = CW/2, cy = CH/2;
  drawTacticalSatDetail(target, cx, cy);
  if (STATE.rpoVehicle && targetId === 'NWATCH-2') {
    const dma = ((STATE.rpoVehicle.orbit.ma - target.orbit.ma + 540) % 360) - 180;
    const proxAngle = dma * DEG;
    STATE.rpoVehicle.x = cx + Math.cos(proxAngle) * 100;
    STATE.rpoVehicle.y = cy + Math.sin(proxAngle) * 100;
    drawRPOClose(STATE.rpoVehicle, target, cx, cy);
  }
  drawTacticalTelemetry(target);
}


// ----- Drawing primitives -----

function drawBackgroundGrid() {
  ctx.strokeStyle = '#0e2030';
  ctx.lineWidth = 1;
  const step = 24;
  ctx.beginPath();
  for (let x = 0; x < CW; x += step) { ctx.moveTo(x, 0); ctx.lineTo(x, CH); }
  for (let y = 0; y < CH; y += step) { ctx.moveTo(0, y); ctx.lineTo(CW, y); }
  ctx.stroke();
  ctx.strokeStyle = 'rgba(78,226,255,0.06)';
  ctx.beginPath();
  ctx.ellipse(CW/2, CH/2, CW*0.55, CH*0.45, 0, 0, Math.PI*2);
  ctx.stroke();
}

function drawLink(a, b) {
  if (!a || !b) return;
  const aColor = nodeColor(a);
  const bColor = nodeColor(b);
  const compromised = a.state === 'compromised' || b.state === 'compromised';
  const grad = ctx.createLinearGradient(a.x, a.y, b.x, b.y);
  grad.addColorStop(0, hexA(aColor, 0.4));
  grad.addColorStop(1, hexA(bColor, 0.4));
  ctx.strokeStyle = grad;
  ctx.lineWidth = compromised ? 1 : 1.5;
  if (compromised) ctx.setLineDash([4, 4]);
  ctx.beginPath();
  ctx.moveTo(a.x, a.y);
  ctx.lineTo(b.x, b.y);
  ctx.stroke();
  ctx.setLineDash([]);
}

function drawNode(n) {
  const c = nodeColor(n);
  const baseR = n.type === 'control' ? 18 : (n.type === 'generator' ? 15 : 13);
  n.pulsePhase += 0.04;
  const pulse = Math.sin(n.pulsePhase) * 0.5 + 0.5;
  const r = baseR + pulse * 1.5;
  const glow = ctx.createRadialGradient(n.x, n.y, r * 0.5, n.x, n.y, r * 2.4);
  glow.addColorStop(0, hexA(c, 0.5));
  glow.addColorStop(1, hexA(c, 0));
  ctx.fillStyle = glow;
  ctx.beginPath();
  ctx.arc(n.x, n.y, r * 2.4, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#03060a';
  ctx.strokeStyle = c;
  ctx.lineWidth = 2;
  ctx.beginPath();
  if (n.type === 'control') drawPolygon(n.x, n.y, r, 6);
  else if (n.type === 'generator') drawPolygon(n.x, n.y, r, 3, -Math.PI/2);
  else drawPolygon(n.x, n.y, r, 4, Math.PI/4);
  ctx.fill();
  ctx.stroke();
  if (n.state === 'compromised') {
    ctx.fillStyle = c;
    ctx.beginPath(); ctx.arc(n.x, n.y, r * 0.35, 0, Math.PI * 2); ctx.fill();
  } else if (n.state === 'attacked') {
    ctx.strokeStyle = hexA(c, 0.6 + pulse * 0.4);
    ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(n.x, n.y, r * 0.55, 0, Math.PI * 2); ctx.stroke();
  }
  for (let i = 0; i < n.resilience; i++) {
    ctx.fillStyle = '#ffb84d';
    ctx.beginPath(); ctx.arc(n.x - 6 + i * 6, n.y - r - 6, 1.8, 0, Math.PI * 2); ctx.fill();
  }
  ctx.fillStyle = '#5a7080';
  ctx.font = '9px JetBrains Mono, monospace';
  ctx.textAlign = 'center';
  ctx.fillText(n.label, n.x, n.y + r + 12);
  if (n.id === STATE.c2Node && STATE.c2Revealed && !STATE.c2Severed) {
    ctx.fillStyle = '#ff3a3a';
    ctx.font = 'bold 8px JetBrains Mono, monospace';
    ctx.fillText('◢ C2 ◣', n.x, n.y - r - 10);
  }
}

function drawPolygon(cx, cy, r, sides, rot = 0) {
  for (let i = 0; i < sides; i++) {
    const a = rot + i * (Math.PI * 2 / sides);
    const px = cx + Math.cos(a) * r;
    const py = cy + Math.sin(a) * r;
    if (i === 0) ctx.moveTo(px, py);
    else ctx.lineTo(px, py);
  }
  ctx.closePath();
}

function drawSelectionHalo(n) {
  const r = 22 + Math.sin(STATE.tickCount * 0.1) * 2;
  ctx.strokeStyle = '#ffffff';
  ctx.lineWidth = 1.5;
  ctx.setLineDash([3, 3]);
  ctx.beginPath();
  ctx.arc(n.x, n.y, r, 0, Math.PI * 2);
  ctx.stroke();
  ctx.setLineDash([]);
}

function drawQueueMarker(n, color, idx) {
  const offset = (idx + 1) * 14;
  const x = n.x + offset;
  const y = n.y - 18;
  ctx.fillStyle = color;
  ctx.beginPath(); ctx.arc(x, y, 5, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 1; ctx.stroke();
}

// Satellite-specific drawing
function drawStarfield() {
  ctx.fillStyle = '#03060a';
  ctx.fillRect(0, 0, CW, CH);
  ctx.fillStyle = 'rgba(255,255,255,0.4)';
  for (let i = 0; i < 80; i++) {
    const x = ((i * 7919) % 1000) / 1000 * CW;
    const y = ((i * 6151) % 1000) / 1000 * CH;
    const tw = Math.sin(STATE.tickCount * 0.02 + i) * 0.3 + 0.7;
    ctx.globalAlpha = tw * 0.6;
    ctx.fillRect(x, y, 1, 1);
  }
  ctx.globalAlpha = 1;
}

function drawStylizedEarth() {
  const ea = { x: 0, y: CH * 0.55, w: CW, h: CH * 0.40 };
  ctx.fillStyle = '#041820';
  ctx.fillRect(ea.x, ea.y, ea.w, ea.h);
  ctx.strokeStyle = 'rgba(78,226,255,0.10)';
  ctx.lineWidth = 1;
  for (let i = 1; i < 6; i++) {
    const y = ea.y + ea.h * (i/6);
    ctx.beginPath(); ctx.moveTo(ea.x, y); ctx.lineTo(ea.x+ea.w, y); ctx.stroke();
  }
  for (let i = 1; i < 12; i++) {
    const x = ea.x + ea.w * (i/12);
    ctx.beginPath(); ctx.moveTo(x, ea.y); ctx.lineTo(x, ea.y+ea.h); ctx.stroke();
  }
  drawContinents(ea);
  // day/night terminator
  const termFrac = ((STATE.simTimeMin / 1440) % 1);
  const termX = ea.x + termFrac * ea.w;
  const grad = ctx.createLinearGradient(termX - 30, 0, termX + 60, 0);
  grad.addColorStop(0, 'rgba(0,0,0,0)');
  grad.addColorStop(1, 'rgba(0,0,0,0.45)');
  ctx.fillStyle = grad;
  ctx.fillRect(termX, ea.y, ea.w, ea.h);
}

function drawWorldMapBackground() {
  ctx.fillStyle = '#041820';
  ctx.fillRect(0, 0, CW, CH);
  ctx.strokeStyle = 'rgba(78,226,255,0.08)';
  ctx.lineWidth = 1;
  for (let i = 1; i < 12; i++) {
    const y = CH * (i/12);
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(CW, y); ctx.stroke();
  }
  for (let i = 1; i < 12; i++) {
    const x = CW * (i/12);
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, CH); ctx.stroke();
  }
  drawContinents({ x: 0, y: 0, w: CW, h: CH });
}

function drawContinents(area) {
  const continents = [
    [[0.15,0.30],[0.22,0.15],[0.28,0.28],[0.22,0.50],[0.15,0.45]],
    [[0.27,0.50],[0.32,0.62],[0.28,0.85],[0.23,0.80],[0.24,0.62]],
    [[0.45,0.25],[0.55,0.18],[0.58,0.40],[0.50,0.52],[0.46,0.47]],
    [[0.50,0.52],[0.58,0.52],[0.56,0.75],[0.51,0.78]],
    [[0.78,0.60],[0.85,0.58],[0.86,0.72],[0.79,0.70]],
  ];
  ctx.fillStyle = 'rgba(60,140,160,0.25)';
  ctx.strokeStyle = 'rgba(78,226,255,0.35)';
  ctx.lineWidth = 1;
  continents.forEach(poly => {
    ctx.beginPath();
    poly.forEach(([fx, fy], i) => {
      const x = area.x + fx * area.w;
      const y = area.y + fy * area.h;
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    });
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
  });
}

function drawOrbitTrace(n, hostile) {
  ctx.strokeStyle = hostile ? 'rgba(255,58,58,0.25)' : 'rgba(78,226,255,0.15)';
  ctx.lineWidth = 1;
  if (hostile) ctx.setLineDash([3,3]);
  ctx.beginPath();
  const samples = 64;
  const period = 1440 / n.orbit.mm;
  for (let i = 0; i <= samples; i++) {
    const t = STATE.simTimeMin + (i/samples) * period;
    const { pos } = propagateOrbit(n.orbit, t);
    const p = projectOrbitToScreen(pos);
    if (i === 0) ctx.moveTo(p.x, p.y); else ctx.lineTo(p.x, p.y);
  }
  ctx.stroke();
  ctx.setLineDash([]);
}

function drawGroundTrack(n) {
  if (!n.geoPos) return;
  for (let i = 1; i <= 18; i++) {
    const t = STATE.simTimeMin - i * 2;
    const { pos } = propagateOrbit(n.orbit, t);
    const gmst = (t / 1440) * 2 * Math.PI;
    const geo = eciToGeodetic(pos, gmst);
    const p = projectLatLonToScreen(geo.lat, geo.lon, 'orbital');
    ctx.globalAlpha = (1 - i/18) * 0.35;
    ctx.fillStyle = '#4ee2ff';
    ctx.beginPath();
    ctx.arc(p.x, p.y, 1.2, 0, Math.PI*2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function drawSatSubpoint(n) {
  if (!n.geoPos) return;
  const p = projectLatLonToScreen(n.geoPos.lat, n.geoPos.lon, 'ground');
  const c = nodeColor(n);
  ctx.fillStyle = c;
  ctx.strokeStyle = '#fff';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.arc(p.x, p.y, 5, 0, Math.PI*2);
  ctx.fill(); ctx.stroke();
  ctx.fillStyle = c;
  ctx.font = '9px JetBrains Mono, monospace';
  ctx.textAlign = 'center';
  ctx.fillText(n.label, p.x, p.y - 8);
  n.x = p.x; n.y = p.y;
}

function drawSatNode(n) {
  const c = nodeColor(n);
  n.pulsePhase += 0.05;
  const pulse = Math.sin(n.pulsePhase) * 0.5 + 0.5;
  const r = 8 + pulse * 1.5;
  const glow = ctx.createRadialGradient(n.x, n.y, r*0.5, n.x, n.y, r*2.6);
  glow.addColorStop(0, hexA(c, 0.6));
  glow.addColorStop(1, hexA(c, 0));
  ctx.fillStyle = glow;
  ctx.beginPath(); ctx.arc(n.x, n.y, r*2.6, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#03060a';
  ctx.strokeStyle = c;
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(n.x, n.y - r);
  ctx.lineTo(n.x + r, n.y);
  ctx.lineTo(n.x, n.y + r);
  ctx.lineTo(n.x - r, n.y);
  ctx.closePath();
  ctx.fill(); ctx.stroke();
  ctx.strokeStyle = hexA(c, 0.7);
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(n.x - r - 4, n.y); ctx.lineTo(n.x - r, n.y);
  ctx.moveTo(n.x + r, n.y);     ctx.lineTo(n.x + r + 4, n.y);
  ctx.stroke();
  ctx.fillStyle = '#5a7080';
  ctx.font = '8px JetBrains Mono, monospace';
  ctx.textAlign = 'center';
  ctx.fillText(n.label, n.x, n.y - r - 4);
  if (n.state === 'compromised') {
    ctx.fillStyle = '#ff3a3a';
    ctx.font = 'bold 7px JetBrains Mono, monospace';
    ctx.fillText('◢ COMP ◣', n.x, n.y + r + 9);
  }
  if (n.id === STATE.c2Node && STATE.c2Revealed && !STATE.c2Severed) {
    ctx.fillStyle = '#ff3a3a';
    ctx.font = 'bold 7px JetBrains Mono, monospace';
    ctx.fillText('◢ C2 ◣', n.x, n.y + r + 9);
  }
}

function drawGroundNode(n) {
  const c = nodeColor(n);
  n.pulsePhase += 0.04;
  const pulse = Math.sin(n.pulsePhase) * 0.5 + 0.5;
  const r = (n.type === 'mcc' ? 11 : 9) + pulse * 1.2;
  const glow = ctx.createRadialGradient(n.x, n.y, r*0.5, n.x, n.y, r*2.4);
  glow.addColorStop(0, hexA(c, 0.5));
  glow.addColorStop(1, hexA(c, 0));
  ctx.fillStyle = glow;
  ctx.beginPath(); ctx.arc(n.x, n.y, r*2.4, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#03060a';
  ctx.strokeStyle = c;
  ctx.lineWidth = 2;
  ctx.beginPath();
  if (n.type === 'mcc') drawPolygon(n.x, n.y, r, 6);
  else drawPolygon(n.x, n.y, r, 4, Math.PI/4);
  ctx.fill(); ctx.stroke();
  if (n.type === 'ground') {
    ctx.strokeStyle = c;
    ctx.beginPath();
    ctx.arc(n.x, n.y - r - 3, 4, Math.PI, 0);
    ctx.stroke();
  }
  for (let i = 0; i < n.resilience; i++) {
    ctx.fillStyle = '#ffb84d';
    ctx.beginPath(); ctx.arc(n.x - 6 + i*6, n.y - r - 8, 1.8, 0, Math.PI*2); ctx.fill();
  }
  ctx.fillStyle = '#5a7080';
  ctx.font = '9px JetBrains Mono, monospace';
  ctx.textAlign = 'center';
  ctx.fillText(n.label, n.x, n.y + r + 12);

function spawnParticles() {
  STATE.links.forEach(([a, b]) => {
    if (Math.random() < 0.012) {
      STATE.particles.push({
        from: a, to: b, t: 0, speed: 0.012 + Math.random() * 0.01,
        color: '#4ee2ff',
      });
    }
  });
}
function updateParticles() {
  spawnParticles();
  STATE.particles.forEach(p => p.t += p.speed);
  STATE.particles = STATE.particles.filter(p => p.t < 1);
}
function drawParticles() {
  STATE.particles.forEach(p => {
    const a = getNode(p.from);
    const b = getNode(p.to);
    if (!a || !b) return;
    const x = a.x + (b.x - a.x) * p.t;
    const y = a.y + (b.y - a.y) * p.t;
    ctx.fillStyle = hexA(p.color, 0.7);
    ctx.beginPath(); ctx.arc(x, y, 1.5, 0, Math.PI * 2); ctx.fill();
  });
}

function spawnAttackChain(path, kind) {
  STATE.attackChains.push({
    path: path.slice(),
    progress: 0,
    speed: 0.012,
    kind: kind || 'attack',
    sparks: [],
  });
}
function updateAttackChains() {
  STATE.attackChains.forEach(c => {
    c.progress += c.speed;
    if (Math.random() < 0.5 && c.path.length > 1) {
      const segIdx = Math.min(Math.floor(c.progress * (c.path.length - 1)), c.path.length - 2);
      const localT = (c.progress * (c.path.length - 1)) - segIdx;
      const a = getNode(c.path[segIdx]);
      const b = getNode(c.path[segIdx + 1]);
      if (a && b && typeof a.x === 'number' && typeof b.x === 'number') {
        c.sparks.push({
          x: a.x + (b.x - a.x) * localT + (Math.random() - 0.5) * 6,
          y: a.y + (b.y - a.y) * localT + (Math.random() - 0.5) * 6,
          life: 1, vx: (Math.random()-0.5)*0.5, vy: (Math.random()-0.5)*0.5,
        });
      }
    }
    c.sparks.forEach(s => { s.life -= 0.05; s.x += s.vx; s.y += s.vy; });
    c.sparks = c.sparks.filter(s => s.life > 0);
  });
  STATE.attackChains = STATE.attackChains.filter(c => c.progress < 1 || c.sparks.length > 0);
}
function drawAttackChains() {
  STATE.attackChains.forEach(c => {
    if (c.path.length < 2) return;
    const color = c.kind === 'attack' ? '#ff3a3a' : '#5cff8a';
    const totalSegs = c.path.length - 1;
    const filledSegs = Math.floor(c.progress * totalSegs);
    const localT = (c.progress * totalSegs) - filledSegs;
    ctx.lineWidth = 2.5;
    ctx.strokeStyle = color;
    ctx.shadowColor = color;
    ctx.shadowBlur = 10;
    for (let i = 0; i < filledSegs; i++) {
      const a = getNode(c.path[i]);
      const b = getNode(c.path[i+1]);
      if (!a || !b || typeof a.x !== 'number' || typeof b.x !== 'number') continue;
      ctx.beginPath();
      ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y);
      ctx.stroke();
    }
    if (filledSegs < totalSegs) {
      const a = getNode(c.path[filledSegs]);
      const b = getNode(c.path[filledSegs+1]);
      if (a && b && typeof a.x === 'number' && typeof b.x === 'number') {
        const x = a.x + (b.x - a.x) * localT;
        const y = a.y + (b.y - a.y) * localT;
        ctx.beginPath();
        ctx.moveTo(a.x, a.y); ctx.lineTo(x, y);
        ctx.stroke();
        ctx.fillStyle = color;
        ctx.beginPath(); ctx.arc(x, y, 4, 0, Math.PI * 2); ctx.fill();
      }
    }
    ctx.shadowBlur = 0;
    c.sparks.forEach(s => {
      ctx.fillStyle = hexA(color, s.life);
      ctx.beginPath(); ctx.arc(s.x, s.y, 1.5, 0, Math.PI * 2); ctx.fill();
    });
  });
}

function pickC2() {
  if (STATE.mission.id === 'BLACKFROST') {
    const candidates = STATE.nodes.filter(n => n.type !== 'control');
    STATE.c2Node = candidates[Math.floor(Math.random() * candidates.length)].id;
  } else if (STATE.mission.id === 'NIGHTWATCH') {
    STATE.c2Node = Math.random() < 0.5 ? 'KEYSTONE' : 'MCC';
  }
}

function aiPlanThreats() {
  const archetype = STATE.mission.threatArchetype;
  const attacked = STATE.threats.length;
  let desired;
  if (archetype === 'ransomware') {
    desired = STATE.round <= 2 ? 1 : 2;
  } else {
    desired = STATE.round <= 3 ? 1 : 2;
  }
  const launches = Math.max(0, desired - attacked);
  for (let i = 0; i < launches; i++) maybeLaunchThreat();
}

function maybeLaunchThreat() {
  const c2 = getNode(STATE.c2Node);
  if (!c2) return;
  const candidates = STATE.nodes.filter(n =>
    n.id !== STATE.c2Node &&
    n.state !== 'compromised' &&
    !STATE.threats.some(t => t.target === n.id)
  );
  if (candidates.length === 0) return;
  const weighted = [];
  candidates.forEach(n => {
    let w = 1;
    if (STATE.mission.id === 'BLACKFROST') {
      if (n.type === 'control') w = 3;
      else if (n.type === 'generator') w = 2;
    } else if (STATE.mission.id === 'NIGHTWATCH') {
      if (n.type === 'sat-leo') w = 3;
      else if (n.type === 'sat-geo') w = 2;
      else if (n.type === 'mcc') w = 2;
    }
    for (let i = 0; i < w; i++) weighted.push(n);
  });
  const target = weighted[Math.floor(Math.random() * weighted.length)];
  let path = bfsPath(c2.id, target.id) || [c2.id, target.id];
  const initialTechs = STATE.mission.threatMix.filter(tid => {
    const t = TECHNIQUES[tid];
    return t && (t.tactic.includes('Initial Access') || t.tactic.includes('Reconnaissance'));
  });
  const techId = initialTechs.length > 0
    ? initialTechs[Math.floor(Math.random() * initialTechs.length)]
    : STATE.mission.threatMix[0];
  STATE.threats.push({
    target: target.id,
    path,
    phase: 0,
    techniqueId: techId,
    revealed: false,
    history: [techId],
    spawnRound: STATE.round,
  });
  STATE.metrics.threatSpawns.push({ round: STATE.round, target: target.id, techniqueId: techId });
  if (target.state === 'healthy') target.state = 'attacked';
}

// v0.2.1: Metrics capture
function recordAction(agentId, actionId, targetId, outcome, wasteReason, techniqueIds) {
  STATE.metrics.actions.push({
    round: STATE.round,
    agentId, actionId, targetId,
    outcome,         // 'effective' | 'wasted' | 'partial'
    wasteReason,     // null or string like 'empty target', 'redundant', 'no c2'
    techniqueIds: techniqueIds || [],
  });
}

function recordTechniqueObserved(tid) {
  if (!tid) return;
  STATE.observedTTPs[tid] = (STATE.observedTTPs[tid] || 0) + 1;
  if (STATE.metrics.firstThreatRevealedRound === null) {
    STATE.metrics.firstThreatRevealedRound = STATE.round;
  }
}

function captureRoundMetrics() {
  const round = STATE.round;
  const actionsThisRound = STATE.metrics.actions.filter(a => a.round === round);
  const effective = actionsThisRound.filter(a => a.outcome === 'effective').length;
  const wasted = actionsThisRound.filter(a => a.outcome === 'wasted').length;
  const compromisedNow = STATE.nodes.filter(n => n.state === 'compromised').length;
  const prev = STATE.metrics.rounds[STATE.metrics.rounds.length - 1];
  const compromisedThisRound = compromisedNow - (prev ? prev.compromisedTotal : 0);
  STATE.metrics.rounds.push({
    round,
    threatsActive: STATE.threats.length,
    threatsRevealed: STATE.threats.filter(t => t.revealed).length,
    effectiveActions: effective,
    wastedActions: wasted,
    compromisedTotal: compromisedNow,
    compromisedThisRound,
    hardeningCharges: STATE.nodes.reduce((s, n) => s + (n.resilience || 0), 0),
  });
}

// Find repeat-failure patterns: same agent doing the same wasteful thing more than once
function detectRepeatFailures() {
  const wasted = STATE.metrics.actions.filter(a => a.outcome === 'wasted');
  const seen = new Map();   // key = `${agent}:${action}:${reason}` -> first round
  const repeats = [];
  wasted.forEach(a => {
    const key = `${a.agentId}:${a.actionId}:${a.wasteReason}`;
    if (seen.has(key)) {
      repeats.push({
        round: a.round, agentId: a.agentId, actionId: a.actionId,
        wasteReason: a.wasteReason, firstRound: seen.get(key),
      });
    } else {
      seen.set(key, a.round);
    }
  });
  return repeats;
}

// Compute final rubric scores for debrief
function computeRubric() {
  const m = STATE.metrics;
  const rounds = m.rounds.length || 1;
  const totalActions = m.actions.length || 1;
  const effective = m.actions.filter(a => a.outcome === 'effective').length;
  const wasted = m.actions.filter(a => a.outcome === 'wasted').length;
  const compromised = STATE.nodes.filter(n => n.state === 'compromised').length;
  const cascadeHits = m.rounds.reduce((s, r) => s + Math.max(0, r.compromisedThisRound - 1), 0);

  // 1. Detection speed: lower round number = better. Score 100 if revealed by round 2.
  let detectionScore = 0;
  if (m.firstThreatRevealedRound !== null) {
    const r = m.firstThreatRevealedRound;
    detectionScore = Math.max(0, Math.min(100, 100 - (r - 2) * 15));
  }

  // 2. C2 attribution: optimal by round 4. 100 if revealed early, 0 if never.
  let attributionScore = 0;
  if (m.c2RevealedRound !== null) {
    const r = m.c2RevealedRound;
    attributionScore = Math.max(0, Math.min(100, 100 - (r - 4) * 12));
  }

  // 3. Agent efficiency: % effective
  const efficiencyScore = Math.round((effective / totalActions) * 100);

  // 4. Hardening economy: charges absorbed / charges spent
  // We don't track absorbed yet — approximate via current resilience vs max ever
  const hardenActions = m.actions.filter(a => a.actionId === 'harden' && a.outcome === 'effective').length;
  const restoreActions = m.actions.filter(a => a.actionId === 'restore' && a.outcome === 'effective').length;
  // Heuristic: if you hardened and few cascade hits = good economy
  let hardeningScore = 50;
  if (hardenActions > 0) {
    const ratio = (hardenActions - cascadeHits) / hardenActions;
    hardeningScore = Math.round(Math.max(0, Math.min(100, 50 + ratio * 50)));
  } else if (cascadeHits === 0 && compromised <= 1) {
    hardeningScore = 70;  // didn't need to harden
  } else {
    hardeningScore = 25;  // didn't harden when you should have
  }

  // 5. Cascade containment
  const cascadeScore = compromised === 0
    ? 100
    : Math.max(0, Math.min(100, 100 - cascadeHits * 25 - compromised * 10));

  // 6. Doctrine
  let doctrineScore = 0;
  if (STATE.c2Severed) doctrineScore = 100;
  else if (STATE.phase === 'WIN') doctrineScore = 70;
  else doctrineScore = 0;

  return {
    detection: { score: detectionScore, label: scoreLabel(detectionScore),
      detail: m.firstThreatRevealedRound !== null
        ? `First threat revealed: round ${m.firstThreatRevealedRound}/${STATE.mission.maxRounds} (target: ≤2)`
        : 'No threats revealed during run.' },
    attribution: { score: attributionScore, label: scoreLabel(attributionScore),
      detail: m.c2RevealedRound !== null
        ? `C2 located: round ${m.c2RevealedRound} (optimal: ≤4)`
        : 'C2 never located.' },
    efficiency: { score: efficiencyScore, label: scoreLabel(efficiencyScore),
      detail: `${effective}/${totalActions} actions produced effect (${Math.round(effective/totalActions*100)}%). Wasted: ${wasted}.` },
    hardening: { score: hardeningScore, label: scoreLabel(hardeningScore),
      detail: `${hardenActions} HARDEN, ${restoreActions} RESTORE applied. Cascades: ${cascadeHits}.` },
    cascade: { score: cascadeScore, label: scoreLabel(cascadeScore),
      detail: `${compromised} compromised, ${cascadeHits} cascade hit${cascadeHits !== 1 ? 's' : ''}.` },
    doctrine: { score: doctrineScore, label: doctrineLabel(),
      detail: STATE.c2Severed ? 'C2 severed — adversary command neutralized.'
        : STATE.phase === 'WIN' ? 'Defense held through round limit.'
        : 'Defense breached.' },
  };
}

function scoreLabel(s) {
  if (s >= 85) return 'EXCELLENT';
  if (s >= 65) return 'GOOD';
  if (s >= 45) return 'ADEQUATE';
  if (s >= 25) return 'POOR';
  return 'CRITICAL';
}
function doctrineLabel() {
  if (STATE.c2Severed) return 'DECISIVE';
  if (STATE.phase === 'WIN') return 'DEFENSIVE HOLD';
  return 'BREACHED';
}

function generateCFINote(rubric) {
  const notes = [];
  if (rubric.detection.score < 50) notes.push('Detection lag exposed assets early. Front-load VIGIL ▸ DEEP SCAN before committing offensive actions.');
  if (rubric.attribution.score < 50 && STATE.metrics.c2RevealedRound === null) notes.push('Without C2 attribution, you cannot SEVER. TRACE C2 yields better odds after multiple threats are revealed.');
  if (rubric.efficiency.score < 60) notes.push('Wasted actions reduced your effective tempo. SCAN before DISRUPT — confirm threat presence first.');
  if (rubric.hardening.score < 50) notes.push('Hardening economy was inefficient — applied either too late or to wrong targets.');
  const repeats = detectRepeatFailures();
  if (repeats.length > 0) notes.push(`${repeats.length} repeat failure pattern${repeats.length > 1 ? 's' : ''} detected — see MOVES tab.`);
  if (rubric.cascade.score >= 85) notes.push('Excellent cascade containment.');
  if (rubric.doctrine.score === 100) notes.push('Decisive operational result.');
  if (notes.length === 0) notes.push('Run within parameters. Consider higher difficulty.');
  return notes.join(' ');
}
