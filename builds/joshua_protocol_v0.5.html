<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#03060a">
<title>JOSHUA PROTOCOL v0.5</title>
<style>
  :root {
    --bg-deep: #03060a;
    --bg-panel: #06101a;
    --bg-panel-2: #0a1824;
    --grid-line: #0e2030;
    --cyan: #4ee2ff;
    --cyan-dim: #2a8aa0;
    --amber: #ffb84d;
    --amber-dim: #a07028;
    --magenta: #ff4ea8;
    --magenta-dim: #a02868;
    --red: #ff3a3a;
    --red-dim: #802020;
    --green: #5cff8a;
    --white: #e8f4ff;
    --muted: #5a7080;
    --term-glow: rgba(78, 226, 255, 0.15);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: var(--bg-deep); color: var(--white);
    font-family: 'JetBrains Mono', 'Courier New', ui-monospace, monospace;
    font-size: 13px; line-height: 1.4;
    user-select: none; -webkit-user-select: none;
    touch-action: manipulation;
    overscroll-behavior: none;
  }
  #app {
    width: 100vw; height: 100vh; height: 100dvh;
    display: flex; flex-direction: column;
    position: relative;
    background: linear-gradient(180deg, #04080d 0%, #03060a 100%);
    overflow: hidden;
  }
  #app::after {
    content: ''; position: fixed; inset: 0; pointer-events: none;
    background: repeating-linear-gradient(
      0deg, rgba(78,226,255,0.025) 0px, rgba(78,226,255,0.025) 1px,
      transparent 1px, transparent 3px);
    z-index: 100;
  }
  #status-bar {
    flex: 0 0 auto;
    padding: 6px 10px;
    background: linear-gradient(180deg, #08141e 0%, #050b13 100%);
    border-bottom: 1px solid var(--grid-line);
    display: grid; grid-template-columns: auto 1fr auto;
    align-items: center; gap: 8px;
    font-size: 10px; letter-spacing: 0.05em;
  }
  .status-tag { color: var(--cyan); text-transform: uppercase; }
  .status-val { color: var(--white); font-weight: bold; }
  .status-mid { text-align: center; color: var(--muted); }
  .threat-low { color: var(--green); }
  .threat-med { color: var(--amber); }
  .threat-high { color: var(--red); animation: pulseRed 1.2s infinite; }
  @keyframes pulseRed { 0%,100% { opacity: 1; } 50% { opacity: 0.5; } }

  #map-area {
    flex: 1 1 auto;
    position: relative; overflow: hidden;
    min-height: 220px;
  }
  #map-canvas { width: 100%; height: 100%; display: block; }

  #view-toggle {
    position: absolute; top: 8px; left: 50%;
    transform: translateX(-50%);
    display: none; gap: 0;
    background: rgba(3, 6, 10, 0.88);
    border: 1px solid var(--cyan-dim);
    border-radius: 3px; overflow: hidden;
    z-index: 5;
  }
  #view-toggle.active { display: flex; }
  .view-btn {
    padding: 5px 9px;
    background: transparent; border: none;
    color: var(--muted);
    font-family: inherit; font-size: 9px;
    letter-spacing: 0.1em; cursor: pointer;
    border-right: 1px solid var(--grid-line);
    text-transform: uppercase;
  }
  .view-btn:last-child { border-right: none; }
  .view-btn.active {
    color: var(--cyan);
    background: rgba(78,226,255,0.1);
  }

  #settings-btn {
    position: absolute; top: 6px; right: 6px;
    width: 28px; height: 28px;
    background: rgba(3,6,10,0.7);
    border: 1px solid var(--cyan-dim);
    border-radius: 3px;
    color: var(--cyan);
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    z-index: 5; font-size: 14px;
  }

  .map-overlay-text {
    position: absolute; pointer-events: none;
    font-size: 9px; color: var(--cyan-dim);
    letter-spacing: 0.1em; text-transform: uppercase;
  }
  .tap-hint {
    position: absolute; bottom: 4px; left: 0; right: 0;
    text-align: center;
    font-size: 9px; color: var(--muted);
    pointer-events: none;
    text-transform: uppercase; letter-spacing: 0.1em;
  }

  #terminal {
    flex: 0 0 160px; height: 160px; max-height: 160px;
    background: linear-gradient(180deg, #050d15 0%, #030709 100%);
    border-top: 1px solid var(--cyan-dim);
    border-bottom: 1px solid var(--grid-line);
    display: flex; flex-direction: column;
    position: relative;
    box-shadow: inset 0 0 30px var(--term-glow);
    overflow: hidden;
  }
  #terminal-tabs {
    flex: 0 0 auto; display: flex;
    border-bottom: 1px solid var(--grid-line);
    background: #04090e;
  }
  .term-tab {
    flex: 1; padding: 5px 4px;
    background: transparent; border: none;
    color: var(--muted);
    font-family: inherit; font-size: 10px;
    letter-spacing: 0.08em; text-transform: uppercase;
    cursor: pointer;
    border-right: 1px solid var(--grid-line);
    transition: all 0.15s;
  }
  .term-tab:last-child { border-right: none; }
  .term-tab.active {
    color: var(--cyan);
    background: linear-gradient(180deg, rgba(78,226,255,0.08) 0%, transparent 100%);
    border-bottom: 2px solid var(--cyan);
  }
  .term-tab .badge {
    display: inline-block; background: var(--red);
    color: var(--white); font-size: 8px;
    padding: 1px 4px; border-radius: 6px; margin-left: 2px;
  }
  #terminal-content {
    flex: 1; overflow-y: auto;
    padding: 6px 8px;
    font-size: 11px; line-height: 1.5;
    scroll-behavior: smooth;
  }
  #terminal-content::-webkit-scrollbar { width: 4px; }
  #terminal-content::-webkit-scrollbar-track { background: transparent; }
  #terminal-content::-webkit-scrollbar-thumb { background: var(--cyan-dim); }

  .log-line { margin-bottom: 3px; word-wrap: break-word; }
  .log-time { color: var(--muted); margin-right: 6px; }
  .log-info { color: var(--white); }
  .log-warn { color: var(--amber); }
  .log-crit { color: var(--red); }
  .log-good { color: var(--green); }
  .log-cyan { color: var(--cyan); }
  .log-josh { color: var(--cyan); border-left: 2px solid var(--cyan); padding-left: 6px; margin: 4px 0; }
  .log-vigil { color: var(--cyan); }
  .log-wraith { color: var(--magenta); }
  .log-anchor { color: var(--amber); }
  .log-tech { color: var(--magenta-dim); font-size: 10px; }
  .log-divider { color: var(--grid-line); margin: 4px 0; letter-spacing: -1px; }
  .framework-tag {
    display: inline-block; font-size: 8px;
    padding: 0 4px; margin-left: 4px;
    border: 1px solid var(--magenta-dim);
    color: var(--magenta);
    border-radius: 2px; letter-spacing: 0.05em;
  }
  .framework-tag.attack { border-color: #c04080; color: #ff6090; }
  .framework-tag.ics { border-color: #c08020; color: #ffaa50; }
  .framework-tag.sparta { border-color: #4080c0; color: #60a0ff; }
  .framework-tag.atlas { border-color: #40c080; color: #60ffa0; }
  .framework-tag.d3fend { border-color: #2a8aa0; color: #4ee2ff; }

  .codex-entry {
    margin-bottom: 12px; padding-bottom: 8px;
    border-bottom: 1px solid var(--grid-line);
  }
  .codex-id { color: var(--cyan); font-weight: bold; font-size: 11px; }
  .codex-name { color: var(--white); font-weight: bold; }
  .codex-desc { color: var(--muted); font-size: 10px; margin-top: 3px; }
  .codex-tools { color: var(--green); font-size: 9px; margin-top: 3px; }
  .codex-counters { color: var(--amber); font-size: 9px; margin-top: 2px; }

  #agent-strip {
    flex: 0 0 auto;
    padding: 4px 6px;
    background: #04090e;
    border-top: 1px solid var(--grid-line);
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 4px;
  }
  .agent-card {
    background: linear-gradient(180deg, #0a141d 0%, #060c14 100%);
    border: 1px solid var(--grid-line);
    border-radius: 2px;
    padding: 3px;
    display: flex; align-items: center; gap: 5px;
    cursor: pointer;
    transition: all 0.2s;
    position: relative; overflow: hidden;
    min-height: 44px;
  }
  .agent-card.active {
    border-color: var(--accent);
    box-shadow: 0 0 12px var(--accent-glow);
  }
  .agent-card.exhausted { opacity: 0.4; }
  .agent-card.speaking::before {
    content: ''; position: absolute; inset: 0;
    background: radial-gradient(circle at 20% 50%, var(--accent-glow) 0%, transparent 60%);
    pointer-events: none;
    animation: speakPulse 0.8s ease-out;
  }
  @keyframes speakPulse { 0% { opacity: 1; } 100% { opacity: 0; } }
  .agent-portrait { width: 36px; height: 36px; flex: 0 0 auto; }
  .agent-info { flex: 1; min-width: 0; }
  .agent-name {
    font-size: 11px; font-weight: bold;
    color: var(--accent); letter-spacing: 0.05em;
  }
  .agent-class {
    font-size: 9px; color: var(--muted);
    text-transform: uppercase;
  }
  .agent-status {
    font-size: 9px; color: var(--white);
    margin-top: 2px;
  }

  #action-bar {
    flex: 0 0 auto;
    padding: 5px 6px 6px;
    background: #02050a;
    border-top: 1px solid var(--cyan-dim);
    display: flex; gap: 5px;
  }
  .action-btn {
    flex: 1;
    padding: 8px 6px;
    background: linear-gradient(180deg, #0d1c2a 0%, #07111a 100%);
    border: 1px solid var(--cyan-dim);
    color: var(--cyan);
    font-family: inherit; font-size: 11px;
    font-weight: bold; letter-spacing: 0.08em;
    text-transform: uppercase;
    cursor: pointer;
    border-radius: 2px;
    transition: all 0.15s;
    position: relative;
  }
  .action-btn:active { transform: scale(0.97); }
  .action-btn:disabled { opacity: 0.3; cursor: not-allowed; }
  .action-btn.primary {
    background: linear-gradient(180deg, #0f3848 0%, #082028 100%);
    border-color: var(--cyan);
    box-shadow: 0 0 8px rgba(78,226,255,0.3);
  }
  .action-btn.danger { border-color: var(--red); color: var(--red); }
  .action-btn.attract { animation: attractPulse 1.4s ease-in-out infinite; }
  @keyframes attractPulse {
    0%, 100% { box-shadow: 0 0 8px rgba(78,226,255,0.3); }
    50% { box-shadow: 0 0 18px rgba(78,226,255,0.85), 0 0 30px rgba(78,226,255,0.4); }
  }

  .modal {
    position: absolute; inset: 0;
    background: rgba(3, 6, 10, 0.92);
    z-index: 50;
    display: flex; align-items: center; justify-content: center;
    padding: 16px;
    backdrop-filter: blur(2px);
    overflow-y: auto;
  }
  .modal-content {
    width: 100%; max-width: 360px;
    background: linear-gradient(180deg, #0a1824 0%, #050b13 100%);
    border: 1px solid var(--cyan);
    box-shadow: 0 0 24px rgba(78,226,255,0.4);
    padding: 14px;
    font-size: 11px;
    max-height: 90vh; overflow-y: auto;
  }

  /* v0.5: Tutorial demo narrator card — non-blocking overlay */
  #narrator-card {
    position: absolute;
    left: 8px;
    right: 8px;
    bottom: 8px;
    z-index: 55;
    background: linear-gradient(180deg, rgba(8, 24, 36, 0.96) 0%, rgba(5, 11, 19, 0.96) 100%);
    border: 1px solid var(--cyan);
    border-left: 3px solid var(--cyan);
    box-shadow: 0 0 18px rgba(78, 226, 255, 0.35);
    padding: 10px 12px 12px;
    color: var(--white);
    font-size: 11px;
    line-height: 1.5;
    max-height: 45vh;
    overflow-y: auto;
    transition: opacity 0.25s, transform 0.25s;
    display: none;
  }
  #narrator-card.shown { display: block; opacity: 1; transform: translateY(0); }
  #narrator-card .narrator-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    color: var(--cyan);
    font-size: 9px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    font-weight: bold;
    margin-bottom: 4px;
  }
  #narrator-card .narrator-text {
    font-size: 11px;
    line-height: 1.55;
  }
  #narrator-card .narrator-buttons {
    display: flex;
    gap: 6px;
    margin-top: 8px;
  }
  #narrator-card .narrator-btn {
    flex: 1;
    background: rgba(78, 226, 255, 0.08);
    border: 1px solid var(--cyan-dim);
    color: var(--cyan);
    padding: 6px 8px;
    font-family: inherit;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    cursor: pointer;
  }
  #narrator-card .narrator-btn.primary {
    background: rgba(78, 226, 255, 0.16);
    border-color: var(--cyan);
    color: var(--cyan);
  }
  #narrator-card .narrator-btn.danger {
    color: var(--amber);
    border-color: var(--amber);
  }

  /* DEMO badge in status bar */
  .demo-badge {
    background: linear-gradient(180deg, #2a4a6a 0%, #142838 100%);
    color: var(--cyan);
    font-size: 9px;
    font-weight: bold;
    letter-spacing: 0.1em;
    padding: 2px 6px;
    border: 1px solid var(--cyan);
    margin-right: 6px;
  }
  .modal-title {
    font-size: 13px; font-weight: bold;
    color: var(--cyan);
    text-transform: uppercase; letter-spacing: 0.1em;
    margin-bottom: 8px;
    border-bottom: 1px solid var(--grid-line);
    padding-bottom: 6px;
  }
  .modal-body { margin-bottom: 12px; line-height: 1.6; }
  .modal-body p { margin-bottom: 8px; }

  .mission-card {
    background: linear-gradient(180deg, #0a141d 0%, #060c14 100%);
    border: 1px solid var(--grid-line);
    border-radius: 2px;
    padding: 10px; margin-bottom: 8px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .mission-card:hover, .mission-card:active {
    border-color: var(--cyan);
    box-shadow: 0 0 12px rgba(78,226,255,0.3);
  }
  .mission-name {
    font-size: 12px; font-weight: bold;
    color: var(--cyan); margin-bottom: 4px;
    letter-spacing: 0.05em;
  }
  .mission-domain {
    font-size: 9px; color: var(--amber);
    text-transform: uppercase; margin-bottom: 6px;
  }
  .mission-desc {
    font-size: 10px; color: var(--muted);
    line-height: 1.5;
  }

  #boot {
    position: absolute; inset: 0;
    background: var(--bg-deep);
    z-index: 200;
    display: flex; flex-direction: column;
    justify-content: center; align-items: center;
    padding: 20px; font-size: 12px;
  }
  #boot-text {
    width: 100%; max-width: 320px;
    color: var(--cyan);
    white-space: pre-wrap;
    line-height: 1.6;
    min-height: 280px;
  }
  .cursor::after {
    content: '_';
    animation: blink 0.8s infinite;
    color: var(--cyan);
  }
  @keyframes blink { 0%,49% { opacity: 1; } 50%,100% { opacity: 0; } }

  #replay-overlay {
    position: absolute; inset: 0;
    background: rgba(3,6,10,0.95);
    z-index: 30;
    display: none;
    flex-direction: column;
    padding: 16px;
  }
  #replay-overlay.active { display: flex; }
  .replay-title {
    font-size: 11px; color: var(--cyan);
    letter-spacing: 0.15em; text-transform: uppercase;
    margin-bottom: 8px; text-align: center;
  }
  #replay-canvas {
    flex: 1;
    width: 100%;
    border: 1px solid var(--cyan-dim);
    background: #03060a;
    min-height: 100px;
  }
  .replay-card-stack {
    display: flex; gap: 6px;
    overflow-x: auto;
    padding: 8px 0;
    flex: 0 0 auto;
  }
  .replay-card {
    flex: 0 0 auto;
    width: 110px;
    padding: 6px;
    background: linear-gradient(180deg, #0a141d 0%, #060c14 100%);
    border: 1px solid var(--magenta-dim);
    border-radius: 2px;
    font-size: 9px;
    opacity: 0;
    transform: translateY(8px);
    transition: all 0.4s;
  }
  .replay-card.shown { opacity: 1; transform: translateY(0); }
  .replay-card.counter { border-color: var(--green); }
  .replay-card .rc-id {
    color: var(--magenta); font-weight: bold;
    margin-bottom: 2px; font-size: 10px;
  }
  .replay-card.counter .rc-id { color: var(--green); }
  .replay-card .rc-name { color: var(--white); margin-bottom: 3px; }
  .replay-card .rc-fw {
    font-size: 8px; color: var(--muted);
    letter-spacing: 0.05em;
  }
  #replay-skip { margin-top: 8px; flex: 0 0 auto; }

  .settings-row {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 10px;
    padding: 6px 0;
    border-bottom: 1px solid var(--grid-line);
  }
  .settings-label {
    color: var(--cyan); font-size: 11px;
    text-transform: uppercase; letter-spacing: 0.05em;
  }
  .verbosity-toggle {
    display: flex; gap: 0;
    border: 1px solid var(--cyan-dim);
    border-radius: 2px;
    overflow: hidden;
  }
  .verbosity-btn {
    padding: 5px 10px;
    background: transparent; border: none;
    color: var(--muted);
    font-family: inherit; font-size: 10px;
    cursor: pointer;
    text-transform: uppercase; letter-spacing: 0.05em;
    border-right: 1px solid var(--grid-line);
  }
  .verbosity-btn:last-child { border-right: none; }
  .verbosity-btn.active {
    color: var(--cyan);
    background: rgba(78,226,255,0.15);
  }

  /* v0.2.1: tappable technique IDs in log */
  .tech-tap {
    color: var(--cyan);
    text-decoration: underline dotted;
    text-decoration-color: var(--cyan-dim);
    cursor: pointer;
    font-weight: bold;
  }
  .tech-tap:hover, .tech-tap:active {
    color: var(--white);
    background: rgba(78,226,255,0.15);
    text-decoration-color: var(--cyan);
  }

  /* v0.2.1: full-screen debrief */
  .debrief-overlay {
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, #050d15 0%, #03060a 100%);
    z-index: 60;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .debrief-header {
    flex: 0 0 auto;
    padding: 14px 16px 10px;
    background: linear-gradient(180deg, #08141e 0%, #050b13 100%);
  }
  .debrief-tabs {
    flex: 0 0 auto;
    display: flex;
    border-bottom: 1px solid var(--grid-line);
    background: #04090e;
  }
  .debrief-tab {
    flex: 1;
    padding: 9px 4px;
    background: transparent;
    border: none;
    color: var(--muted);
    font-family: inherit;
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    cursor: pointer;
    border-right: 1px solid var(--grid-line);
  }
  .debrief-tab:last-child { border-right: none; }
  .debrief-tab.active {
    color: var(--cyan);
    background: linear-gradient(180deg, rgba(78,226,255,0.08) 0%, transparent 100%);
    border-bottom: 2px solid var(--cyan);
  }
  .debrief-body {
    flex: 1;
    overflow-y: auto;
    padding: 14px;
    font-size: 11px;
    line-height: 1.5;
  }
  .debrief-footer {
    flex: 0 0 auto;
    padding: 8px;
    background: #02050a;
    border-top: 1px solid var(--cyan-dim);
    display: flex;
    gap: 6px;
  }

  .rubric-overall {
    text-align: center;
    margin-bottom: 14px;
    padding: 10px;
    background: rgba(78,226,255,0.04);
    border: 1px solid var(--cyan-dim);
    border-radius: 2px;
  }
  .rubric-row {
    margin-bottom: 12px;
    padding-bottom: 10px;
    border-bottom: 1px solid var(--grid-line);
  }
  .rubric-label {
    color: var(--cyan);
    font-size: 10px;
    font-weight: bold;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }
  .rubric-bar-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 4px;
  }
  .rubric-bar {
    font-family: monospace;
    letter-spacing: -1px;
    font-size: 12px;
  }
  .rubric-score {
    color: var(--white);
    font-weight: bold;
    min-width: 28px;
    text-align: right;
  }
  .rubric-tag {
    font-size: 9px;
    letter-spacing: 0.08em;
  }
  .rubric-detail {
    color: var(--muted);
    font-size: 10px;
    margin-top: 4px;
  }

  .trend-block {
    margin-bottom: 12px;
    padding: 8px;
    background: rgba(78,226,255,0.03);
    border: 1px solid var(--grid-line);
    border-radius: 2px;
  }
  .trend-label {
    color: var(--cyan);
    font-size: 9px;
    font-weight: bold;
    letter-spacing: 0.1em;
  }
  .trend-spark {
    font-size: 18px;
    letter-spacing: 1px;
    margin: 4px 0;
    line-height: 1;
  }
  .trend-detail {
    color: var(--muted);
    font-size: 9px;
  }

  .moves-table {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    line-height: 1.7;
  }
  .moves-row {
    padding: 2px 4px;
    border-bottom: 1px dotted var(--grid-line);
    white-space: nowrap;
    overflow-x: auto;
  }
  .moves-rnd { color: var(--muted); margin-right: 8px; }
  .moves-agent { font-weight: bold; margin-right: 6px; }
  .moves-action { color: var(--cyan-dim); margin-right: 6px; }

const GM_EARTH = 398600.4418;       // km³/s²
const R_EARTH  = 6378.137;          // km WGS-84
const J2       = 1.08263e-3;
const C        = 299792.458;        // km/s
const K_BOLT   = -228.6;            // dBW/K/Hz
const DEG = Math.PI / 180;
const RAD = 180 / Math.PI;

const deg = r => r * RAD;
const rad = d => d * DEG;
const clamp = (x, lo, hi) => Math.max(lo, Math.min(hi, x));

// AeroSec-Lab simplified SGP4 orbit propagation
function propagateOrbit(orbit, minutesFromEpoch) {
  const { incl, raan, ecc, aop, ma, mm } = orbit;
  const a_km = orbit.a_km || Math.pow(GM_EARTH / Math.pow(2*Math.PI*mm/86400, 2), 1/3);
  const n = mm * 2 * Math.PI / 1440;
  const M = rad(ma) + n * minutesFromEpoch;
  let E = M;
  for (let i = 0; i < 10; i++) E = E - (E - ecc*Math.sin(E) - M)/(1 - ecc*Math.cos(E));
  const nu = 2 * Math.atan2(Math.sqrt(1+ecc)*Math.sin(E/2), Math.sqrt(1-ecc)*Math.cos(E/2));
  const r = a_km * (1 - ecc*Math.cos(E));
  const xp = r * Math.cos(nu);
  const yp = r * Math.sin(nu);
  const o = rad(raan), w = rad(aop), i = rad(incl);
  const cos = Math.cos, sin = Math.sin;
  const R00 = cos(o)*cos(w)-sin(o)*sin(w)*cos(i);
  const R01 = -cos(o)*sin(w)-sin(o)*cos(w)*cos(i);
  const R10 = sin(o)*cos(w)+cos(o)*sin(w)*cos(i);
  const R11 = -sin(o)*sin(w)+cos(o)*cos(w)*cos(i);
  const R20 = sin(w)*sin(i);
  const R21 = cos(w)*sin(i);
  return {
    pos: [R00*xp+R01*yp, R10*xp+R11*yp, R20*xp+R21*yp],
    r,
    altitude_km: r - R_EARTH,
  };
}

function eciToGeodetic(pos_eci, gmst) {
  const [x, y, z] = pos_eci;
  const lon_rad = Math.atan2(y, x) - gmst;
  const lon = ((deg(lon_rad) + 180) % 360 + 360) % 360 - 180;
  const r = Math.sqrt(x*x + y*y + z*z);
  const lat = deg(Math.asin(z/r));
  const alt = r - R_EARTH;
  return { lat, lon, alt };
}

// 2.7 COMBO SYSTEM (v0.4)
//
// Combos are detected at execute time when multiple agents act on related
// targets in the same round. Named, legible, with bonus effects.
// =============================================================================
const COMBOS = [
  {
    id: 'RECON_STRIKE',
    name: 'RECON STRIKE',
    desc: 'VIGIL ▸ SCAN + WRAITH ▸ DISRUPT on same target — enhanced disrupt that also reveals C2 path.',
    color: '#4ee2ff',
    detect(actions) {
      // Find a SCAN and a DISRUPT on the same target
      const scans = actions.filter(a => a.actionId === 'scan');
      const disrupts = actions.filter(a => a.actionId === 'disrupt');
      for (const s of scans) {
        for (const d of disrupts) {
          if (s.target === d.target) return { target: s.target, agentIds: ['VIGIL','WRAITH'] };
        }
      }
      return null;
    },
    apply(ctx) {
      // Reveal one threat anywhere on the c2 path; bonus IOC
      log(`<b style="color:#4ee2ff;">▸▸ COMBO: RECON STRIKE on ${ctx.target}</b>`, 'log-good');
      log('&nbsp;&nbsp;└ Disrupt enhanced; partial C2 path attribution', 'log-good');
      // 30% bonus chance to reveal C2
      if (!STATE.c2Revealed && Math.random() < 0.30) {
        STATE.c2Revealed = true;
        STATE.metrics.c2RevealedRound = STATE.round;
        log(`&nbsp;&nbsp;└ <b>C2 PARTIALLY EXPOSED via combo → ${STATE.c2Node}</b>`, 'log-crit');
        STATE.iocs.push(`C2 attribution via combo trace → ${STATE.c2Node}`);
      }
    },
  },
  {
    id: 'KILL_BOX',
    name: 'KILL BOX',
    desc: 'WRAITH ▸ DISRUPT on adjacent nodes simultaneously — creates containment field, prevents pivot.',
    color: '#ff4ea8',
    detect(actions) {
      const disrupts = actions.filter(a => a.actionId === 'disrupt' && a.target);
      if (disrupts.length < 2) return null;
      for (let i = 0; i < disrupts.length; i++) {
        for (let j = i+1; j < disrupts.length; j++) {
          const adjA = adjacent(disrupts[i].target).map(n => n.id);
          if (adjA.includes(disrupts[j].target)) {
            return { target: `${disrupts[i].target}↔${disrupts[j].target}`, agentIds: ['WRAITH'] };
          }
        }
      }
      return null;
    },
    apply(ctx) {
      log(`<b style="color:#ff4ea8;">▸▸ COMBO: KILL BOX ${ctx.target}</b>`, 'log-good');
      log('&nbsp;&nbsp;└ Containment field active; adversary pivots blocked this round', 'log-good');
      STATE.killBoxActive = true;  // disables pivots in adaptive AI
    },
  },
  {
    id: 'BULWARK',
    name: 'BULWARK',
    desc: 'ANCHOR ▸ HARDEN on same target multiple times — +2 resilience instead of stacking +1s.',
    color: '#ffb84d',
    detect(actions) {
      const hardens = actions.filter(a => a.actionId === 'harden');
      const counts = {};
      for (const h of hardens) {
        counts[h.target] = (counts[h.target] || 0) + 1;
        if (counts[h.target] >= 2) return { target: h.target, agentIds: ['ANCHOR'] };
      }
      return null;
    },
    apply(ctx) {
      log(`<b style="color:#ffb84d;">▸▸ COMBO: BULWARK on ${ctx.target}</b>`, 'log-good');
      const target = getNode(ctx.target);
      if (target && target.resilience < 3) {
        target.resilience = Math.min(target.resilience + 1, 3);  // bonus +1 on top of the two normal +1s
        log(`&nbsp;&nbsp;└ ${ctx.target} bonus resilience +1 (now ${target.resilience})`, 'log-good');
      }
    },
  },
  {
    id: 'TRIANGULATE',
    name: 'TRIANGULATE',
    desc: 'VIGIL ▸ SCAN + VIGIL ▸ TRACE in same round — guaranteed C2 reveal if any threat is revealed.',
    color: '#4ee2ff',
    detect(actions) {
      const hasScan = actions.some(a => a.actionId === 'scan');
      const hasTrace = actions.some(a => a.actionId === 'trace');
      if (hasScan && hasTrace) return { target: '—', agentIds: ['VIGIL'] };
      return null;
    },
    apply(ctx) {
      log(`<b style="color:#4ee2ff;">▸▸ COMBO: TRIANGULATE</b>`, 'log-good');
      // Guarantee C2 reveal IF any threat is revealed (otherwise nothing to triangulate from)
      const anyRevealed = STATE.threats.some(t => t.revealed);
      if (anyRevealed && !STATE.c2Revealed) {
        STATE.c2Revealed = true;
        STATE.metrics.c2RevealedRound = STATE.round;
        log(`&nbsp;&nbsp;└ <b>C2 LOCATED via triangulation → ${STATE.c2Node}</b>`, 'log-crit');
        STATE.iocs.push(`C2 located via VIGIL triangulation → ${STATE.c2Node}`);
      } else if (!anyRevealed) {
        log('&nbsp;&nbsp;└ No revealed threats to triangulate from. Combo wasted.', 'log-warn');
      } else {
        log('&nbsp;&nbsp;└ C2 already known. Combo bonus IOC instead.', 'log-good');
        STATE.iocs.push('Cross-correlated beacon jitter pattern observed');
      }
    },
  },
  {
    id: 'COVERED_RESTORE',
    name: 'COVERED RESTORE',
    desc: 'WRAITH ▸ DISRUPT + ANCHOR ▸ RESTORE on same target — restore without re-attack risk this round.',
    color: '#ffb84d',
    detect(actions) {
      const disrupts = actions.filter(a => a.actionId === 'disrupt');
      const restores = actions.filter(a => a.actionId === 'restore');
      for (const d of disrupts) {
        for (const r of restores) {
          if (d.target === r.target) return { target: d.target, agentIds: ['WRAITH','ANCHOR'] };
        }
      }
      return null;
    },
    apply(ctx) {
      log(`<b style="color:#ffb84d;">▸▸ COMBO: COVERED RESTORE on ${ctx.target}</b>`, 'log-good');
      const target = getNode(ctx.target);
      if (target) {
        target.resilience = Math.min((target.resilience || 0) + 1, 3);
        log(`&nbsp;&nbsp;└ ${ctx.target} restored to HEALTHY with +1 hardening bonus`, 'log-good');
        target.state = 'healthy';
      }
    },
  },
];

function detectAndApplyCombos() {
  const triggered = [];
  for (const combo of COMBOS) {
    const ctx = combo.detect(STATE.plannedActions);
    if (ctx) {
      // v0.4: First-ever combo trigger in this run gets a teaching line from Joshua
      const firstEver = (STATE.combosTriggered || []).length === 0;
      combo.apply(ctx);
      STATE.combosTriggered.push({
        round: STATE.round,
        comboId: combo.id,
        comboName: combo.name,
        target: ctx.target,
      });
      triggered.push(combo);
      if (firstEver) {
        setTimeout(() => {
          logJoshua(`Combo synergy detected, Operator. Coordinated agent actions on shared targets unlock force-multiplier effects. Reference CODEX ▸ COMBO SYNERGIES for the full list.`);
        }, 1100);
      }
    }
  }
  return triggered;
}

const canvas = document.getElementById('map-canvas');
const ctx = canvas.getContext('2d');
let DPR = 1, CW = 0, CH = 0;

function resizeCanvas() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  const rect = canvas.getBoundingClientRect();
  CW = rect.width;
  CH = rect.height;
  canvas.width = Math.floor(CW * DPR);
  canvas.height = Math.floor(CH * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
window.addEventListener('resize', () => { resizeCanvas(); layoutNodes(); });
window.addEventListener('orientationchange', () => {
  setTimeout(() => { resizeCanvas(); layoutNodes(); }, 200);
});
document.addEventListener('visibilitychange', () => {
  if (!document.hidden) {
    setTimeout(() => { resizeCanvas(); layoutNodes(); }, 50);
  }
});
window.addEventListener('pageshow', () => {
  setTimeout(() => { resizeCanvas(); layoutNodes(); }, 50);
});
if (window.ResizeObserver) {
  const ro = new ResizeObserver(() => { resizeCanvas(); layoutNodes(); });
  ro.observe(document.getElementById('map-area'));
}

function hexA(hex, a) {
  const r = parseInt(hex.slice(1,3), 16);
  const g = parseInt(hex.slice(3,5), 16);
  const b = parseInt(hex.slice(5,7), 16);
  return `rgba(${r},${g},${b},${a})`;
}

function nodeColor(n) {
  if (n.id === STATE.c2Node && STATE.c2Revealed && !STATE.c2Severed) return '#ff3a3a';
  if (STATE.c2Severed && n.id === STATE.c2Node) return '#5cff8a';
  switch (n.state) {
    case 'healthy':     return '#4ee2ff';
    case 'stressed':    return '#ffb84d';
    case 'attacked':    return '#ff4ea8';
    case 'compromised': return '#ff3a3a';
  }
  return '#4ee2ff';
}

function getNode(id) { return STATE.nodes.find(n => n.id === id); }
function adjacent(nodeId) {
  const adj = new Set();
  STATE.links.forEach(([a,b]) => {
    if (a === nodeId) adj.add(b);
    if (b === nodeId) adj.add(a);
  });
  return [...adj].map(getNode).filter(Boolean);
}

function layoutNodes() {
  if (!STATE.mission) return;
  if (STATE.mission.id === 'BLACKFROST') layoutEnergyGrid();
  else if (STATE.mission.id === 'TIDEBREAK') layoutMaritimePort();
}

function bfsPath(startId, endId) {
  const visited = new Set([startId]);
  const queue = [[startId]];
  while (queue.length) {
    const path = queue.shift();
    const last = path[path.length - 1];
    if (last === endId) return path;
    const adj = adjacent(last);
    for (const n of adj) {
      if (!visited.has(n.id)) {
        visited.add(n.id);
        queue.push([...path, n.id]);
      }
    }
  }
  return null;
}

function render() {
  STATE.tickCount++;
  ctx.fillStyle = '#03060a';
  ctx.fillRect(0, 0, CW, CH);
  if (!STATE.mission) return;
  if (STATE.mission.id === 'BLACKFROST') renderEnergyMap();
  else if (STATE.mission.id === 'NIGHTWATCH') renderSatelliteMap();
  else if (STATE.mission.id === 'TIDEBREAK') renderMaritimeMap();
}

    const n = byId[id]; if (!n) return;
    n.x = margin + w * (0.2 + i * 0.3);
    n.y = margin + h * 0.18;

  ['SUB-A','SUB-B','SUB-C','SUB-D'].forEach((id, i) => {
    const n = byId[id]; if (!n) return;
    n.x = margin + w * (0.12 + i * 0.25);

  });

    byId['CTRL'].x = margin + w * 0.5;
    byId['CTRL'].y = margin + h * 0.88;
  }

function projectLatLonToScreen(lat, lon, view) {
  if (view === 'orbital') {
    const ea = { x: 0, y: CH * 0.55, w: CW, h: CH * 0.40 };
    return {
      x: ea.x + ((lon + 180) / 360) * ea.w,
      y: ea.y + ((90 - lat) / 180) * ea.h,
    };
  } else if (view === 'ground') {
    return {
      x: ((lon + 180) / 360) * CW,
      y: ((90 - lat) / 180) * CH,
    };
  }
  return { x: CW/2, y: CH/2 };
}

function projectOrbitToScreen(eciPos) {
  const cx = CW/2, cy = CH * 0.27;
  const r = Math.min(CW, CH * 0.5) * 0.40;
  const scale = r / 45000;
  return { x: cx + eciPos[0] * scale, y: cy - eciPos[1] * scale };
}

function updateSatellitePositions() {
  STATE.simTimeMin += 0.4;
  STATE.nodes.forEach(n => {
    if (n.type === 'sat-geo' || n.type === 'sat-leo') {
      const { pos } = propagateOrbit(n.orbit, STATE.simTimeMin);
      n.eciPos = pos;
      const gmst = (STATE.simTimeMin / 1440) * 2 * Math.PI;
      n.geoPos = eciToGeodetic(pos, gmst);
    }
  });
  if (STATE.rpoVehicle) {
    STATE.rpoVehicle.orbit.ma += STATE.rpoVehicle.closingRate * 0.4;
    const { pos } = propagateOrbit(STATE.rpoVehicle.orbit, STATE.simTimeMin);
    STATE.rpoVehicle.eciPos = pos;
    const gmst = (STATE.simTimeMin / 1440) * 2 * Math.PI;
    STATE.rpoVehicle.geoPos = eciToGeodetic(pos, gmst);
  }
}

// ----- Drawing primitives -----

function drawBackgroundGrid() {
  ctx.strokeStyle = '#0e2030';
  ctx.lineWidth = 1;
  const step = 24;
  ctx.beginPath();
  for (let x = 0; x < CW; x += step) { ctx.moveTo(x, 0); ctx.lineTo(x, CH); }
  for (let y = 0; y < CH; y += step) { ctx.moveTo(0, y); ctx.lineTo(CW, y); }
  ctx.stroke();
  ctx.strokeStyle = 'rgba(78,226,255,0.06)';
  ctx.beginPath();
  ctx.ellipse(CW/2, CH/2, CW*0.55, CH*0.45, 0, 0, Math.PI*2);
  ctx.stroke();
}

function drawLink(a, b) {
  if (!a || !b) return;
  const aColor = nodeColor(a);
  const bColor = nodeColor(b);
  const compromised = a.state === 'compromised' || b.state === 'compromised';
  const grad = ctx.createLinearGradient(a.x, a.y, b.x, b.y);
  grad.addColorStop(0, hexA(aColor, 0.4));
  grad.addColorStop(1, hexA(bColor, 0.4));
  ctx.strokeStyle = grad;
  ctx.lineWidth = compromised ? 1 : 1.5;
  if (compromised) ctx.setLineDash([4, 4]);
  ctx.beginPath();
  ctx.moveTo(a.x, a.y);
  ctx.lineTo(b.x, b.y);
  ctx.stroke();
  ctx.setLineDash([]);
}

function drawNode(n) {
  const c = nodeColor(n);
  const baseR = n.type === 'control' ? 18 : (n.type === 'generator' ? 15 : 13);
  n.pulsePhase += 0.04;
  const pulse = Math.sin(n.pulsePhase) * 0.5 + 0.5;
  const r = baseR + pulse * 1.5;
  const glow = ctx.createRadialGradient(n.x, n.y, r * 0.5, n.x, n.y, r * 2.4);
  glow.addColorStop(0, hexA(c, 0.5));
  glow.addColorStop(1, hexA(c, 0));
  ctx.fillStyle = glow;
  ctx.beginPath();
  ctx.arc(n.x, n.y, r * 2.4, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#03060a';
  ctx.strokeStyle = c;
  ctx.lineWidth = 2;
  ctx.beginPath();
  if (n.type === 'control') drawPolygon(n.x, n.y, r, 6);
  else if (n.type === 'generator') drawPolygon(n.x, n.y, r, 3, -Math.PI/2);
  else drawPolygon(n.x, n.y, r, 4, Math.PI/4);
  ctx.fill();
  ctx.stroke();
  if (n.state === 'compromised') {
    ctx.fillStyle = c;
    ctx.beginPath(); ctx.arc(n.x, n.y, r * 0.35, 0, Math.PI * 2); ctx.fill();
  } else if (n.state === 'attacked') {
    ctx.strokeStyle = hexA(c, 0.6 + pulse * 0.4);
    ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(n.x, n.y, r * 0.55, 0, Math.PI * 2); ctx.stroke();
  }
  for (let i = 0; i < n.resilience; i++) {
    ctx.fillStyle = '#ffb84d';
    ctx.beginPath(); ctx.arc(n.x - 6 + i * 6, n.y - r - 6, 1.8, 0, Math.PI * 2); ctx.fill();
  }
  ctx.fillStyle = '#5a7080';
  ctx.font = '9px JetBrains Mono, monospace';
  ctx.textAlign = 'center';
  ctx.fillText(n.label, n.x, n.y + r + 12);
  if (n.id === STATE.c2Node && STATE.c2Revealed && !STATE.c2Severed) {
    ctx.fillStyle = '#ff3a3a';
    ctx.font = 'bold 8px JetBrains Mono, monospace';
    ctx.fillText('◢ C2 ◣', n.x, n.y - r - 10);
  }
}

function drawPolygon(cx, cy, r, sides, rot = 0) {
  for (let i = 0; i < sides; i++) {
    const a = rot + i * (Math.PI * 2 / sides);
    const px = cx + Math.cos(a) * r;
    const py = cy + Math.sin(a) * r;
    if (i === 0) ctx.moveTo(px, py);
    else ctx.lineTo(px, py);
  }
  ctx.closePath();
}

function drawSelectionHalo(n) {
  const r = 22 + Math.sin(STATE.tickCount * 0.1) * 2;
  ctx.strokeStyle = '#ffffff';
  ctx.lineWidth = 1.5;
  ctx.setLineDash([3, 3]);
  ctx.beginPath();
  ctx.arc(n.x, n.y, r, 0, Math.PI * 2);
  ctx.stroke();
  ctx.setLineDash([]);
}

function drawQueueMarker(n, color, idx) {
  const offset = (idx + 1) * 14;
  const x = n.x + offset;
  const y = n.y - 18;
  ctx.fillStyle = color;
  ctx.beginPath(); ctx.arc(x, y, 5, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 1; ctx.stroke();
}

// Satellite-specific drawing
function drawStarfield() {
  ctx.fillStyle = '#03060a';
  ctx.fillRect(0, 0, CW, CH);
  ctx.fillStyle = 'rgba(255,255,255,0.4)';
  for (let i = 0; i < 80; i++) {
    const x = ((i * 7919) % 1000) / 1000 * CW;
    const y = ((i * 6151) % 1000) / 1000 * CH;
    const tw = Math.sin(STATE.tickCount * 0.02 + i) * 0.3 + 0.7;
    ctx.globalAlpha = tw * 0.6;
    ctx.fillRect(x, y, 1, 1);
  }
  ctx.globalAlpha = 1;
}

function drawStylizedEarth() {
  const ea = { x: 0, y: CH * 0.55, w: CW, h: CH * 0.40 };
  ctx.fillStyle = '#041820';
  ctx.fillRect(ea.x, ea.y, ea.w, ea.h);
  ctx.strokeStyle = 'rgba(78,226,255,0.10)';
  ctx.lineWidth = 1;
  for (let i = 1; i < 6; i++) {
    const y = ea.y + ea.h * (i/6);
    ctx.beginPath(); ctx.moveTo(ea.x, y); ctx.lineTo(ea.x+ea.w, y); ctx.stroke();
  }
  for (let i = 1; i < 12; i++) {
    const x = ea.x + ea.w * (i/12);
    ctx.beginPath(); ctx.moveTo(x, ea.y); ctx.lineTo(x, ea.y+ea.h); ctx.stroke();
  }
  drawContinents(ea);
  // day/night terminator
  const termFrac = ((STATE.simTimeMin / 1440) % 1);
  const termX = ea.x + termFrac * ea.w;
  const grad = ctx.createLinearGradient(termX - 30, 0, termX + 60, 0);
  grad.addColorStop(0, 'rgba(0,0,0,0)');
  grad.addColorStop(1, 'rgba(0,0,0,0.45)');
  ctx.fillStyle = grad;
  ctx.fillRect(termX, ea.y, ea.w, ea.h);
}

function drawWorldMapBackground() {
  ctx.fillStyle = '#041820';
  ctx.fillRect(0, 0, CW, CH);
  ctx.strokeStyle = 'rgba(78,226,255,0.08)';
  ctx.lineWidth = 1;
  for (let i = 1; i < 12; i++) {
    const y = CH * (i/12);
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(CW, y); ctx.stroke();
  }
  for (let i = 1; i < 12; i++) {
    const x = CW * (i/12);
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, CH); ctx.stroke();
  }
  drawContinents({ x: 0, y: 0, w: CW, h: CH });
}

function drawContinents(area) {
  const continents = [
    [[0.15,0.30],[0.22,0.15],[0.28,0.28],[0.22,0.50],[0.15,0.45]],
    [[0.27,0.50],[0.32,0.62],[0.28,0.85],[0.23,0.80],[0.24,0.62]],
    [[0.45,0.25],[0.55,0.18],[0.58,0.40],[0.50,0.52],[0.46,0.47]],
    [[0.50,0.52],[0.58,0.52],[0.56,0.75],[0.51,0.78]],
    [[0.78,0.60],[0.85,0.58],[0.86,0.72],[0.79,0.70]],
  ];
  ctx.fillStyle = 'rgba(60,140,160,0.25)';
  ctx.strokeStyle = 'rgba(78,226,255,0.35)';
  ctx.lineWidth = 1;
  continents.forEach(poly => {
    ctx.beginPath();
    poly.forEach(([fx, fy], i) => {
      const x = area.x + fx * area.w;
      const y = area.y + fy * area.h;
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    });
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
  });
}

function drawOrbitTrace(n, hostile) {
  ctx.strokeStyle = hostile ? 'rgba(255,58,58,0.25)' : 'rgba(78,226,255,0.15)';
  ctx.lineWidth = 1;
  if (hostile) ctx.setLineDash([3,3]);
  ctx.beginPath();
  const samples = 64;
  const period = 1440 / n.orbit.mm;
  for (let i = 0; i <= samples; i++) {
    const t = STATE.simTimeMin + (i/samples) * period;
    const { pos } = propagateOrbit(n.orbit, t);
    const p = projectOrbitToScreen(pos);
    if (i === 0) ctx.moveTo(p.x, p.y); else ctx.lineTo(p.x, p.y);
  }
  ctx.stroke();
  ctx.setLineDash([]);
}

function drawGroundTrack(n) {
  if (!n.geoPos) return;
  for (let i = 1; i <= 18; i++) {
    const t = STATE.simTimeMin - i * 2;
    const { pos } = propagateOrbit(n.orbit, t);
    const gmst = (t / 1440) * 2 * Math.PI;
    const geo = eciToGeodetic(pos, gmst);
    const p = projectLatLonToScreen(geo.lat, geo.lon, 'orbital');
    ctx.globalAlpha = (1 - i/18) * 0.35;
    ctx.fillStyle = '#4ee2ff';
    ctx.beginPath();
    ctx.arc(p.x, p.y, 1.2, 0, Math.PI*2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function drawSatSubpoint(n) {
  if (!n.geoPos) return;
  const p = projectLatLonToScreen(n.geoPos.lat, n.geoPos.lon, 'ground');
  const c = nodeColor(n);
  ctx.fillStyle = c;
  ctx.strokeStyle = '#fff';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.arc(p.x, p.y, 5, 0, Math.PI*2);
  ctx.fill(); ctx.stroke();
  ctx.fillStyle = c;
  ctx.font = '9px JetBrains Mono, monospace';
  ctx.textAlign = 'center';
  ctx.fillText(n.label, p.x, p.y - 8);
  n.x = p.x; n.y = p.y;
}

function drawSatNode(n) {
  const c = nodeColor(n);
  n.pulsePhase += 0.05;
  const pulse = Math.sin(n.pulsePhase) * 0.5 + 0.5;
  const r = 8 + pulse * 1.5;
  const glow = ctx.createRadialGradient(n.x, n.y, r*0.5, n.x, n.y, r*2.6);
  glow.addColorStop(0, hexA(c, 0.6));
  glow.addColorStop(1, hexA(c, 0));
  ctx.fillStyle = glow;
  ctx.beginPath(); ctx.arc(n.x, n.y, r*2.6, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#03060a';
  ctx.strokeStyle = c;
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(n.x, n.y - r);
  ctx.lineTo(n.x + r, n.y);
  ctx.lineTo(n.x, n.y + r);
  ctx.lineTo(n.x - r, n.y);
  ctx.closePath();
  ctx.fill(); ctx.stroke();
  ctx.strokeStyle = hexA(c, 0.7);
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(n.x - r - 4, n.y); ctx.lineTo(n.x - r, n.y);
  ctx.moveTo(n.x + r, n.y);     ctx.lineTo(n.x + r + 4, n.y);
  ctx.stroke();
  ctx.fillStyle = '#5a7080';
  ctx.font = '8px JetBrains Mono, monospace';
  ctx.textAlign = 'center';
  ctx.fillText(n.label, n.x, n.y - r - 4);
  if (n.state === 'compromised') {
    ctx.fillStyle = '#ff3a3a';
    ctx.font = 'bold 7px JetBrains Mono, monospace';
    ctx.fillText('◢ COMP ◣', n.x, n.y + r + 9);
  }
  if (n.id === STATE.c2Node && STATE.c2Revealed && !STATE.c2Severed) {
    ctx.fillStyle = '#ff3a3a';
    ctx.font = 'bold 7px JetBrains Mono, monospace';
    ctx.fillText('◢ C2 ◣', n.x, n.y + r + 9);
  }
}

function drawGroundNode(n) {
  const c = nodeColor(n);
  n.pulsePhase += 0.04;
  const pulse = Math.sin(n.pulsePhase) * 0.5 + 0.5;
  const r = (n.type === 'mcc' ? 11 : 9) + pulse * 1.2;
  const glow = ctx.createRadialGradient(n.x, n.y, r*0.5, n.x, n.y, r*2.4);
  glow.addColorStop(0, hexA(c, 0.5));
  glow.addColorStop(1, hexA(c, 0));
  ctx.fillStyle = glow;
  ctx.beginPath(); ctx.arc(n.x, n.y, r*2.4, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#03060a';
  ctx.strokeStyle = c;
  ctx.lineWidth = 2;
  ctx.beginPath();
  if (n.type === 'mcc') drawPolygon(n.x, n.y, r, 6);
  else drawPolygon(n.x, n.y, r, 4, Math.PI/4);
  ctx.fill(); ctx.stroke();
  if (n.type === 'ground') {
    ctx.strokeStyle = c;
    ctx.beginPath();
    ctx.arc(n.x, n.y - r - 3, 4, Math.PI, 0);
    ctx.stroke();
  }
  for (let i = 0; i < n.resilience; i++) {
    ctx.fillStyle = '#ffb84d';
    ctx.beginPath(); ctx.arc(n.x - 6 + i*6, n.y - r - 8, 1.8, 0, Math.PI*2); ctx.fill();
  }
  ctx.fillStyle = '#5a7080';
  ctx.font = '9px JetBrains Mono, monospace';
  ctx.textAlign = 'center';
  ctx.fillText(n.label, n.x, n.y + r + 12);
  if (n.id === STATE.c2Node && STATE.c2Revealed && !STATE.c2Severed) {
    ctx.fillStyle = '#ff3a3a';
    ctx.font = 'bold 8px JetBrains Mono, monospace';
    ctx.fillText('◢ C2 ◣', n.x, n.y - r - 14);
  }
}

function drawRPONode(rpo) {
  const r = 7 + Math.sin(STATE.tickCount * 0.1) * 1.5;
  const glow = ctx.createRadialGradient(rpo.x, rpo.y, r*0.5, rpo.x, rpo.y, r*3);
  glow.addColorStop(0, 'rgba(255,58,58,0.7)');
  glow.addColorStop(1, 'rgba(255,58,58,0)');
  ctx.fillStyle = glow;
  ctx.beginPath(); ctx.arc(rpo.x, rpo.y, r*3, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#1a0408';
  ctx.strokeStyle = '#ff3a3a';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(rpo.x, rpo.y - r);
  ctx.lineTo(rpo.x + r, rpo.y);
  ctx.lineTo(rpo.x, rpo.y + r);
  ctx.lineTo(rpo.x - r, rpo.y);
  ctx.closePath();
  ctx.fill(); ctx.stroke();
  ctx.strokeStyle = '#ff3a3a';
  ctx.lineWidth = 1;
  ctx.setLineDash([2,2]);
  ctx.beginPath();
  ctx.arc(rpo.x, rpo.y, r + 6, 0, Math.PI*2);
  ctx.stroke();
  ctx.setLineDash([]);
  ctx.fillStyle = '#ff3a3a';
  ctx.font = 'bold 8px JetBrains Mono, monospace';
  ctx.textAlign = 'center';
  ctx.fillText('RPO-X', rpo.x, rpo.y - r - 6);
  ctx.fillText('◢ HOSTILE ◣', rpo.x, rpo.y + r + 12);
}

function drawSatLinks() {
  const ks = getNode('KEYSTONE');
  if (!ks) return;
  STATE.nodes.forEach(n => {
    if (n.type !== 'sat-geo' && n.type !== 'sat-leo') return;
    const c = nodeColor(n);
    ctx.strokeStyle = hexA(c, 0.20);
    ctx.lineWidth = 1;
    if (n.state === 'compromised') ctx.setLineDash([3,3]);
    ctx.beginPath();
    ctx.moveTo(n.x, n.y);
    ctx.lineTo(ks.x, ks.y);
    ctx.stroke();
    ctx.setLineDash([]);
  });
}

function drawTacticalSatDetail(target, cx, cy) {
  const c = nodeColor(target);
  ctx.fillStyle = '#0a1824';
  ctx.strokeStyle = c;
  ctx.lineWidth = 2;
  ctx.fillRect(cx - 30, cy - 22, 60, 44);
  ctx.strokeRect(cx - 30, cy - 22, 60, 44);
  ctx.fillStyle = '#04080d';
  ctx.fillRect(cx - 80, cy - 12, 45, 24);
  ctx.fillRect(cx + 35, cy - 12, 45, 24);
  ctx.strokeStyle = hexA(c, 0.6);
  ctx.strokeRect(cx - 80, cy - 12, 45, 24);
  ctx.strokeRect(cx + 35, cy - 12, 45, 24);
  for (let i = 1; i < 5; i++) {
    ctx.beginPath();
    ctx.moveTo(cx - 80 + i*9, cy - 12); ctx.lineTo(cx - 80 + i*9, cy + 12);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(cx + 35 + i*9, cy - 12); ctx.lineTo(cx + 35 + i*9, cy + 12);
    ctx.stroke();
  }
  ctx.strokeStyle = c;
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.arc(cx, cy - 22, 8, Math.PI, 0);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(cx, cy - 22); ctx.lineTo(cx, cy - 14);
  ctx.stroke();
  const subs = [
    { name: 'PWR', x: cx - 22, y: cy - 12, ok: true },
    { name: 'COM', x: cx - 22, y: cy +  2, ok: target.state !== 'compromised' },
    { name: 'ADCS',x: cx +  2, y: cy - 12, ok: true },
    { name: 'PAYL',x: cx +  2, y: cy +  2, ok: target.state === 'healthy' },
  ];
  subs.forEach(s => {
    ctx.fillStyle = s.ok ? '#5cff8a' : '#ff3a3a';
    ctx.beginPath(); ctx.arc(s.x, s.y, 2, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#5a7080';
    ctx.font = '7px JetBrains Mono, monospace';
    ctx.textAlign = 'left';
    ctx.fillText(s.name, s.x + 4, s.y + 3);
  });
  ctx.fillStyle = c;
  ctx.font = 'bold 11px JetBrains Mono, monospace';
  ctx.textAlign = 'center';
  ctx.fillText(target.label, cx, cy - 50);
  ctx.fillStyle = '#5a7080';
  ctx.font = '9px JetBrains Mono, monospace';
  ctx.fillText('TACTICAL VIEW', cx, cy - 38);
  target.x = cx; target.y = cy;
}

function drawRPOClose(rpo, target, cx, cy) {
  const px = rpo.x, py = rpo.y;
  const r = 7;
  ctx.fillStyle = '#1a0408';
  ctx.strokeStyle = '#ff3a3a';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(px, py - r); ctx.lineTo(px + r, py); ctx.lineTo(px, py + r); ctx.lineTo(px - r, py);
  ctx.closePath();
  ctx.fill(); ctx.stroke();
  ctx.strokeStyle = 'rgba(255,58,58,0.4)';
  ctx.setLineDash([4,4]);
  ctx.beginPath();
  ctx.arc(cx, cy, Math.hypot(px-cx, py-cy), 0, Math.PI*2);
  ctx.stroke();
  ctx.setLineDash([]);
  ctx.fillStyle = '#ff3a3a';
  ctx.font = 'bold 8px JetBrains Mono, monospace';
  ctx.textAlign = 'center';
  ctx.fillText('RPO-X', px, py - 10);
}

function drawTacticalTelemetry(target) {
  const x = 8, y = 8;
  ctx.fillStyle = 'rgba(3,6,10,0.7)';
  ctx.fillRect(x, y, 130, 80);
  ctx.strokeStyle = 'rgba(78,226,255,0.4)';
  ctx.strokeRect(x, y, 130, 80);
  ctx.fillStyle = '#4ee2ff';
  ctx.font = 'bold 9px JetBrains Mono, monospace';
  ctx.textAlign = 'left';
  ctx.fillText('// TELEMETRY', x + 5, y + 12);
  ctx.fillStyle = '#e8f4ff';
  ctx.font = '8px JetBrains Mono, monospace';
  if (target.geoPos) {
    ctx.fillText(`LAT: ${target.geoPos.lat.toFixed(2)}°`, x+5, y+24);
    ctx.fillText(`LON: ${target.geoPos.lon.toFixed(2)}°`, x+5, y+34);
    ctx.fillText(`ALT: ${target.geoPos.alt.toFixed(0)} km`, x+5, y+44);
  }
  ctx.fillText(`STATE: ${target.state.toUpperCase()}`, x+5, y+56);
  ctx.fillText(`HARDEN: +${target.resilience}`, x+5, y+66);
  if (STATE.rpoVehicle && target.id === 'NWATCH-2') {
    const dma = ((STATE.rpoVehicle.orbit.ma - target.orbit.ma + 540) % 360) - 180;
    ctx.fillStyle = Math.abs(dma) < 5 ? '#ff3a3a' : '#ffb84d';
    ctx.fillText(`RPO Δ: ${dma.toFixed(1)}°`, x+5, y+76);
  }
}


// =============================================================================
// 8.5 MARITIME PORT MISSION (TIDEBREAK) — v0.4
//
// Pier-side layout. Real-world grounded: Port of Houston 2021 (ManageEngine
// zero-day → web shell), Maersk NotPetya 2017 (TOS paralysis cascading to OT),
// ZPMC crane supply-chain concerns (cellular modems, remote access).
// =============================================================================
function setupMaritimePort() {
  const nodeDefs = [
    { id: 'CTRL',     type: 'control',  label: 'CTRL',     fullName: 'Operations Control' },
    { id: 'TOS',      type: 'it',       label: 'TOS',      fullName: 'Terminal Operating System' },
    { id: 'PCS',      type: 'it',       label: 'PCS',      fullName: 'Port Community System' },
    { id: 'VTS',      type: 'control',  label: 'VTS',      fullName: 'Vessel Traffic Service' },
    { id: 'GANTRY-1', type: 'crane',    label: 'GANTRY-1', fullName: 'Ship-to-Shore Crane 1' },
    { id: 'GANTRY-2', type: 'crane',    label: 'GANTRY-2', fullName: 'Ship-to-Shore Crane 2' },
    { id: 'AIS',      type: 'comms',    label: 'AIS',      fullName: 'AIS Station' },
    { id: 'DALI',     type: 'vessel',   label: 'DALI',     fullName: 'Vessel In Port' },
  ];
  STATE.nodes = nodeDefs.map(d => ({
    ...d, x: 0, y: 0,
    state: 'healthy',
    resilience: 0,
    pulsePhase: Math.random() * Math.PI * 2,
  }));
  // Topology — CTRL hubs OT, TOS/PCS coordinate IT, gantries are pier-side, AIS+DALI on water
  STATE.links = [
    ['CTRL','TOS'], ['CTRL','PCS'], ['CTRL','VTS'],
    ['CTRL','GANTRY-1'], ['CTRL','GANTRY-2'],
    ['TOS','GANTRY-1'], ['TOS','GANTRY-2'],   // TOS controls cargo handling
    ['PCS','TOS'],                              // PCS feeds cargo manifests to TOS
    ['VTS','AIS'], ['VTS','DALI'],              // VTS coordinates vessel comms
    ['AIS','DALI'],
    ['GANTRY-1','DALI'], ['GANTRY-2','DALI'],   // cranes physically interact with vessel
  ];
  document.getElementById('view-toggle').classList.remove('active');
  layoutMaritimePort();
}

function layoutMaritimePort() {
  const margin = 32;
  const w = CW - margin * 2;
  const h = CH - margin * 2;
  const byId = {};
  STATE.nodes.forEach(n => byId[n.id] = n);
  // Top row: CTRL (centered) — operations control
  if (byId['CTRL']) { byId['CTRL'].x = margin + w * 0.5; byId['CTRL'].y = margin + h * 0.10; }
  // 2nd row: IT/coord (TOS, PCS, VTS)
  if (byId['TOS']) { byId['TOS'].x = margin + w * 0.20; byId['TOS'].y = margin + h * 0.32; }
  if (byId['PCS']) { byId['PCS'].x = margin + w * 0.50; byId['PCS'].y = margin + h * 0.32; }
  if (byId['VTS']) { byId['VTS'].x = margin + w * 0.80; byId['VTS'].y = margin + h * 0.32; }
  // 3rd row: pier-side OT (gantries)
  if (byId['GANTRY-1']) { byId['GANTRY-1'].x = margin + w * 0.32; byId['GANTRY-1'].y = margin + h * 0.58; }
  if (byId['GANTRY-2']) { byId['GANTRY-2'].x = margin + w * 0.62; byId['GANTRY-2'].y = margin + h * 0.58; }
  // Water row: AIS + DALI vessel
  if (byId['AIS']) { byId['AIS'].x = margin + w * 0.85; byId['AIS'].y = margin + h * 0.85; }
  if (byId['DALI']) { byId['DALI'].x = margin + w * 0.45; byId['DALI'].y = margin + h * 0.85; }
}

function renderMaritimeMap() {
  drawBackgroundGrid();
  // Water band — bottom 30% has slight blue tint to suggest waterline
  const waterTop = CH * 0.70;
  const grad = ctx.createLinearGradient(0, waterTop, 0, CH);
  grad.addColorStop(0, 'rgba(80,160,200,0.05)');
  grad.addColorStop(1, 'rgba(80,160,200,0.18)');
  ctx.fillStyle = grad;
  ctx.fillRect(0, waterTop, CW, CH - waterTop);
  // Pier edge — horizontal line indicating dock boundary
  ctx.strokeStyle = 'rgba(78,226,255,0.25)';
  ctx.lineWidth = 1;
  ctx.setLineDash([6, 4]);
  ctx.beginPath();
  ctx.moveTo(0, waterTop);
  ctx.lineTo(CW, waterTop);
  ctx.stroke();
  ctx.setLineDash([]);
  // Wave animation in water area
  const t = performance.now() * 0.0008;
  ctx.strokeStyle = 'rgba(80,160,200,0.18)';
  ctx.lineWidth = 1;
  for (let waveY = waterTop + 14; waveY < CH; waveY += 12) {
    ctx.beginPath();
    for (let x = 0; x <= CW; x += 4) {
      const y = waveY + Math.sin(x * 0.04 + t + waveY * 0.05) * 1.5;
      if (x === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.stroke();
  }

  STATE.links.forEach(([a, b]) => drawLink(getNode(a), getNode(b)));
  updateParticles();
  drawParticles();

  // Custom node rendering for maritime types
  STATE.nodes.forEach(n => {
    if (n.type === 'crane') drawCraneNode(n);
    else if (n.type === 'vessel') drawVesselNode(n);
    else drawNode(n);
  });

  updateAttackChains();
  drawAttackChains();
  if (STATE.selectedTarget) {
    const n = getNode(STATE.selectedTarget);
    if (n) drawSelectionHalo(n);
  }
  STATE.plannedActions.forEach((a, idx) => {
    const n = getNode(a.target);
    if (!n) return;
    const ag = STATE.agents[a.agent];
    drawQueueMarker(n, ag.color, idx);
  });
}

function drawCraneNode(n) {
  // Gantry crane silhouette: vertical posts, horizontal beam, suspended hook
  const c = nodeColor(n);
  const pulseGlow = (Math.sin(performance.now() * 0.003 + n.pulsePhase) + 1) * 0.5;
  // Glow halo
  ctx.fillStyle = hexA(c, 0.10 + pulseGlow * 0.10);
  ctx.beginPath();
  ctx.arc(n.x, n.y, 22, 0, Math.PI * 2);
  ctx.fill();
  // Crane body
  ctx.strokeStyle = c;
  ctx.lineWidth = 2;
  ctx.beginPath();
  // Two vertical legs
  ctx.moveTo(n.x - 10, n.y + 14);
  ctx.lineTo(n.x - 10, n.y - 8);
  ctx.moveTo(n.x + 10, n.y + 14);
  ctx.lineTo(n.x + 10, n.y - 8);
  // Top horizontal beam
  ctx.moveTo(n.x - 14, n.y - 8);
  ctx.lineTo(n.x + 14, n.y - 8);
  // Boom extending right (toward water)
  ctx.moveTo(n.x + 10, n.y - 8);
  ctx.lineTo(n.x + 18, n.y - 4);
  ctx.stroke();
  // Hook line
  ctx.strokeStyle = hexA(c, 0.6);
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(n.x + 4, n.y - 8);
  ctx.lineTo(n.x + 4, n.y + 4);
  ctx.stroke();
  // Center dot
  ctx.fillStyle = c;
  ctx.beginPath();
  ctx.arc(n.x, n.y, 2.5, 0, Math.PI * 2);
  ctx.fill();
  // Label
  ctx.fillStyle = c;
  ctx.font = '9px monospace';
  ctx.textAlign = 'center';
  ctx.fillText(n.label, n.x, n.y + 28);
  if (n.resilience > 0) {
    ctx.fillStyle = '#ffb84d';
    ctx.fillText(`+${n.resilience}`, n.x, n.y + 38);
  }
}

function drawVesselNode(n) {
  // Container ship silhouette: hull with stacked containers on top
  const c = nodeColor(n);
  const pulseGlow = (Math.sin(performance.now() * 0.003 + n.pulsePhase) + 1) * 0.5;
  ctx.fillStyle = hexA(c, 0.10 + pulseGlow * 0.12);
  ctx.beginPath();
  ctx.arc(n.x, n.y, 26, 0, Math.PI * 2);
  ctx.fill();
  // Hull
  ctx.strokeStyle = c;
  ctx.lineWidth = 2;
  ctx.fillStyle = hexA(c, 0.15);
  ctx.beginPath();
  ctx.moveTo(n.x - 18, n.y + 2);
  ctx.lineTo(n.x + 16, n.y + 2);
  ctx.lineTo(n.x + 20, n.y + 6);
  ctx.lineTo(n.x - 14, n.y + 6);
  ctx.closePath();
  ctx.fill();
  ctx.stroke();
  // Containers on deck
  ctx.strokeStyle = c;
  ctx.lineWidth = 1;
  for (let i = -3; i <= 3; i++) {
    ctx.strokeRect(n.x - 3 + i*4, n.y - 5, 3, 6);
  }
  // Bridge
  ctx.fillStyle = c;
  ctx.fillRect(n.x + 12, n.y - 4, 5, 6);
  // Label
  ctx.font = '9px monospace';
  ctx.textAlign = 'center';
  ctx.fillStyle = c;
  ctx.fillText(n.label, n.x, n.y + 18);
  if (n.resilience > 0) {
    ctx.fillStyle = '#ffb84d';
    ctx.fillText(`+${n.resilience}`, n.x, n.y + 28);
  }
}

function spawnParticles() {
  STATE.links.forEach(([a, b]) => {
    if (Math.random() < 0.012) {
      STATE.particles.push({
        from: a, to: b, t: 0, speed: 0.012 + Math.random() * 0.01,
        color: '#4ee2ff',
      });
    }
  });
}
function updateParticles() {
  spawnParticles();
  STATE.particles.forEach(p => p.t += p.speed);
  STATE.particles = STATE.particles.filter(p => p.t < 1);
}
function drawParticles() {
  STATE.particles.forEach(p => {
    const a = getNode(p.from);
    const b = getNode(p.to);
    if (!a || !b) return;
    const x = a.x + (b.x - a.x) * p.t;
    const y = a.y + (b.y - a.y) * p.t;
    ctx.fillStyle = hexA(p.color, 0.7);
    ctx.beginPath(); ctx.arc(x, y, 1.5, 0, Math.PI * 2); ctx.fill();
  });
}

function spawnAttackChain(path, kind) {
  STATE.attackChains.push({
    path: path.slice(),
    progress: 0,
    speed: 0.012,
    kind: kind || 'attack',
    sparks: [],
  });
}
function updateAttackChains() {
  STATE.attackChains.forEach(c => {
    c.progress += c.speed;
    if (Math.random() < 0.5 && c.path.length > 1) {
      const segIdx = Math.min(Math.floor(c.progress * (c.path.length - 1)), c.path.length - 2);
      const localT = (c.progress * (c.path.length - 1)) - segIdx;
      const a = getNode(c.path[segIdx]);
      const b = getNode(c.path[segIdx + 1]);
      if (a && b && typeof a.x === 'number' && typeof b.x === 'number') {
        c.sparks.push({
          x: a.x + (b.x - a.x) * localT + (Math.random() - 0.5) * 6,
          y: a.y + (b.y - a.y) * localT + (Math.random() - 0.5) * 6,
          life: 1, vx: (Math.random()-0.5)*0.5, vy: (Math.random()-0.5)*0.5,
        });
      }
    }
    c.sparks.forEach(s => { s.life -= 0.05; s.x += s.vx; s.y += s.vy; });
    c.sparks = c.sparks.filter(s => s.life > 0);
  });
  STATE.attackChains = STATE.attackChains.filter(c => c.progress < 1 || c.sparks.length > 0);
}
function drawAttackChains() {
  STATE.attackChains.forEach(c => {
    if (c.path.length < 2) return;
    const color = c.kind === 'attack' ? '#ff3a3a' : '#5cff8a';
    const totalSegs = c.path.length - 1;
    const filledSegs = Math.floor(c.progress * totalSegs);
    const localT = (c.progress * totalSegs) - filledSegs;
    ctx.lineWidth = 2.5;
    ctx.strokeStyle = color;
    ctx.shadowColor = color;
    ctx.shadowBlur = 10;
    for (let i = 0; i < filledSegs; i++) {
      const a = getNode(c.path[i]);
      const b = getNode(c.path[i+1]);
      if (!a || !b || typeof a.x !== 'number' || typeof b.x !== 'number') continue;
      ctx.beginPath();
      ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y);
      ctx.stroke();
    }
    if (filledSegs < totalSegs) {
      const a = getNode(c.path[filledSegs]);
      const b = getNode(c.path[filledSegs+1]);
      if (a && b && typeof a.x === 'number' && typeof b.x === 'number') {
        const x = a.x + (b.x - a.x) * localT;
        const y = a.y + (b.y - a.y) * localT;
        ctx.beginPath();
        ctx.moveTo(a.x, a.y); ctx.lineTo(x, y);
        ctx.stroke();
        ctx.fillStyle = color;
        ctx.beginPath(); ctx.arc(x, y, 4, 0, Math.PI * 2); ctx.fill();
      }
    }
    ctx.shadowBlur = 0;
    c.sparks.forEach(s => {
      ctx.fillStyle = hexA(color, s.life);
      ctx.beginPath(); ctx.arc(s.x, s.y, 1.5, 0, Math.PI * 2); ctx.fill();
    });
  });
}

function pickC2() {
  const actor = STATE.activeActor;
  // Insider mode: C2 is one of the assets itself.
  if (actor && actor.insiderMode) {
    if (STATE.mission.id === 'BLACKFROST') {
      const candidates = STATE.nodes.filter(n => n.type === 'substation' || n.type === 'generator');
      STATE.c2Node = candidates[Math.floor(Math.random() * candidates.length)].id;
    } else if (STATE.mission.id === 'NIGHTWATCH') {
      STATE.c2Node = Math.random() < 0.5 ? 'KEYSTONE' : 'MCC';
    } else if (STATE.mission.id === 'TIDEBREAK') {
      // Insider sits on TOS, PCS, or VTS — IT/coordination layer
      const candidates = STATE.nodes.filter(n => n.type === 'it' || n.type === 'control');
      STATE.c2Node = candidates[Math.floor(Math.random() * candidates.length)].id;
    }
    return;
  }
  // Standard external C2 (i.e., the foothold node from which adversary launches threats)
  if (STATE.mission.id === 'BLACKFROST') {
    const candidates = STATE.nodes.filter(n => n.type !== 'control');
    STATE.c2Node = candidates[Math.floor(Math.random() * candidates.length)].id;
  } else if (STATE.mission.id === 'NIGHTWATCH') {
    STATE.c2Node = Math.random() < 0.5 ? 'KEYSTONE' : 'MCC';
  } else if (STATE.mission.id === 'TIDEBREAK') {
    // External C2 likely on edge-facing IT nodes (Houston pattern: web server / PCS / TOS)
    // For TIDEMARK supply-chain: GANTRY or VTS (vendor remote access points)
    if (actor && actor.archetype === 'supply_chain') {
      const candidates = STATE.nodes.filter(n => n.type === 'crane' || n.type === 'comms');
      STATE.c2Node = candidates[Math.floor(Math.random() * candidates.length)].id;
    } else {
      // Other actors: prefer IT nodes (Houston-style)
      const candidates = STATE.nodes.filter(n => n.type === 'it' || n.type === 'comms');
      STATE.c2Node = candidates[Math.floor(Math.random() * candidates.length)].id;
    }
  }
}

function aiPlanThreats() {
  // v0.5: in demo mode, threats spawn from script during conseq. Skip RNG-driven AI.
  if (STATE.demoMode) {
    demoSpawnNewThreats();
    return;
  }
  const actor = STATE.activeActor;
  if (!actor) return;
  const attacked = STATE.threats.length;
  let baseDesired;
  // v0.3: actor spawn-rate modifier
  if (actor.archetype === 'ransomware' || actor.archetype === 'hacktivist' || actor.archetype === 'cybercriminal') {
    baseDesired = STATE.round <= 2 ? 1 : 2;
  } else {
    baseDesired = STATE.round <= 3 ? 1 : 2;
  }
  // WARDEN burst pattern: spawn more on odd rounds, none on even
  if (actor.burstPattern) {
    baseDesired = (STATE.round % 2 === 1) ? Math.ceil(baseDesired * 1.5) : 0;
  }
  // Difficulty multiplier
  const diffMod = STATE.difficulty === 'analyst' ? 1.3 : STATE.difficulty === 'novice' ? 0.7 : 1.0;
  const desired = Math.max(0, Math.round(baseDesired * actor.spawnRateMod * diffMod));
  const launches = Math.max(0, desired - attacked);
  for (let i = 0; i < launches; i++) maybeLaunchThreat();
}

function maybeLaunchThreat(opts) {
  opts = opts || {};
  const c2 = getNode(STATE.c2Node);
  if (!c2) return;
  const actor = STATE.activeActor;
  // Insider: spawns originate from the foothold node, not external C2 (same node id)
  const sourceId = STATE.c2Node;
  const candidates = STATE.nodes.filter(n =>
    n.id !== sourceId &&
    n.state !== 'compromised' &&
    !STATE.threats.some(t => t.target === n.id) &&
    (!opts.excludeTarget || n.id !== opts.excludeTarget)
  );
  if (candidates.length === 0) return;
  // Weight by node type (mission-specific high-value targeting)
  const weighted = [];
  candidates.forEach(n => {
    let w = 1;
    if (STATE.mission.id === 'BLACKFROST') {
      if (n.type === 'control') w = 3;
      else if (n.type === 'generator') w = 2;
    } else if (STATE.mission.id === 'NIGHTWATCH') {
      if (n.type === 'sat-leo') w = 3;
      else if (n.type === 'sat-geo') w = 2;
      else if (n.type === 'mcc') w = 2;
    } else if (STATE.mission.id === 'TIDEBREAK') {
      // Maersk lesson: TOS compromise paralyzes everything. ZPMC: cranes are vector.
      if (n.id === 'TOS') w = 3;
      else if (n.id === 'CTRL') w = 3;
      else if (n.type === 'crane') w = 2;
      else if (n.id === 'DALI') w = 2;
    }
    for (let i = 0; i < w; i++) weighted.push(n);
  });
  // If a preferred target is specified (e.g., adaptive pivot), use it directly
  let target;
  if (opts.preferTarget && candidates.find(c => c.id === opts.preferTarget)) {
    target = candidates.find(c => c.id === opts.preferTarget);
  } else {
    target = weighted[Math.floor(Math.random() * weighted.length)];
  }
  let path = bfsPath(sourceId, target.id) || [sourceId, target.id];
  // v0.3: Pick technique from actor's initial-access bias if available, otherwise from threat mix
  let techPool = (actor && actor.biasInitialAccess && actor.biasInitialAccess.length > 0)
    ? actor.biasInitialAccess.filter(tid => STATE.mission.threatMix.includes(tid))
    : [];
  if (techPool.length === 0) {
    // Fallback: any IA/Recon technique from mission's mix
    techPool = STATE.mission.threatMix.filter(tid => {
      const t = TECHNIQUES[tid];
      return t && (t.tactic.includes('Initial Access') || t.tactic.includes('Reconnaissance'));
    });
  }
  if (techPool.length === 0) techPool = STATE.mission.threatMix;
  const techId = techPool[Math.floor(Math.random() * techPool.length)];
  STATE.threats.push({
    target: target.id,
    path,
    phase: 0,
    techniqueId: techId,
    revealed: false,
    history: [techId],
    spawnRound: STATE.round,
    pivotedFrom: opts.pivotedFrom || null,  // v0.3: track adaptive-pivot lineage
  });
  STATE.metrics.threatSpawns.push({ round: STATE.round, target: target.id, techniqueId: techId });
  if (target.state === 'healthy') target.state = 'attacked';
}

// v0.2.1: Metrics capture
function recordAction(agentId, actionId, targetId, outcome, wasteReason, techniqueIds) {
  STATE.metrics.actions.push({
    round: STATE.round,
    agentId, actionId, targetId,
    outcome,         // 'effective' | 'wasted' | 'partial'

function recordTechniqueObserved(tid) {
  if (!tid) return;
  STATE.observedTTPs[tid] = (STATE.observedTTPs[tid] || 0) + 1;
  if (STATE.metrics.firstThreatRevealedRound === null) {
    STATE.metrics.firstThreatRevealedRound = STATE.round;
  }
}

function captureRoundMetrics() {
  const round = STATE.round;
  const actionsThisRound = STATE.metrics.actions.filter(a => a.round === round);
  const effective = actionsThisRound.filter(a => a.outcome === 'effective').length;
  const wasted = actionsThisRound.filter(a => a.outcome === 'wasted').length;
  const compromisedNow = STATE.nodes.filter(n => n.state === 'compromised').length;
  const prev = STATE.metrics.rounds[STATE.metrics.rounds.length - 1];
  const compromisedThisRound = compromisedNow - (prev ? prev.compromisedTotal : 0);
  STATE.metrics.rounds.push({
    round,
    threatsActive: STATE.threats.length,
    threatsRevealed: STATE.threats.filter(t => t.revealed).length,
    effectiveActions: effective,
    wastedActions: wasted,
    compromisedTotal: compromisedNow,
    compromisedThisRound,
    hardeningCharges: STATE.nodes.reduce((s, n) => s + (n.resilience || 0), 0),
  });
}

// Find repeat-failure patterns: same agent doing the same wasteful thing more than once
function detectRepeatFailures() {
  const wasted = STATE.metrics.actions.filter(a => a.outcome === 'wasted');
  const seen = new Map();   // key = `${agent}:${action}:${reason}` -> first round
  const repeats = [];
  wasted.forEach(a => {
    const key = `${a.agentId}:${a.actionId}:${a.wasteReason}`;
    if (seen.has(key)) {
      repeats.push({
        round: a.round, agentId: a.agentId, actionId: a.actionId,
        wasteReason: a.wasteReason, firstRound: seen.get(key),
      });
    } else {
      seen.set(key, a.round);
    }
  });
  return repeats;
}

// Compute final rubric scores for debrief
function computeRubric() {
  const m = STATE.metrics;
  const rounds = m.rounds.length || 1;
  const totalActions = m.actions.length || 1;
  const effective = m.actions.filter(a => a.outcome === 'effective').length;
  const wasted = m.actions.filter(a => a.outcome === 'wasted').length;
  const compromised = STATE.nodes.filter(n => n.state === 'compromised').length;
  const cascadeHits = m.rounds.reduce((s, r) => s + Math.max(0, r.compromisedThisRound - 1), 0);

  // 1. Detection speed: lower round number = better. Score 100 if revealed by round 2.
  let detectionScore = 0;
  if (m.firstThreatRevealedRound !== null) {
    const r = m.firstThreatRevealedRound;
    detectionScore = Math.max(0, Math.min(100, 100 - (r - 2) * 15));
  }

  // 2. C2 attribution: optimal by round 4. 100 if revealed early, 0 if never.
  let attributionScore = 0;
  if (m.c2RevealedRound !== null) {
    const r = m.c2RevealedRound;
    attributionScore = Math.max(0, Math.min(100, 100 - (r - 4) * 12));
  }

  // 3. Agent efficiency: % effective
  const efficiencyScore = Math.round((effective / totalActions) * 100);

  // 4. Hardening economy: charges absorbed / charges spent
  // We don't track absorbed yet — approximate via current resilience vs max ever
  const hardenActions = m.actions.filter(a => a.actionId === 'harden' && a.outcome === 'effective').length;
  const restoreActions = m.actions.filter(a => a.actionId === 'restore' && a.outcome === 'effective').length;
  // Heuristic: if you hardened and few cascade hits = good economy
  let hardeningScore = 50;
  if (hardenActions > 0) {
    const ratio = (hardenActions - cascadeHits) / hardenActions;
    hardeningScore = Math.round(Math.max(0, Math.min(100, 50 + ratio * 50)));
  } else if (cascadeHits === 0 && compromised <= 1) {
    hardeningScore = 70;  // didn't need to harden
  } else {
    hardeningScore = 25;  // didn't harden when you should have
  }

  // 5. Cascade containment
  const cascadeScore = compromised === 0
    ? 100
    : Math.max(0, Math.min(100, 100 - cascadeHits * 25 - compromised * 10));

  // 6. Doctrine
  let doctrineScore = 0;
  if (STATE.c2Severed) doctrineScore = 100;
  else if (STATE.phase === 'WIN') doctrineScore = 70;
  else doctrineScore = 0;

  return {
    detection: { score: detectionScore, label: scoreLabel(detectionScore),
      detail: m.firstThreatRevealedRound !== null
        ? `First threat revealed: round ${m.firstThreatRevealedRound}/${STATE.mission.maxRounds} (target: ≤2)`
        : 'No threats revealed during run.' },
    attribution: { score: attributionScore, label: scoreLabel(attributionScore),
      detail: m.c2RevealedRound !== null
        ? `C2 located: round ${m.c2RevealedRound} (optimal: ≤4)`
        : 'C2 never located.' },
    efficiency: { score: efficiencyScore, label: scoreLabel(efficiencyScore),
      detail: `${effective}/${totalActions} actions produced effect (${Math.round(effective/totalActions*100)}%). Wasted: ${wasted}.` },
    hardening: { score: hardeningScore, label: scoreLabel(hardeningScore),
      detail: `${hardenActions} HARDEN, ${restoreActions} RESTORE applied. Cascades: ${cascadeHits}.` },
    cascade: { score: cascadeScore, label: scoreLabel(cascadeScore),
      detail: `${compromised} compromised, ${cascadeHits} cascade hit${cascadeHits !== 1 ? 's' : ''}.` },
    doctrine: { score: doctrineScore, label: doctrineLabel(),
      detail: STATE.c2Severed ? 'C2 severed — adversary command neutralized.'
        : STATE.phase === 'WIN' ? 'Defense held through round limit.'
        : 'Defense breached.' },
  };
}

function scoreLabel(s) {
  if (s >= 85) return 'EXCELLENT';
  if (s >= 65) return 'GOOD';
  if (s >= 45) return 'ADEQUATE';
  if (s >= 25) return 'POOR';
  return 'CRITICAL';
}
function doctrineLabel() {
  if (STATE.c2Severed) return 'DECISIVE';
  if (STATE.phase === 'WIN') return 'DEFENSIVE HOLD';
  return 'BREACHED';
}

function generateCFINote(rubric) {
  const notes = [];
  const A = STATE.activeActor;
  const diff = STATE.difficulty;

  // Lead with adversary attribution
  if (A) {
    if (A.adaptive && (diff !== 'novice')) {
      const pivots = STATE.pivotEvents.length;
      if (pivots > 0) notes.push(`Faced ${A.name} — adaptive actor pivoted ${pivots} time${pivots>1?'s':''} during run.`);
      else notes.push(`Faced ${A.name} — adaptive actor; minimal disruption denied them pivot opportunities.`);
    } else if (A.insiderMode) {
      notes.push(`Faced ${A.name} — insider campaign required identification rather than C2 sever.`);
    } else if (A.burstPattern) {
      notes.push(`Faced ${A.name} — burst-pattern actor; alternating tempo demands rhythm matching.`);
    } else if (A.archetype === 'supply_chain') {
      notes.push(`Faced ${A.name} — supply-chain compromise via vendor remote-access. Patient and cascading.`);
    }
  }

  if (rubric.detection.score < 50) notes.push('Detection lag exposed assets early. Front-load VIGIL ▸ DEEP SCAN before committing offensive actions.');
  if (rubric.attribution.score < 50 && STATE.metrics.c2RevealedRound === null) {
    const label = A && A.insiderMode ? 'foothold identification' : 'C2 attribution';
    notes.push(`Without ${label}, you cannot ${A && A.insiderMode ? 'contain the insider' : 'SEVER'}. TRACE C2 yields better odds after multiple threats are revealed.`);
  }
  if (rubric.efficiency.score < 60) notes.push('Wasted actions reduced your effective tempo. SCAN before DISRUPT — confirm threat presence first.');
  if (rubric.hardening.score < 50) notes.push('Hardening economy was inefficient — applied either too late or to wrong targets.');
  // v0.4: combo recognition
  const comboCount = (STATE.combosTriggered || []).length;
  const totalRounds = STATE.round;
  if (comboCount === 0 && totalRounds >= 4) {
    notes.push('No combos triggered. Coordinated multi-agent actions on shared targets unlock force-multiplier effects.');
  } else if (comboCount > 0) {
    const ratePerRound = comboCount / Math.max(1, totalRounds);
    if (ratePerRound >= 0.5) notes.push(`${comboCount} combo${comboCount>1?'s':''} triggered — strong tactical coordination.`);
    else notes.push(`${comboCount} combo${comboCount>1?'s':''} triggered. Combos amplify effects; consider stacking actions on shared targets more often.`);
  }
  const repeats = detectRepeatFailures();
  if (repeats.length > 0) notes.push(`${repeats.length} repeat failure pattern${repeats.length > 1 ? 's' : ''} detected — see MOVES tab.`);
  if (rubric.cascade.score >= 85) notes.push('Excellent cascade containment.');
  if (rubric.doctrine.score === 100) notes.push('Decisive operational result.');
  if (diff === 'analyst' && rubric.doctrine.score >= 70) notes.push('Result achieved on ANALYST difficulty — significant operational acumen demonstrated.');
  if (notes.length === 0) notes.push('Run within parameters. Consider higher difficulty.');
  return notes.join(' ');
}

function updateStatusBar() {
