  document.getElementById('narrator-label').textContent = label || '▸ INSTRUCTOR';
  document.getElementById('narrator-text').textContent = text || '';
  document.getElementById('narrator-progress').textContent = progress || '';
  card.classList.add('shown');
  card.style.display = 'block';
  // Wire fresh handlers (replace prior)
  const cont = document.getElementById('narrator-continue');
  const exit = document.getElementById('narrator-exit');
  cont.onclick = () => { if (onContinue) onContinue(); };
  exit.onclick = () => { if (onExit) onExit(); };
}
function hideNarratorCard() {
  const card = document.getElementById('narrator-card');
  if (card) {
    card.classList.remove('shown');
    card.style.display = 'none';
  }
}

// Step the demo into the next phase: deliver narration beats then auto-queue actions
function demoOnPhaseEnter(phase) {
  if (!STATE.demoMode || !STATE.demoScript) return;
  const roundData = STATE.demoScript.rounds.find(r => r.round === STATE.round);
  if (!roundData) {
    // Demo script ran out — fall back to normal play OR show outro
    return;
  }
  const beats = (roundData.narration || []).filter(n => n.phase === phase);
  if (beats.length > 0) {
    queueDemoNarration(beats, () => demoExecutePhaseActions(phase, roundData));
  } else {
    demoExecutePhaseActions(phase, roundData);
  }
}

function queueDemoNarration(beats, onAllDone) {
  let i = 0;
  function step() {
    if (i >= beats.length) {
      hideNarratorCard();
      if (onAllDone) onAllDone();
      return;
    }
    const beat = beats[i];
    showNarratorCard({
      label: `▸ INSTRUCTOR — R${STATE.round} ${beat.phase}`,
      text: beat.text,
      progress: `BEAT ${i+1}/${beats.length}`,
      onContinue: () => { i++; step(); },
      onExit: exitDemo,
    });
  }
  step();
}

function demoExecutePhaseActions(phase, roundData) {
  if (phase === 'PLAN' && roundData.playerActions) {
    // Auto-queue all the demo's planned actions
    roundData.playerActions.forEach(a => {
      const agentIdx = STATE.agents.findIndex(g => g.id === a.agent);
      if (agentIdx < 0) return;
      const agent = STATE.agents[agentIdx];
      const action = agent.actions.find(x => x.id === a.action);
      if (!action) return;
      queueAction(agentIdx, action, a.target);
    });
    // Brief pause then auto-execute
    setTimeout(() => {
      if (STATE.demoMode && STATE.phase === 'PLAN' && STATE.plannedActions.length > 0) {
        startResolvePhase();
      }
    }, 1400);
  }
}

// Spawn this round's scripted threats during conseq phase (instead of aiPlanThreats)
function demoSpawnNewThreats() {
  if (!STATE.demoMode || !STATE.demoScript) return;
  const next = STATE.demoScript.rounds.find(r => r.round === STATE.round + 1);
  if (!next || !next.threatSpawns) return;
  next.threatSpawns.forEach(s => spawnDemoThreat(s.target, s.techniqueId));
  STATE.threats.forEach(t => {
    if (t.spawnRound === STATE.round + 1) {
      const target = getNode(t.target);
      if (target && target.state === 'healthy') target.state = 'attacked';
      spawnAttackChain(t.path, 'attack');
    }
  });
}

// Show outro after final demo round wins/loses
function demoMaybeShowOutro() {
  if (!STATE.demoMode || !STATE.demoScript) return false;
  if (!STATE.demoScript.outro) return false;
  showNarratorCard({
    label: '▸ INSTRUCTOR — DEBRIEF',
    text: STATE.demoScript.outro,
    progress: 'DEMO COMPLETE',
    onContinue: () => {
      hideNarratorCard();
      // After outro, leave demo mode and let normal debrief render
      STATE.demoMode = false;
    },
    onExit: exitDemo,
  });
  return true;
}

function renderLoop() {
  render();
  requestAnimationFrame(renderLoop);
}

// v0.3: Threat actor intro card
function showThreatActorIntro(onDone) {
  const A = STATE.activeActor;
  if (!A) { if (onDone) onDone(); return; }
  const modal = document.createElement('div');
  modal.className = 'modal';
  modal.id = 'actor-intro-modal';
  const sil = buildSilhouetteSVG(A.silhouette, A.color);
  modal.innerHTML = `
    <div class="modal-content" style="max-width:380px;border-color:${A.color};box-shadow:0 0 24px ${A.color}66;">
      <div style="color:var(--muted);font-size:9px;letter-spacing:0.15em;">// THREAT ATTRIBUTION — PARTIAL</div>
      <div style="display:flex;align-items:center;gap:14px;margin-top:8px;">
        <div style="width:80px;height:80px;flex:0 0 80px;">${sil}</div>
        <div style="flex:1;min-width:0;">
          <div style="color:${A.color};font-size:14px;font-weight:bold;letter-spacing:0.1em;">${A.name}</div>
          <div style="color:var(--white);font-size:10px;text-transform:uppercase;letter-spacing:0.08em;margin-top:2px;">${A.tagline}</div>
        </div>
      </div>
      <div style="margin-top:12px;padding-top:8px;border-top:1px solid var(--grid-line);">
        <div style="color:var(--cyan);font-size:9px;font-weight:bold;letter-spacing:0.05em;">▸ OBSERVED PATTERN</div>
        <div style="color:var(--white);font-size:10px;line-height:1.5;margin-top:4px;font-style:italic;">${A.pattern}</div>
      </div>
      <div style="margin-top:8px;">
        <div style="color:var(--cyan);font-size:9px;font-weight:bold;letter-spacing:0.05em;">▸ ARCHETYPAL BEHAVIOR</div>
        <div style="color:var(--white);font-size:10px;line-height:1.5;margin-top:4px;">${A.summary}</div>
      </div>
      ${A.adaptive ? '<div style="margin-top:8px;color:var(--magenta);font-size:9px;letter-spacing:0.05em;">⚠ ADAPTIVE — pivots when disrupted</div>' : ''}
      ${A.insiderMode ? '<div style="margin-top:8px;color:var(--magenta);font-size:9px;letter-spacing:0.05em;">⚠ INSIDER — no external C2; identify foothold to contain</div>' : ''}
      ${A.burstPattern ? '<div style="margin-top:8px;color:var(--amber);font-size:9px;letter-spacing:0.05em;">⚠ BURST PATTERN — alternating tempo</div>' : ''}
      <button class="action-btn primary" id="actor-intro-ack" style="width:100%;margin-top:14px;">▶ ACKNOWLEDGE</button>
    </div>
  `;
  document.getElementById('app').appendChild(modal);
  modal.querySelector('#actor-intro-ack').addEventListener('click', () => {
    modal.remove();
    if (onDone) onDone();
  });
}

function buildSilhouetteSVG(shape, color) {
  const s = `viewBox="0 0 80 80" xmlns="http://www.w3.org/2000/svg" style="display:block;width:100%;height:100%;"`;
  if (shape === 'skull') {
    return `<svg ${s}>
      <path d="M 40 8 L 64 22 L 64 50 L 56 64 L 40 72 L 24 64 L 16 50 L 16 22 Z" fill="none" stroke="${color}" stroke-width="2"/>
      <circle cx="30" cy="36" r="5" fill="${color}"/>
      <circle cx="50" cy="36" r="5" fill="${color}"/>
      <path d="M 30 52 L 35 56 L 40 52 L 45 56 L 50 52" fill="none" stroke="${color}" stroke-width="2"/>
    </svg>`;
  }
  if (shape === 'eye') {
    return `<svg ${s}>
      <ellipse cx="40" cy="40" rx="34" ry="18" fill="none" stroke="${color}" stroke-width="2"/>
      <circle cx="40" cy="40" r="14" fill="none" stroke="${color}" stroke-width="2"/>
      <circle cx="40" cy="40" r="6" fill="${color}"/>
      <line x1="6" y1="6" x2="74" y2="74" stroke="${color}" stroke-width="1" opacity="0.4"/>
      <line x1="74" y1="6" x2="6" y2="74" stroke="${color}" stroke-width="1" opacity="0.4"/>
    </svg>`;
  }
  if (shape === 'flag') {
    return `<svg ${s}>
      <path d="M 16 70 L 16 12 L 64 12 L 56 30 L 64 48 L 16 48" fill="${color}" fill-opacity="0.2" stroke="${color}" stroke-width="2"/>
      <path d="M 28 22 L 28 38 M 36 22 L 36 38 M 44 22 L 44 38" stroke="${color}" stroke-width="2"/>
    </svg>`;
  }
  if (shape === 'mask') {
    return `<svg ${s}>
      <path d="M 20 24 Q 40 12 60 24 L 60 48 Q 40 60 20 48 Z" fill="${color}" fill-opacity="0.15" stroke="${color}" stroke-width="2"/>
      <rect x="24" y="32" width="14" height="6" fill="${color}"/>
      <rect x="42" y="32" width="14" height="6" fill="${color}"/>
      <line x1="20" y1="48" x2="60" y2="48" stroke="${color}" stroke-width="2"/>
      <path d="M 30 56 L 30 70 M 50 56 L 50 70" stroke="${color}" stroke-width="2" stroke-dasharray="3 3"/>
    </svg>`;
  }
  if (shape === 'key') {
    return `<svg ${s}>
      <circle cx="22" cy="40" r="14" fill="none" stroke="${color}" stroke-width="2"/>
      <circle cx="22" cy="40" r="5" fill="${color}"/>
      <line x1="36" y1="40" x2="68" y2="40" stroke="${color}" stroke-width="3"/>
      <line x1="56" y1="40" x2="56" y2="52" stroke="${color}" stroke-width="3"/>
      <line x1="64" y1="40" x2="64" y2="48" stroke="${color}" stroke-width="3"/>
    </svg>`;
  }
  if (shape === 'wave') {
    // TIDEMARK — wave/tide motif suggesting supply-chain swell
    return `<svg ${s}>
      <path d="M 8 28 Q 20 16 32 28 T 56 28 T 76 28" fill="none" stroke="${color}" stroke-width="2"/>
      <path d="M 8 42 Q 20 30 32 42 T 56 42 T 76 42" fill="none" stroke="${color}" stroke-width="2.5"/>
      <path d="M 8 56 Q 20 44 32 56 T 56 56 T 76 56" fill="none" stroke="${color}" stroke-width="2"/>
      <circle cx="40" cy="42" r="3" fill="${color}"/>
      <line x1="40" y1="42" x2="40" y2="68" stroke="${color}" stroke-width="1" stroke-dasharray="2 2"/>
    </svg>`;
  }
  return `<svg ${s}>
    <path d="M 40 10 L 70 40 L 40 70 L 10 40 Z" fill="none" stroke="${color}" stroke-width="2"/>
  </svg>`;
}

resizeCanvas();
setTimeout(bootTick, 300);
</script>
