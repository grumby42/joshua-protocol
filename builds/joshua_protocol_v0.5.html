    `${String(STATE.round).padStart(2,'0')}/${String(STATE.mission.maxRounds).padStart(2,'0')}`;
  const compromised = STATE.nodes.filter(n => n.state === 'compromised').length;
  const attacked = STATE.nodes.filter(n => n.state === 'attacked').length;
  let level = 'LOW', cls = 'threat-low';
  if (compromised >= 2 || attacked >= 3) { level = 'HIGH'; cls = 'threat-high'; }
  else if (compromised >= 1 || attacked >= 2) { level = 'MED'; cls = 'threat-med'; }
  STATE.threatLevel = level;
  const el = document.getElementById('stat-threat');
  el.textContent = level;
  el.className = 'status-val ' + cls;
  const stat = document.getElementById('grid-stat');
  if (STATE.mission.id === 'BLACKFROST') {
    const onlineCount = STATE.nodes.filter(n => n.state !== 'compromised').length;
    stat.textContent = `NODES: ${onlineCount}/8`;
  } else {
    const sats = STATE.nodes.filter(n => n.type === 'sat-leo' || n.type === 'sat-geo');
    const satOk = sats.filter(n => n.state !== 'compromised').length;
    stat.textContent = `SATS: ${satOk}/${sats.length}`;
  }
  document.getElementById('sector-label').textContent = `// ${STATE.mission.sector}`;
}

function updateMainButton() {
  const main = document.getElementById('btn-main');
  const back = document.getElementById('btn-back');
  back.disabled = false;
  main.classList.remove('attract');
  main.className = main.className.replace(/\bdanger\b/g, '');
  switch (STATE.phase) {
    case 'INTEL':
      main.textContent = STATE.round === 1 ? '▶ BEGIN PLAN' : 'BEGIN PLAN ▶';
      main.disabled = false;
      back.disabled = true;
      if (STATE.round === 1) main.classList.add('attract');
      break;
    case 'PLAN':
      // v0.4: AP-based status
      const apUsed = STATE.actionPointsUsed;
      const apMax = STATE.actionBudget;
      if (apUsed === 0) main.textContent = `EXECUTE (0/${apMax}AP) ▶`;
      else main.textContent = `EXECUTE (${apUsed}/${apMax}AP) ▶`;
      main.disabled = STATE.plannedActions.length === 0;
      break;
    case 'RESOLVE':
      main.textContent = '⏳ RESOLVING';
      main.disabled = true;
      back.disabled = true;
      break;
    case 'CONSEQ':
      main.textContent = '⏳ ADVERSARY';
      main.disabled = true;
      back.disabled = true;
      break;
    case 'WIN':
      main.textContent = '◢ MISSION COMPLETE';
      main.disabled = true;
      back.disabled = true;
      break;
    case 'LOSE':
      main.textContent = '◢ MISSION FAILED';
      main.classList.add('danger');
      main.disabled = true;
      back.disabled = true;
      break;
  }
}

function startIntelPhase() {
  setPhase('INTEL');
  document.getElementById('tap-hint').textContent = 'INTEL UPDATE — REVIEW LOG';
  logDivider();
  log(`<b>// ROUND ${STATE.round} — INTEL PHASE</b>`, 'log-cyan');
  const visibleThreats = STATE.threats.filter(t => t.revealed);
  if (visibleThreats.length === 0 && STATE.threats.length > 0) {
    log(verbose('No confirmed threats. Anomalous traffic detected.',
                'No confirmed threats. Beacon-like patterns observed in egress.',
                'IDS quiet. Zeek conn.log shows beacon-pattern jitter on egress; no Suricata signature match yet.'),
        'log-warn');
  }
  visibleThreats.forEach(t => {
    log(`Active threat → ${t.target} [phase ${t.phase}/3]`, 'log-warn');
    logTechnique(t.techniqueId);
  });
  if (STATE.c2Revealed && !STATE.c2Severed) {
    log(`◢ C2 LOCATED at ${STATE.c2Node}. Recommend SEVER.`, 'log-crit');
  }
  if (STATE.round === 1) {
    setTimeout(() => {
      const A = STATE.activeActor;
      let line;
      if (!A) line = 'Hostile activity detected. Stand by.';
      else if (A.archetype === 'ransomware') line = 'Initial access detected. Common phishing vector. Detonation imminent if unchecked.';
      else if (A.archetype === 'nation_state') line = 'Multi-vector campaign converging. Patient adversary; expect long-dwell tactics.';
      else if (A.archetype === 'hacktivist') line = 'Opportunistic intrusion against public-facing assets. Loud and fast.';
      else if (A.archetype === 'insider') line = 'Anomalies in authorized credentials. Hostile may already be inside the perimeter.';
      else if (A.archetype === 'cybercriminal') line = 'Initial-access broker pattern detected. Expect bursts and possible buyer handoff.';
      else if (A.archetype === 'supply_chain') line = 'Anomalies traced to vendor remote-access channels. Trusted maintenance pathways may be compromised.';
      else line = 'Hostile activity detected. Stand by.';
      logJoshua(line);
    }, 800);
  }
  if (STATE.activeActor && STATE.activeActor.archetype === 'nation_state' && STATE.round === 4 && !STATE.c2Revealed) {
    setTimeout(() => {
      logJoshua('Tradecraft consistent with long-dwell APT. C2 likely on ground segment.');
    }, 600);
  }
  if (STATE.activeActor && STATE.activeActor.insiderMode && STATE.round === 3 && !STATE.c2Revealed) {
    setTimeout(() => {
      logJoshua('Anomalies suggest authorized credentials behaving abnormally. Foothold may be one of our own assets.');
    }, 600);
  }
  // v0.5: Demo narrator hook — fire INTEL beats then advance to PLAN via callback
  if (STATE.demoMode) {
    setTimeout(() => {
      const roundData = STATE.demoScript.rounds.find(r => r.round === STATE.round);
      if (!roundData) {
        // Script ran out — exit demo mode, let player take over
        STATE.demoMode = false;
        const badge = document.getElementById('demo-badge');
        if (badge) badge.style.display = 'none';
        logJoshua('Demo script complete. You have the controls, Operator.');
        return;
      }
      const beats = (roundData.narration || []).filter(n => n.phase === 'INTEL');
      if (beats.length > 0) {
        queueDemoNarration(beats, () => startPlanPhase());
      } else {
        startPlanPhase();
      }
    }, 1200);
  }
}

function startPlanPhase() {
  setPhase('PLAN');
  STATE.plannedActions = [];
  STATE.resolvedActions = [];
  STATE.actionPointsUsed = 0;     // v0.4
  STATE.agents.forEach(a => a.exhausted = false);
  STATE.selectedAgent = null;
  STATE.selectedTarget = null;
  document.getElementById('tap-hint').textContent = 'SELECT AGENT, THEN TARGET NODE';
  logDivider();
  log('<b>// PLAN PHASE — Queue agent actions</b>', 'log-cyan');
  log(`<span class="log-cyan">▸ Action budget: ${STATE.actionBudget} AP this round</span>`);
  renderAgentStrip();
  updateBudgetDisplay();

  // v0.5: demo narrator hook — fire PLAN beats then auto-queue actions
  if (STATE.demoMode) {
    const roundData = STATE.demoScript.rounds.find(r => r.round === STATE.round);
    if (!roundData) return;
    const beats = (roundData.narration || []).filter(n => n.phase === 'PLAN');
    const autoQueue = () => {
      // Queue all actions from the demo script
      (roundData.playerActions || []).forEach(a => {
        const agentIdx = STATE.agents.findIndex(g => g.id === a.agent);
        if (agentIdx < 0) return;
        const agent = STATE.agents[agentIdx];
        const action = agent.actions.find(x => x.id === a.action);
        if (!action) return;
        queueAction(agentIdx, action, a.target);
      });
      // Auto-execute after a brief beat so player sees the queue
      setTimeout(() => {
        if (STATE.demoMode && STATE.phase === 'PLAN' && STATE.plannedActions.length > 0) {
          startResolvePhase();
        }
      }, 1500);
    };
    if (beats.length > 0) {
      setTimeout(() => queueDemoNarration(beats, autoQueue), 400);
    } else {
      setTimeout(autoQueue, 400);
    }
  }
}

function startResolvePhase() {
  setPhase('RESOLVE');
  document.getElementById('tap-hint').textContent = 'RESOLVING';
  logDivider();
  log('<b>// RESOLVE PHASE — Operator actions</b>', 'log-cyan');
  // v0.4: detect combos BEFORE actions execute. Bonuses apply atop resolution.
  STATE.killBoxActive = false;
  // v0.5: demo RESOLVE narration — fire pre-resolve beats first
  if (STATE.demoMode) {
    const roundData = STATE.demoScript.rounds.find(r => r.round === STATE.round);
    const beats = roundData ? (roundData.narration || []).filter(n => n.phase === 'RESOLVE') : [];
    if (beats.length > 0) {
      queueDemoNarration(beats, () => doResolveStart());
      return;
    }
  }
  doResolveStart();
}

function doResolveStart() {
  const combos = detectAndApplyCombos();
  if (combos.length > 0) {
    gate(900, () => resolveNextAction(0));
  } else {
    resolveNextAction(0);
  }
}

function resolveNextAction(i) {
  if (i >= STATE.plannedActions.length) {
    gate(500, startConseqPhase);
    return;
  }
  const a = STATE.plannedActions[i];
  const ag = STATE.agents[a.agent];
  executeAction(ag, a);
  gate(900, () => resolveNextAction(i + 1));
}

function executeAction(ag, a) {
  const target = a.target ? getNode(a.target) : null;
  const speak = (txt) => logAgent(ag.id, txt);
  const action = ag.actions.find(x => x.id === a.actionId);
  STATE.resolvedActions.push({
    agentId: ag.id, agentColor: ag.color,
    actionId: a.actionId, actionName: a.actionName,
    targetId: a.target,
    d3fend: action ? action.d3fend : null,
    tools: action ? action.tools : [],
    kind: 'counter',
  });

  if (a.actionId === 'scan') {
    speak(verbose('Deep scan running.',
                  'Deep scan: Suricata + Zeek correlation on target and adjacent.',
                  'IDS sweep deployed: Suricata sig hunt + Zeek conn.log diff across target ±1 hop.'));
    const reveal = [target, ...adjacent(target.id)];
    let foundCount = 0;
    const foundTechs = [];
    reveal.forEach(n => {
      STATE.threats.forEach(t => {
        if (t.target === n.id && !t.revealed) {
          t.revealed = true;
          foundCount++;
          foundTechs.push(t.techniqueId);
          recordTechniqueObserved(t.techniqueId);
          log(`&nbsp;&nbsp;└ Threat exposed at ${n.id}`, 'log-warn');
          logTechnique(t.techniqueId);
        }
      });
    });
    if (foundCount === 0) {
      speak('No active threats detected on scanned nodes.');
      recordAction(ag.id, a.actionId, a.target, 'wasted', 'no threats present', []);
    } else {
      recordAction(ag.id, a.actionId, a.target, 'effective', null, foundTechs);
    }
  }
  else if (a.actionId === 'trace') {
    speak(verbose('Tracing C2.',
                  'Initiating C2 traceback via beacon correlation.',
                  'C2 trace: pivot/jitter analysis on Zeek conn.log + STIX/TAXII enrichment + MISP cross-ref.'));
    if (STATE.c2Revealed) {
      speak('C2 location already known.');
      recordAction(ag.id, a.actionId, a.target, 'wasted', 'c2 already located', []);
    } else {
      const revealedCount = STATE.threats.filter(t => t.revealed).length;
      // v0.3: Difficulty + actor detection window affects trace odds
      let chance = 0.30 + revealedCount * 0.20;
      if (STATE.activeActor) {
        chance = chance / STATE.activeActor.detectionWindow;
      }
      if (STATE.difficulty === 'novice') chance += 0.15;
      if (STATE.difficulty === 'analyst') chance -= 0.10;
      chance = clamp(chance, 0.10, 0.95);
      if (Math.random() < chance) {
        STATE.c2Revealed = true;
        STATE.metrics.c2RevealedRound = STATE.round;
        const insiderLabel = STATE.activeActor && STATE.activeActor.insiderMode ? 'INSIDER FOOTHOLD' : 'C2';
        log(`&nbsp;&nbsp;└ <b>${insiderLabel} IDENTIFIED → ${STATE.c2Node}</b>`, 'log-crit');
        recordAction(ag.id, a.actionId, a.target, 'effective', null, []);
        STATE.iocs.push(`Beacon source attributed → ${STATE.c2Node}`);
        const followUp = STATE.activeActor && STATE.activeActor.insiderMode
          ? 'Insider foothold located. Recommend ANCHOR ▸ RESTORE the affected asset.'
          : 'Adversary command node located. Severing recommended.';
        setTimeout(() => logJoshua(followUp), 400);
      } else {
        speak('Trace incomplete. Beacon obfuscated. More intel needed.');
        recordAction(ag.id, a.actionId, a.target, 'wasted', 'insufficient intel', []);
      }
    }
  }
  else if (a.actionId === 'disrupt') {
    speak(verbose(`Disrupting attack on ${target.id}.`,
                  `Disrupting kill chain on ${target.id} via Velociraptor.`,
                  `Velociraptor flow on ${target.id}: process eviction + memory dump for IOC extraction.`));
    const ts = STATE.threats.filter(t => t.target === target.id);
    if (ts.length === 0) {
      speak('No active threat on target. Action wasted.');
      recordAction(ag.id, a.actionId, a.target, 'wasted', 'empty target', []);
    } else {
      const techs = ts.map(t => t.techniqueId);
      ts.forEach(t => {
        spawnAttackChain(t.path.slice().reverse(), 'counter');
        log(`&nbsp;&nbsp;└ Kill chain broken at ${target.id}`, 'log-good');
      });
      // v0.3: ADAPTIVE PIVOT — adaptive actors re-emerge on adjacent node
      // v0.4: KILL_BOX combo blocks all pivots this round
      const actor = STATE.activeActor;
      const isAdaptive = actor && actor.adaptive;
      const willPivot = STATE.killBoxActive ? false : (
        (STATE.difficulty === 'novice') ? false :
        (STATE.difficulty === 'operator') ? isAdaptive :
        (STATE.difficulty === 'analyst') ? (isAdaptive || Math.random() < 0.5) : false
      );
      if (STATE.killBoxActive && isAdaptive) {
        log(`&nbsp;&nbsp;└ <span style="color:#ff4ea8;">KILL BOX prevented adversary pivot</span>`, 'log-good');
      }
      if (willPivot) {
        const adjacents = adjacent(target.id).filter(n =>
          n.state !== 'compromised' &&
          !STATE.threats.some(t2 => t2.target === n.id)
        );
        if (adjacents.length > 0) {
          const pivotTarget = adjacents[Math.floor(Math.random() * adjacents.length)];
          // Queue pivot to fire NEXT round so player has agency
          STATE.pivotEvents.push({
            round: STATE.round,
            from: target.id,
            to: pivotTarget.id,
            actor: actor.id,
          });
          log(`&nbsp;&nbsp;└ <b style="color:var(--magenta);">⚠ ADVERSARY ADAPTING — campaign pivoting to ${pivotTarget.id}</b>`, 'log-warn');
          // Spawn the pivoted threat now so it's in motion next conseq phase
          maybeLaunchThreat({ preferTarget: pivotTarget.id, pivotedFrom: target.id });
          // The pivoted threat is automatically revealed (we saw the pivot happen)
          const pivot = STATE.threats[STATE.threats.length - 1];
          if (pivot) pivot.revealed = true;
        }
      }
      STATE.threats = STATE.threats.filter(t => t.target !== target.id);
      if (target.state === 'attacked') target.state = 'stressed';
      recordAction(ag.id, a.actionId, a.target, 'effective', null, techs);
    }
  }
  else if (a.actionId === 'sever') {
    const isInsider = STATE.activeActor && STATE.activeActor.insiderMode;
    speak(verbose(
      isInsider ? 'Containing insider.' : 'Cutting C2 link.',
      isInsider ? 'Containing insider — credential lockout, asset isolation.' : 'Severing C2 — burning persistence, isolating egress.',
      isInsider ? 'Cred revocation + session termination + UEBA-flagged asset quarantine.' : 'BGP blackhole + firewall block + cred rotation. Burning all observed adversary infra.'
    ));
    if (!STATE.c2Revealed) {
      speak(isInsider ? 'ERROR — Foothold not identified.' : 'ERROR — C2 location unknown.');
      recordAction(ag.id, a.actionId, a.target, 'wasted', 'c2 not revealed', []);
      return;
    }
    STATE.c2Severed = true;
    STATE.metrics.c2SeveredRound = STATE.round;
    const c2 = getNode(STATE.c2Node);
    STATE.nodes.forEach(n => {
      if (n.id !== c2.id) {
        const p = bfsPath(n.id, c2.id);
        if (p) spawnAttackChain(p, 'counter');
      }
    });
    log(`&nbsp;&nbsp;└ <b>${isInsider ? 'INSIDER CONTAINED. Foothold isolated.' : 'C2 SEVERED. Adversary command lost.'}</b>`, 'log-good');
    STATE.threats = [];
    STATE.nodes.forEach(n => { if (n.state === 'attacked') n.state = 'stressed'; });
    // Insider: also restore the foothold node since they were sitting on it
    if (isInsider && c2 && c2.state !== 'healthy') {
      c2.state = 'stressed';
    }
    recordAction(ag.id, a.actionId, a.target, 'effective', null, []);
    setTimeout(() => {
      logJoshua('A strange game. The only winning move is to play it well. WELL PLAYED.');
      checkWinCondition();
    }, 1200);
  }
  else if (a.actionId === 'harden') {
    speak(verbose(`Hardening ${target.id}.`,
                  `Applying patches and segmentation to ${target.id}.`,
                  `Ansible hardening + SCAP baseline + microsegmentation push to ${target.id}.`));
    if (target.resilience >= 3) {
      speak(`${target.id} already at maximum resilience.`);
      recordAction(ag.id, a.actionId, a.target, 'wasted', 'already maxed', []);
    } else {
      target.resilience = Math.min(target.resilience + 1, 3);
      log(`&nbsp;&nbsp;└ ${target.id} resilience +1 (now ${target.resilience})`, 'log-good');
      recordAction(ag.id, a.actionId, a.target, 'effective', null, []);
    }
  }
  else if (a.actionId === 'restore') {
    speak(verbose(`Restoring ${target.id}.`,
                  `Restoring ${target.id} from clean backups.`,
                  `Velociraptor IR collection complete. Restoring ${target.id} from immutable backup; rotating creds.`));
    if (target.state === 'compromised') {
      target.state = 'stressed';
      log(`&nbsp;&nbsp;└ ${target.id} restored to STRESSED`, 'log-good');
      recordAction(ag.id, a.actionId, a.target, 'effective', null, []);
    } else if (target.state === 'attacked') {
      target.state = 'stressed';
      log(`&nbsp;&nbsp;└ ${target.id} attack contained`, 'log-good');
      recordAction(ag.id, a.actionId, a.target, 'effective', null, []);
    } else {
      speak(`${target.id} did not require restoration.`);
      recordAction(ag.id, a.actionId, a.target, 'wasted', 'target healthy', []);
    }
  }
}

function startConseqPhase() {
  if (STATE.c2Severed) return;
  setPhase('CONSEQ');
  document.getElementById('tap-hint').textContent = 'ADVERSARY ACTING';
  logDivider();
  log('<b>// CONSEQUENCES — Adversary advances</b>', 'log-crit');
  // Snapshot threats before advancement so AI launch doesn't mix in
  const threatsToAdvance = STATE.threats.slice();
  advanceThreatGated(threatsToAdvance, 0);
}

function advanceThreatGated(threatList, i) {
  if (i >= threatList.length) {
    // After all threats advanced, AI plans new launches
    aiPlanThreats();
    STATE.threats.forEach(t => {
      const target = getNode(t.target);
      if (target && target.state === 'healthy') target.state = 'attacked';
    });
    STATE.threats.forEach(t => {
      if (t.phase === 0) spawnAttackChain(t.path, 'attack');
    });
    gate(900, () => {
      // Capture metrics for this round before potentially advancing
      captureRoundMetrics();
      if (STATE.resolvedActions.length > 0) {
        showKillChainReplay(() => advanceRound());
      } else {
        advanceRound();
      }
    });
    return;
  }
  advanceThreat(threatList[i]);
  gate(700, () => advanceThreatGated(threatList, i + 1));
}

function advanceThreat(t) {
  const target = getNode(t.target);
  if (!target) return;
  if (target.state === 'compromised') return;
  STATE.resolvedActions.push({
    agentId: 'ADVERSARY',
    actionName: 'KILL CHAIN ADVANCE',
    targetId: t.target,
    techniqueId: t.techniqueId,
    kind: 'attack',
  });
  if (target.resilience > 0 && Math.random() < 0.7) {
    target.resilience--;
    log(`Hardening on ${target.id} blunted attack. Resilience -1.`, 'log-good');
    return;
  }
  t.phase++;
  const nextTech = pickNextPhaseTech(t);
  if (nextTech) {
    t.techniqueId = nextTech;
    t.history.push(nextTech);
  }
  log(`Threat advances on ${target.id} [phase ${t.phase}/3]`, 'log-warn');
  logTechnique(t.techniqueId);
  recordTechniqueObserved(t.techniqueId);
  spawnAttackChain(t.path, 'attack');
  if (t.phase >= 3) {
    target.state = 'compromised';
    log(`&nbsp;&nbsp;└ <b>${target.id} COMPROMISED</b>`, 'log-crit');
    STATE.threats = STATE.threats.filter(x => x !== t);
    adjacent(target.id).forEach(adj => {
      if (adj.state === 'healthy' && Math.random() < 0.3) {
        adj.state = 'stressed';
        log(`&nbsp;&nbsp;└ Cascade stress on ${adj.id}`, 'log-warn');
      }
    });
  }
}

function pickNextPhaseTech(t) {
  const phaseTactics = {
    1: ['Execution','Persistence','ML Attack Staging'],
    2: ['Lateral Movement','Persistence','Impair Process Control','Execution'],
    3: ['Impact','Loss','Manipulation','Disruption'],
  };
  const allowed = phaseTactics[t.phase] || ['Impact'];
  const A = STATE.activeActor;
  // v0.3: prefer actor's biased techniques first
  let pool = [];
  if (A) {
    if (t.phase === 3 && A.biasImpact) pool = A.biasImpact;
    else if (t.phase === 2 && A.biasExecution) pool = A.biasExecution;
    else if (A.techniqueAffinity) pool = A.techniqueAffinity;
  }
  // Filter to phase-appropriate techniques in mission mix that haven't been used yet
  const filterPool = pool.filter(tid => {
    const T = TECHNIQUES[tid];
    return T && allowed.some(a => T.tactic.includes(a)) &&
           !t.history.includes(tid) &&
           STATE.mission.threatMix.includes(tid);
  });
  if (filterPool.length > 0) return filterPool[Math.floor(Math.random() * filterPool.length)];
  // Fallback: any phase-appropriate tech in mission mix
  const matches = STATE.mission.threatMix.filter(tid => {
    const T = TECHNIQUES[tid];
    return T && allowed.some(a => T.tactic.includes(a)) && !t.history.includes(tid);
  });
  if (matches.length > 0) return matches[Math.floor(Math.random() * matches.length)];
  const impactMatches = STATE.mission.impactTechs.filter(tid => !t.history.includes(tid));
  return impactMatches[0] || t.techniqueId;
}

function advanceRound() {
  const compromised = STATE.nodes.filter(n => n.state === 'compromised').length;
  if (compromised >= STATE.mission.loseThreshold) {
    triggerLose(`${compromised} assets compromised. Threshold breached.`);
    return;
  }
  if (STATE.round >= STATE.mission.maxRounds) {
    if (compromised < STATE.mission.loseThreshold) {
      triggerWin(`Survived ${STATE.mission.maxRounds} rounds. Defense held.`);
      return;
    }
  }
  STATE.round++;
  STATE.killBoxActive = false;  // v0.4: combo effect expires at round end
  updateStatusBar();
  startIntelPhase();
}

function checkWinCondition() {
  if (STATE.c2Severed) {
    triggerWin('C2 severed. Adversary command structure neutralized.');
  }
}

function triggerWin(reason) {
  setPhase('WIN');
  // Capture final round metrics (in case advanceRound never gets called)
  if (STATE.metrics.rounds.length === 0 || STATE.metrics.rounds[STATE.metrics.rounds.length-1].round !== STATE.round) {
    captureRoundMetrics();
  }
  // v0.5: demo outro before replay/debrief
  const finishWin = () => {
    if (STATE.resolvedActions.length > 0) {
      showKillChainReplay(() => showDebrief(true, reason));
    } else {
      showDebrief(true, reason);
    }
  };
  if (STATE.demoMode && STATE.demoScript && STATE.demoScript.outro) {
    showNarratorCard({
      label: '▸ INSTRUCTOR — DEBRIEF',
      text: STATE.demoScript.outro,
      progress: 'DEMO COMPLETE',
      onContinue: () => {
        hideNarratorCard();
        STATE.demoMode = false;  // exit demo mode so debrief renders normally
        finishWin();
      },
      onExit: exitDemo,
    });
  } else {
    finishWin();
  }
}
function triggerLose(reason) {
  setPhase('LOSE');
  if (STATE.metrics.rounds.length === 0 || STATE.metrics.rounds[STATE.metrics.rounds.length-1].round !== STATE.round) {
    captureRoundMetrics();
  }
  if (STATE.resolvedActions.length > 0) {
    showKillChainReplay(() => showDebrief(false, reason));
  } else {
    showDebrief(false, reason);
  }
}

// v0.2.1: Full-screen Pylons-style debrief with RUBRIC / TRENDS / MOVES tabs
function showDebrief(win, reason) {
  const overlay = document.createElement('div');
  overlay.id = 'debrief-overlay';
  overlay.className = 'debrief-overlay';
  const color = win ? 'var(--green)' : 'var(--red)';
  const title = win ? 'MISSION COMPLETE' : 'MISSION FAILED';
  let rubric, cfiNote;
  let prepError = null;
  try {
    rubric = computeRubric();
    cfiNote = generateCFINote(rubric);
  } catch (err) {
    prepError = err;
    rubric = null;
    cfiNote = null;
    try { console.error('Debrief prep error', err); } catch(_){}
  }

  overlay.innerHTML = `
    <div class="debrief-header" style="border-bottom:2px solid ${color};">
      <div style="color:${color};font-size:14px;font-weight:bold;letter-spacing:0.15em;">${title}</div>
      <div style="color:var(--muted);font-size:10px;margin-top:2px;">${STATE.mission.name} · Round ${STATE.round}/${STATE.mission.maxRounds} · ${reason}</div>
    </div>
    <div class="debrief-tabs">
      <button class="debrief-tab active" data-dtab="rubric">RUBRIC</button>
      <button class="debrief-tab" data-dtab="trends">TRENDS</button>
      <button class="debrief-tab" data-dtab="moves">MOVES</button>
    </div>
    <div class="debrief-body" id="debrief-body"></div>
    <div class="debrief-footer">
      <button class="action-btn" id="db-mission-select" style="flex:1;">◀ MISSION SELECT</button>
      <button class="action-btn primary" id="db-retry" style="flex:1;">▶ RETRY</button>
    </div>
  `;
  document.getElementById('app').appendChild(overlay);

  let dtab = 'rubric';
  function renderDtab() {
    const body = document.getElementById('debrief-body');
    if (!body) return;
    if (prepError) {
      body.innerHTML = `<div style="color:var(--red);font-size:11px;padding:14px;line-height:1.5;">
        <div style="font-weight:bold;margin-bottom:8px;">⚠ Debrief preparation error</div>
        <div style="color:var(--white);font-family:monospace;font-size:10px;background:rgba(255,80,80,0.06);padding:8px;border:1px solid var(--red);">
          ${(prepError.message || String(prepError)).replace(/</g,'&lt;')}
        </div>
        <div style="color:var(--muted);margin-top:10px;font-size:10px;">
          computeRubric or generateCFINote threw before debrief could render.
          <br>Mission: ${(STATE.mission && STATE.mission.id) || '?'} ·
          Round: ${STATE.round} ·
          Actor: ${(STATE.activeActor && STATE.activeActor.id) || '?'}
        </div>
      </div>`;
      return;
    }
    try {
      let html = '';
      if (dtab === 'rubric') html = renderRubricTab(rubric, cfiNote, win);
      else if (dtab === 'trends') html = renderTrendsTab();
      else if (dtab === 'moves') html = renderMovesTab();
      if (!html || html.trim().length === 0) {
        html = `<div style="color:var(--amber);">⚠ Debrief renderer returned empty for tab "${dtab}". Please report.</div>`;
      }
      body.innerHTML = html;
    } catch (err) {
      // Defensive: show the error inline rather than leaving blank screen
      body.innerHTML = `<div style="color:var(--red);font-size:11px;padding:14px;line-height:1.5;">
        <div style="font-weight:bold;margin-bottom:8px;">⚠ Debrief render error</div>
        <div style="color:var(--white);font-family:monospace;font-size:10px;background:rgba(255,80,80,0.06);padding:8px;border:1px solid var(--red);">
          ${(err && err.message ? err.message : String(err)).replace(/</g,'&lt;')}
        </div>
        <div style="color:var(--muted);margin-top:10px;font-size:10px;">
          Mission: ${(STATE.mission && STATE.mission.id) || '?'} ·
          Round: ${STATE.round} ·
          Actor: ${(STATE.activeActor && STATE.activeActor.id) || '?'} ·
          Combos: ${(STATE.combosTriggered || []).length} ·
          Pivots: ${(STATE.pivotEvents || []).length}
        </div>
      </div>`;
      // also surface to console for further debugging
      try { console.error('Debrief render error', err); } catch(_){}
    }
  }
  renderDtab();

  overlay.querySelectorAll('.debrief-tab').forEach(b => {
    b.addEventListener('click', () => {
      dtab = b.dataset.dtab;
      overlay.querySelectorAll('.debrief-tab').forEach(x => x.classList.toggle('active', x.dataset.dtab === dtab));
      renderDtab();
    });
  });
  overlay.querySelector('#db-retry').addEventListener('click', () => location.reload());
  overlay.querySelector('#db-mission-select').addEventListener('click', () => location.reload());
}

function renderRubricTab(rubric, cfiNote, win) {
  const order = ['detection', 'attribution', 'efficiency', 'hardening', 'cascade', 'doctrine'];
  const labels = {
    detection: 'DETECTION SPEED',
    attribution: 'C2 ATTRIBUTION',
    efficiency: 'AGENT EFFICIENCY',
    hardening: 'HARDENING ECONOMY',
    cascade: 'CASCADE CONTAINMENT',
    doctrine: 'DOCTRINE',
  };
  const rows = order.map(k => {
    const r = rubric[k];
    const barColor = r.score >= 65 ? 'var(--green)' : r.score >= 45 ? 'var(--cyan)' : r.score >= 25 ? 'var(--amber)' : 'var(--red)';
    const filled = Math.round(r.score / 10);
    const bar = '█'.repeat(filled) + '░'.repeat(10 - filled);
    return `
      <div class="rubric-row">
        <div class="rubric-label">${labels[k]}</div>
        <div class="rubric-bar-row">
          <span class="rubric-bar" style="color:${barColor};">${bar}</span>
          <span class="rubric-score">${r.score}</span>
          <span class="rubric-tag" style="color:${barColor};">${r.label}</span>
        </div>
        <div class="rubric-detail">${r.detail}</div>
      </div>
    `;
  }).join('');
  const overall = Math.round(order.reduce((s, k) => s + rubric[k].score, 0) / order.length);
  return `
    <div class="rubric-overall">
      <div style="font-size:9px;color:var(--muted);letter-spacing:0.1em;">OVERALL</div>
      <div style="font-size:24px;font-weight:bold;color:${overall >= 65 ? 'var(--green)' : overall >= 45 ? 'var(--cyan)' : 'var(--amber)'};">${overall}</div>
      <div style="font-size:10px;color:var(--muted);">${scoreLabel(overall)}</div>
    </div>
    ${rows}
    <div class="cfi-note" style="margin-top:14px;border-left:3px solid var(--cyan);padding-left:8px;">
      <div style="color:var(--cyan);font-size:10px;font-weight:bold;letter-spacing:0.05em;margin-bottom:4px;">▸ JOSHUA — DEBRIEF NOTE</div>
      <div style="font-size:11px;line-height:1.6;color:var(--white);">${cfiNote}</div>
    </div>
  `;
}

function renderTrendsTab() {
  const m = STATE.metrics;
  if (m.rounds.length === 0) {
    return '<div style="color:var(--muted);">No round data captured.</div>';
  }
  function sparkline(values, max, color) {
    const blocks = '▁▂▃▄▅▆▇█';
    return values.map(v => {
      const idx = Math.min(blocks.length - 1, Math.round((v / Math.max(1, max)) * (blocks.length - 1)));
      return `<span style="color:${color};">${blocks[idx]}</span>`;
    }).join('');
  }
  const compromiseSeries = m.rounds.map(r => r.compromisedTotal);
  const wastedSeries = m.rounds.map(r => r.wastedActions);
  const effectiveSeries = m.rounds.map(r => r.effectiveActions);
  const threatsActiveSeries = m.rounds.map(r => r.threatsActive);
  const maxComp = STATE.mission.loseThreshold;
  const maxWaste = Math.max(1, ...wastedSeries);
  const maxEff = Math.max(1, ...effectiveSeries);
  const maxAct = Math.max(1, ...threatsActiveSeries);

  // Improvement detection
  const repeats = detectRepeatFailures();
  const totalWasted = m.actions.filter(a => a.outcome === 'wasted').length;
  const totalEff = m.actions.filter(a => a.outcome === 'effective').length;
  const earlyRounds = m.rounds.slice(0, Math.ceil(m.rounds.length / 2));
  const lateRounds = m.rounds.slice(Math.ceil(m.rounds.length / 2));
  const earlyWaste = earlyRounds.reduce((s, r) => s + r.wastedActions, 0);
  const lateWaste = lateRounds.reduce((s, r) => s + r.wastedActions, 0);
  const trend = lateWaste < earlyWaste ? 'IMPROVING' : lateWaste === earlyWaste ? 'FLAT' : 'DECLINING';
  const trendColor = trend === 'IMPROVING' ? 'var(--green)' : trend === 'FLAT' ? 'var(--amber)' : 'var(--red)';

  const repeatHTML = repeats.length === 0
    ? '<div style="color:var(--green);font-size:10px;">▸ No repeat failure patterns detected. You learned from your mistakes.</div>'
    : repeats.map(r => `<div style="color:var(--amber);font-size:10px;">▸ R${r.round}: ${r.agentId} ▸ ${r.actionId.toUpperCase()} (${r.wasteReason}) — also at R${r.firstRound}</div>`).join('');

  const roundLabel = m.rounds.map(r => String(r.round).padStart(2,' ')).join(' ');

  return `
    <div style="margin-bottom:14px;">
      <div style="color:var(--cyan);font-size:11px;font-weight:bold;letter-spacing:0.05em;">▸ ROUND-OVER-ROUND TREND</div>
      <div style="font-size:11px;margin-top:4px;">Wasted-action trend: <b style="color:${trendColor};">${trend}</b></div>
      <div style="color:var(--muted);font-size:9px;margin-top:2px;">Early rounds: ${earlyWaste} wasted · Late rounds: ${lateWaste} wasted</div>
    </div>

    <div class="trend-block">
      <div class="trend-label">COMPROMISE COUNT</div>
      <div class="trend-spark">${sparkline(compromiseSeries, maxComp, 'var(--red)')}</div>
      <div class="trend-detail">Loss threshold: ${STATE.mission.loseThreshold}. Final: ${compromiseSeries[compromiseSeries.length-1]}.</div>
    </div>

    <div class="trend-block">
      <div class="trend-label">WASTED ACTIONS / RND</div>
      <div class="trend-spark">${sparkline(wastedSeries, maxWaste, 'var(--amber)')}</div>
      <div class="trend-detail">Total wasted: ${totalWasted}. Lower is better.</div>
    </div>

    <div class="trend-block">
      <div class="trend-label">EFFECTIVE ACTIONS / RND</div>
      <div class="trend-spark">${sparkline(effectiveSeries, maxEff, 'var(--green)')}</div>
      <div class="trend-detail">Total effective: ${totalEff}.</div>
    </div>

    <div class="trend-block">
      <div class="trend-label">ACTIVE THREATS / RND</div>
      <div class="trend-spark">${sparkline(threatsActiveSeries, maxAct, 'var(--magenta)')}</div>
      <div class="trend-detail">Should bend down once you sever C2 or break chains effectively.</div>
    </div>

    <div style="margin-top:14px;">
      <div style="color:var(--cyan);font-size:11px;font-weight:bold;letter-spacing:0.05em;">▸ REPEAT FAILURE PATTERNS</div>
      <div style="margin-top:6px;">${repeatHTML}</div>
    </div>
  `;
}

function renderMovesTab() {
  const m = STATE.metrics;
  if (m.actions.length === 0) {
    return '<div style="color:var(--muted);">No actions recorded.</div>';
  }
  const rows = m.actions.map(a => {
    const colorMap = { effective: 'var(--green)', wasted: 'var(--red)', partial: 'var(--amber)' };
    const color = colorMap[a.outcome] || 'var(--white)';
    const symbol = a.outcome === 'effective' ? '✓' : a.outcome === 'wasted' ? '✗' : '~';
    const target = a.targetId || '—';
    const note = a.wasteReason ? ` <span style="color:var(--muted);font-size:9px;">(${a.wasteReason})</span>` : '';
    const techs = a.techniqueIds && a.techniqueIds.length > 0
      ? ' ' + a.techniqueIds.map(t => `<span class="tech-tap" data-tid="${t}" style="color:var(--magenta-dim);font-size:9px;">${t}</span>`).join(' ')
      : '';
    return `
      <div class="moves-row">
        <span class="moves-rnd">R${String(a.round).padStart(2,'0')}</span>
        <span class="moves-agent log-${a.agentId.toLowerCase()}">${a.agentId.padEnd(7,' ')}</span>
        <span class="moves-action">${a.actionId.toUpperCase().padEnd(8,' ')}</span>
        <span class="moves-target">${target.padEnd(10,' ')}</span>
        <span class="moves-outcome" style="color:${color};">${symbol}</span>${note}${techs}
      </div>
    `;
  }).join('');

  const summary = `
    <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-bottom:10px;">
      <div style="background:#0a141d;padding:6px;border:1px solid var(--green);border-radius:2px;text-align:center;">
        <div style="color:var(--green);font-size:14px;font-weight:bold;">${m.actions.filter(a => a.outcome === 'effective').length}</div>
        <div style="color:var(--muted);font-size:8px;">EFFECTIVE</div>
      </div>
      <div style="background:#0a141d;padding:6px;border:1px solid var(--red);border-radius:2px;text-align:center;">
        <div style="color:var(--red);font-size:14px;font-weight:bold;">${m.actions.filter(a => a.outcome === 'wasted').length}</div>
        <div style="color:var(--muted);font-size:8px;">WASTED</div>
      </div>
      <div style="background:#0a141d;padding:6px;border:1px solid var(--cyan);border-radius:2px;text-align:center;">
        <div style="color:var(--cyan);font-size:14px;font-weight:bold;">${m.actions.length}</div>
        <div style="color:var(--muted);font-size:8px;">TOTAL</div>
      </div>
    </div>
  `;
  return summary + '<div class="moves-table">' + rows + '</div>';
}

// 12. UI: AGENTS, TERMINAL, MODALS, CODEX

function setupAgents() {
  STATE.agents = AGENT_DEFS.map(def => ({ ...def, exhausted: false, speaking: false }));
  renderAgentStrip();
}

function renderAgentStrip() {
  const strip = document.getElementById('agent-strip');
  strip.innerHTML = '';
  STATE.agents.forEach((ag, i) => {
    const el = document.createElement('div');
    el.className = 'agent-card';
    el.style.setProperty('--accent', ag.color);
    el.style.setProperty('--accent-glow', hexA(ag.color, 0.5));
    if (STATE.selectedAgent === i && STATE.phase === 'PLAN') el.classList.add('active');
    if (ag.speaking) el.classList.add('speaking');
    // v0.4: count queued actions for this agent this round
    const queuedCount = STATE.plannedActions.filter(a => a.agent === i).length;
    const minCost = Math.min(...ag.actions.map(a => a.cost || 1));
    const apOk = (STATE.actionPointsUsed + minCost <= STATE.actionBudget);
    if (STATE.phase === 'PLAN' && !apOk) el.classList.add('exhausted');
    let statusLine;
    if (queuedCount > 0) statusLine = `<span style="color:var(--green);">●${queuedCount} QUEUED</span>`;
    else if (STATE.phase === 'PLAN' && !apOk) statusLine = '<span style="color:var(--amber);">NO AP</span>';
    else statusLine = 'READY';
    el.innerHTML = `
      <div class="agent-portrait">${buildPortraitSVG(ag)}</div>
      <div class="agent-info">
        <div class="agent-name">${ag.id}</div>
        <div class="agent-class">${ag.cls}</div>
        <div class="agent-status">${statusLine}</div>
      </div>
    `;
    el.addEventListener('click', () => onAgentTap(i));
    strip.appendChild(el);
  });
}

      <circle cx="22" cy="22" r="14" fill="${cd}" opacity="0.2"/>
      <circle cx="22" cy="22" r="8" fill="none" stroke="${c}" stroke-width="2"/>
      <circle cx="22" cy="22" r="3" fill="${c}"/>
      <line x1="22" y1="6" x2="22" y2="10" stroke="${c}" stroke-width="2"/>
      <line x1="22" y1="34" x2="22" y2="38" stroke="${c}" stroke-width="2"/>
      <line x1="6" y1="22" x2="10" y2="22" stroke="${c}" stroke-width="2"/>
      <line x1="34" y1="22" x2="38" y2="22" stroke="${c}" stroke-width="2"/>`;
  } else if (agent.id === 'WRAITH') {
    body = `
      <path d="M 8 36 L 22 6 L 36 36 Z" fill="${cd}" opacity="0.3" stroke="${cd}" stroke-width="1"/>

function makeAgentSpeak(agentIdx) {
  const ag = STATE.agents[agentIdx];
  if (!ag) return;
  ag.speaking = true;
  renderAgentStrip();
  setTimeout(() => { ag.speaking = false; renderAgentStrip(); }, 800);
}

function timeStamp() {
  const t = String(STATE.round).padStart(2, '0');
  const sub = String(Math.floor(Math.random() * 99)).padStart(2, '0');
  return `T${t}.${sub}`;
}

function verbose(novice, operator, analyst) {
  if (STATE.verbosity === 'novice')  return novice;
  if (STATE.verbosity === 'analyst') return analyst;
  return operator;
}

// v0.2.1: Speed-based gating. When MANUAL, wait for player CONTINUE tap.
// When STEADY/RAPID, just delay by ms.
function gate(ms, callback) {
  if (STATE.speed === 'manual') {
    STATE.gateResolved = false;
    STATE.gateCallback = callback;
    showContinuePrompt();
  } else {
    const delay = STATE.speed === 'rapid' ? Math.min(ms, 400) : ms;
    setTimeout(callback, delay);
  }
}

function showContinuePrompt() {
  const main = document.getElementById('btn-main');
  main.textContent = '▶ CONTINUE';
  main.classList.add('attract');
  main.disabled = false;
  document.getElementById('tap-hint').textContent = 'TAP CONTINUE TO ADVANCE';
}

function releaseGate() {
  if (STATE.gateResolved) return;
  STATE.gateResolved = true;
  const cb = STATE.gateCallback;
  STATE.gateCallback = null;
  const main = document.getElementById('btn-main');
  main.classList.remove('attract');
  if (cb) cb();
}

function log(html, cls) {
  STATE.log.push({ time: timeStamp(), html, cls: cls || 'log-info' });
  if (STATE.activeTab === 'log') renderTerminal();
}
function logJoshua(text) {
  STATE.log.push({ time: timeStamp(), html: `JOSHUA: ${text}`, cls: 'log-josh' });
  if (STATE.activeTab !== 'log' && STATE.activeTab !== 'intel') STATE.unreadComms++;
  renderTabs();
  if (STATE.activeTab === 'log') renderTerminal();
}
function logAgent(agentId, text) {
  const cls = `log-${agentId.toLowerCase()}`;
  STATE.log.push({ time: timeStamp(), html: `${agentId} ▸ ${text}`, cls });
  const ag = STATE.agents.findIndex(a => a.id === agentId);
  if (ag >= 0) makeAgentSpeak(ag);
  if (STATE.activeTab === 'log') renderTerminal();
}
function logTechnique(tid) {
  const T = TECHNIQUES[tid];
  if (!T) return;
  const fw = FRAMEWORKS[T.fw];
  const tappable = `<span class="tech-tap" data-tid="${tid}">${tid}</span>`;
  let line;
  if (STATE.verbosity === 'novice') {
    line = `&nbsp;&nbsp;└ ${T.novice || T.name}`;
  } else if (STATE.verbosity === 'operator') {
    line = `&nbsp;&nbsp;└ ${tappable} — ${T.name}<span class="framework-tag ${fw.cls}">${fw.short}</span>`;
  } else {
    const tools = T.tools ? ` <span style="color:var(--green);font-size:9px;">[${T.tools.slice(0,2).join(', ')}]</span>` : '';
    line = `&nbsp;&nbsp;└ ${tappable} — ${T.name}<span class="framework-tag ${fw.cls}">${fw.short}</span> ${T.tactic}${tools}`;
  }
  STATE.log.push({ time: timeStamp(), html: line, cls: 'log-tech' });
  if (STATE.activeTab === 'log') renderTerminal();
}
function logDivider() {
  STATE.log.push({ html: '─────────────────────────────', cls: 'log-divider', noTime: true });
  if (STATE.activeTab === 'log') renderTerminal();
}

function renderTerminal() {
  const el = document.getElementById('terminal-content');
  if (STATE.activeTab === 'log') {
    el.innerHTML = STATE.log.map(line => {
      if (line.noTime) return `<div class="log-line ${line.cls}">${line.html}</div>`;
      return `<div class="log-line"><span class="log-time">${line.time}</span><span class="${line.cls}">${line.html}</span></div>`;
    }).join('');
    el.scrollTop = el.scrollHeight;
  } else if (STATE.activeTab === 'brief') {
    renderBriefTab(el);
  } else if (STATE.activeTab === 'codex') {
    renderCodexTab(el);
  } else if (STATE.activeTab === 'intel') {
    STATE.unreadComms = 0;
    renderTabs();
    renderIntelTab(el);
  }
}

function renderBriefTab(el) {
  const m = STATE.mission;
  if (!m) return;
  // v0.2.1: Live mission dashboard (was: static brief)
  const compromised = STATE.nodes.filter(n => n.state === 'compromised');
  const attacked = STATE.nodes.filter(n => n.state === 'attacked');
  const stressed = STATE.nodes.filter(n => n.state === 'stressed');
  const hardened = STATE.nodes.filter(n => n.resilience > 0);
  const revealed = STATE.threats.filter(t => t.revealed);
  const hidden = STATE.threats.filter(t => !t.revealed);
  const fwBadges = m.frameworks.map(fw => {
    const F = FRAMEWORKS[fw];
    return `<span class="framework-tag ${F.cls}">${F.short}</span>`;
  }).join(' ');

  const compHTML = compromised.length > 0
    ? compromised.map(n => `<span class="log-crit">${n.id}</span>`).join(', ')
    : '<span class="log-good">none</span>';
  const attHTML = attacked.length > 0
    ? attacked.map(n => `<span class="log-warn">${n.id}</span>`).join(', ')
    : 'none';
  const hardHTML = hardened.length > 0
    ? hardened.map(n => `${n.id}+${n.resilience}`).join(', ')
    : 'none';

  const revealedThreatsHTML = revealed.length > 0
    ? revealed.map(t => `<div class="log-line">&nbsp;&nbsp;└ ${t.target} <span class="log-warn">[phase ${t.phase}/3]</span> <span class="tech-tap" data-tid="${t.techniqueId}">${t.techniqueId}</span></div>`).join('')
    : '<div class="log-line" style="color:var(--muted);">&nbsp;&nbsp;└ none confirmed</div>';

  el.innerHTML = `
    <div class="log-line log-cyan" style="font-weight:bold;">// LIVE BRIEF — ${m.name}</div>

function renderCodexTab(el) {
  // v0.2.1: contextual codex - active first, then mission, then global
  const grouped = {};
  Object.entries(TECHNIQUES).forEach(([tid, T]) => {
    if (!grouped[T.fw]) grouped[T.fw] = [];
    grouped[T.fw].push({ tid, ...T });
  });
  const activeRunTechs = Object.keys(STATE.observedTTPs);
  const missionFrameworks = STATE.mission ? STATE.mission.frameworks : [];

  function renderEntry(e, F, isActive) {
    const desc = STATE.verbosity === 'novice' ? (e.novice || e.desc) : e.desc;
    const tools = e.tools ? `<div class="codex-tools">▸ Tools: ${e.tools.join(', ')}</div>` : '';
    const counters = e.counters ? `<div class="codex-counters">▸ Counters: ${e.counters.join(', ')}</div>` : '';
    const observed = STATE.observedTTPs[e.tid] || 0;
    const obsBadge = observed > 0
      ? `<span style="color:var(--amber);font-size:9px;margin-left:4px;">[${observed}× this run]</span>`
      : '';
    const rowStyle = isActive ? 'border-left:2px solid var(--amber);padding-left:6px;' : '';
    return `
      <div class="codex-entry tech-tap" data-tid="${e.tid}" style="cursor:pointer;${rowStyle}">
        <div><span class="codex-id">${e.tid}</span> <span class="framework-tag ${F.cls}">${F.short}</span>${obsBadge}</div>
        <div class="codex-name">${e.name}</div>
        <div class="codex-desc"><i>${e.tactic}</i></div>
        <div class="codex-desc">${desc}</div>
        ${STATE.verbosity !== 'novice' ? tools : ''}
        ${STATE.verbosity === 'analyst' ? counters : ''}
        <div style="color:var(--cyan);font-size:9px;margin-top:4px;">▸ TAP for response options</div>
      </div>
    `;
  }

  let html = '';
  // v0.4: Always-visible combo reference at top so players can discover combos
  html += `<div class="log-line log-cyan" style="font-weight:bold;font-size:12px;margin-top:4px;">// COMBO SYNERGIES</div>`;
  html += `<div class="log-line" style="color:var(--muted);font-size:9px;margin:2px 0 4px;">Queue actions that interact — combos auto-trigger at execute time, applying bonuses atop normal resolution.</div>`;
  COMBOS.forEach(combo => {
    const triggeredCount = (STATE.combosTriggered || []).filter(c => c.comboId === combo.id).length;
    const triggeredBadge = triggeredCount > 0
      ? `<span style="color:var(--green);font-size:9px;margin-left:4px;">[${triggeredCount}× this run]</span>`
      : '';
    html += `
      <div class="codex-entry" style="border-left:2px solid ${combo.color};padding-left:6px;">
        <div><span style="color:${combo.color};font-weight:bold;font-size:11px;letter-spacing:0.05em;">▸▸ ${combo.name}</span>${triggeredBadge}</div>
        <div class="codex-desc" style="margin-top:3px;">${combo.desc}</div>
      </div>
    `;
  });
  // Section 1: Active this run
  if (activeRunTechs.length > 0) {
    html += `<div class="log-line log-cyan" style="font-weight:bold;font-size:12px;margin-top:8px;">// ACTIVE THIS RUN</div>`;
    activeRunTechs.forEach(tid => {
      const T = TECHNIQUES[tid];
      if (!T) return;
      const F = FRAMEWORKS[T.fw];
      html += renderEntry({ tid, ...T }, F, true);
    });
  }
  // Section 2: Mission frameworks
  html += `<div class="log-line log-cyan" style="font-weight:bold;font-size:12px;margin-top:8px;">// MISSION FRAMEWORKS</div>`;
  missionFrameworks.forEach(fwId => {
    const F = FRAMEWORKS[fwId];
    if (!F) return;
    const list = grouped[fwId] || [];
    html += `<div class="log-line" style="color:var(--cyan-dim);font-size:10px;margin-top:4px;">${F.name}</div>`;
    list.forEach(e => {
      if (activeRunTechs.includes(e.tid)) return;  // skip if already in active section
      html += renderEntry(e, F, false);
    });
  });
  // Section 3: Global (other frameworks)
  const otherFwIds = Object.keys(FRAMEWORKS).filter(fw => !missionFrameworks.includes(fw));
  if (otherFwIds.length > 0) {
    html += `<div class="log-line log-cyan" style="font-weight:bold;font-size:12px;margin-top:8px;color:var(--muted);">// GLOBAL (other frameworks)</div>`;
    otherFwIds.forEach(fwId => {
      const F = FRAMEWORKS[fwId];
      const list = grouped[fwId] || [];
      list.forEach(e => {
        if (activeRunTechs.includes(e.tid)) return;
        html += renderEntry(e, F, false);
      });
    });
  }
  el.innerHTML = html;
}

function renderIntelTab(el) {
  const m = STATE.mission;
  if (!m) { el.innerHTML = '<div class="log-line">No mission active.</div>'; return; }
  const A = STATE.activeActor;

  const observedList = Object.entries(STATE.observedTTPs).sort((a,b) => b[1] - a[1]);

    const matching = observedList.filter(([tid]) => A.techniqueAffinity.includes(tid));
    attribution = Math.min(100, matching.length * 18 + (STATE.c2Revealed ? 30 : 0));
  }
  STATE.actorAttribution = attribution;

  const showActor = STATE.difficulty === 'novice' || attribution >= 60;
  if (showActor) STATE.actorRevealed = true;

  const observedHTML = observedList.length === 0
    ? '<div class="log-line" style="color:var(--muted);">&nbsp;&nbsp;└ none yet — run VIGIL ▸ DEEP SCAN</div>'

      }).join('');

  // Actor block
  let actorHTML;
  if (showActor && A) {

    const flags = [];
    if (A.adaptive) flags.push('<span style="color:var(--magenta);">⚠ adaptive</span>');

    actorHTML = `

          <div style="color:var(--muted);font-size:9px;margin-top:2px;">Attribution: ${attribution}%</div>
          ${flags.length > 0 ? '<div style="font-size:9px;margin-top:2px;">' + flags.join(' · ') + '</div>' : ''}
        </div>
      </div>`;
  } else {
    actorHTML = `
      <div class="log-line"><span style="color:var(--amber);">ARCHETYPE:</span> <i style="color:var(--muted);">unknown — collect more TTPs to attribute</i></div>
      <div class="log-line"><span style="color:var(--amber);">ATTRIBUTION:</span> ${attribution}%</div>`;
  }

  // C2 + IOCs
  const isInsider = A && A.insiderMode;
  const c2Label = isInsider ? 'FOOTHOLD' : 'C2';
  const c2Line = STATE.c2Severed
    ? `<div class="log-line log-good">&nbsp;&nbsp;└ ${isInsider ? 'CONTAINED' : 'SEVERED'} — adversary command neutralized</div>`
    : STATE.c2Revealed
    ? `<div class="log-line log-crit">&nbsp;&nbsp;└ ${isInsider ? 'IDENTIFIED' : 'LOCATED'} at ${STATE.c2Node}</div><div class="log-line log-warn">&nbsp;&nbsp;└ RECOMMENDATION: WRAITH ▸ SEVER</div>`
    : `<div class="log-line" style="color:var(--muted);">&nbsp;&nbsp;└ unknown — TRACE C2 required</div>`;

  const iocsHTML = STATE.iocs.length === 0

    : STATE.iocs.map(i => `<div class="log-line">&nbsp;&nbsp;└ ${i}</div>`).join('');

  const hardened = STATE.nodes.filter(n => n.resilience > 0);
  const hardHTML = hardened.length === 0
    ? '<div class="log-line" style="color:var(--muted);">&nbsp;&nbsp;└ no nodes hardened</div>'
    : hardened.map(n => `<div class="log-line">&nbsp;&nbsp;└ ${n.id}: +${n.resilience} resilience</div>`).join('');

  // Pivot history
  const pivotHTML = STATE.pivotEvents.length === 0
    ? ''
    : '<br><div class="log-line log-warn">▸ ADVERSARY PIVOTS</div>' +
      STATE.pivotEvents.map(p => `<div class="log-line">&nbsp;&nbsp;└ R${p.round}: ${p.from} → ${p.to}</div>`).join('');

  el.innerHTML = `
    <div class="log-line log-cyan" style="font-weight:bold;">// THREAT INTEL</div>
    <div class="log-line log-divider">─────────────────────────────</div>
    ${actorHTML}
    <br>
    <div class="log-line log-cyan">▸ OBSERVED TTPs</div>
    ${observedHTML}
    <br>
    <div class="log-line log-crit">▸ ${c2Label} STATUS</div>

    <br>
    <div class="log-line log-good">▸ IOCs</div>

const replayCanvas = document.getElementById('replay-canvas');
const replayCtx = replayCanvas.getContext('2d');

function showKillChainReplay(onDone) {
  if (STATE.resolvedActions.length === 0) { onDone(); return; }
  STATE.replayActive = true;
  const overlay = document.getElementById('replay-overlay');
  overlay.classList.add('active');
  const stack = document.getElementById('replay-cards');
  stack.innerHTML = '';
  STATE.resolvedActions.forEach((a) => {
    const card = document.createElement('div');
    card.className = 'replay-card' + (a.kind === 'counter' ? ' counter' : '');
    let id = a.techniqueId || a.actionId || '';
    let name = a.actionName || (a.techniqueId && TECHNIQUES[a.techniqueId] ? TECHNIQUES[a.techniqueId].name : '');
    let fw = '';
    if (a.techniqueId && TECHNIQUES[a.techniqueId]) {
      fw = FRAMEWORKS[TECHNIQUES[a.techniqueId].fw].short;
    } else if (a.d3fend) {
      fw = 'D3FEND';
    }
    card.innerHTML = `
      <div class="rc-id">${id}</div>
      <div class="rc-name">${name}</div>
      <div class="rc-fw">${a.agentId || ''} ${fw ? '· '+fw : ''}</div>
    `;
    stack.appendChild(card);
  });
  // Sized canvas — use canvas's own rect after CSS layout, so it works in
  // both portrait (full width, short height) and landscape (constrained width
  // by flex sidebars, tall height by stretching).
  // Force a layout flush by reading offsetWidth before measuring.
  void replayCanvas.offsetWidth;
  const cRect = replayCanvas.getBoundingClientRect();
  const cw = Math.max(100, cRect.width);
  const ch = Math.max(100, cRect.height);
  const dpr = window.devicePixelRatio || 1;
  replayCanvas.width = Math.floor(cw * dpr);
  replayCanvas.height = Math.floor(ch * dpr);
  replayCanvas.style.width = cw + 'px';
  replayCanvas.style.height = ch + 'px';
  replayCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const startTime = performance.now();
  const cards = stack.querySelectorAll('.replay-card');
  function tick(now) {
    if (!STATE.replayActive) return;
    const elapsed = (now - startTime) / 1000;
    const total = STATE.resolvedActions.length * 0.5 + 1;
    drawReplayCanvas(elapsed, cw, ch);
    cards.forEach((c, i) => {
      if (elapsed > i * 0.4) c.classList.add('shown');
    });
    if (elapsed < total) {
      requestAnimationFrame(tick);
    } else {
      setTimeout(() => endReplay(onDone), 1500);
    }
  }
  requestAnimationFrame(tick);
  document.getElementById('replay-skip').onclick = () => endReplay(onDone);
}

function drawReplayCanvas(elapsed, w, h) {
  replayCtx.fillStyle = '#03060a';
  replayCtx.fillRect(0, 0, w, h);
  replayCtx.strokeStyle = 'rgba(78,226,255,0.1)';
  replayCtx.lineWidth = 1;
  for (let x = 0; x < w; x += 20) {
    replayCtx.beginPath(); replayCtx.moveTo(x,0); replayCtx.lineTo(x,h); replayCtx.stroke();
  }
  for (let y = 0; y < h; y += 20) {
    replayCtx.beginPath(); replayCtx.moveTo(0,y); replayCtx.lineTo(w,y); replayCtx.stroke();
  }
  const n = STATE.resolvedActions.length;
  const slotW = w / Math.max(n, 1);
  STATE.resolvedActions.forEach((a, i) => {
    const cx = slotW * i + slotW / 2;
    const cy = h / 2;
    const showAt = i * 0.4;
    if (elapsed < showAt) return;
    const localT = Math.min(1, (elapsed - showAt) / 0.5);
    const color = a.kind === 'counter' ? '#5cff8a' : '#ff3a3a';
    const r = 10 + Math.sin(elapsed * 4 + i) * 2;
    const grad = replayCtx.createRadialGradient(cx, cy, r*0.5, cx, cy, r*3);
    grad.addColorStop(0, hexA(color, 0.6 * localT));
    grad.addColorStop(1, hexA(color, 0));
    replayCtx.fillStyle = grad;
    replayCtx.beginPath(); replayCtx.arc(cx, cy, r*3, 0, Math.PI*2); replayCtx.fill();
    replayCtx.fillStyle = '#03060a';
    replayCtx.strokeStyle = color;
    replayCtx.lineWidth = 2;
    replayCtx.beginPath(); replayCtx.arc(cx, cy, r * localT, 0, Math.PI*2);
    replayCtx.fill(); replayCtx.stroke();
    if (i > 0 && elapsed > showAt + 0.1) {
      const px = slotW * (i-1) + slotW / 2;
      const lerpT = Math.min(1, (elapsed - showAt - 0.1) / 0.3);
      replayCtx.strokeStyle = color;
      replayCtx.lineWidth = 1.5;
      replayCtx.shadowColor = color;
      replayCtx.shadowBlur = 6;
      replayCtx.beginPath();
      replayCtx.moveTo(px, cy);
      replayCtx.lineTo(px + (cx - px) * lerpT, cy);
      replayCtx.stroke();
      replayCtx.shadowBlur = 0;
    }
    replayCtx.fillStyle = color;
    replayCtx.font = 'bold 8px JetBrains Mono, monospace';
    replayCtx.textAlign = 'center';
    replayCtx.fillText((a.agentId || 'ADV').slice(0,4), cx, cy + r + 14);
  });
}

function endReplay(onDone) {
  STATE.replayActive = false;
  document.getElementById('replay-overlay').classList.remove('active');
  if (onDone) onDone();
}

function onAgentTap(i) {
  if (STATE.phase !== 'PLAN') return;
  const ag = STATE.agents[i];
  // v0.4: AP-based gating instead of per-agent exhaustion
  const minCost = Math.min(...ag.actions.map(a => a.cost || 1));
  if (STATE.actionPointsUsed + minCost > STATE.actionBudget) {
    log(`Insufficient action points for ${ag.id}.`, 'log-warn');
    return;
  }
  STATE.selectedAgent = i;
  STATE.selectedTarget = null;
  renderAgentStrip();
  showAgentActionModal(i);
}

function showAgentActionModal(i) {
  const ag = STATE.agents[i];
  const modal = document.createElement('div');
  modal.className = 'modal';
  modal.innerHTML = `
    <div class="modal-content" style="border-color:${ag.color};box-shadow:0 0 24px ${hexA(ag.color, 0.4)};">
      <div class="modal-title" style="color:${ag.color};">${ag.id} — ${ag.cls}</div>
      <div class="modal-body" style="color:var(--muted);font-size:10px;">${ag.desc}</div>
      <div id="action-list"></div>
      <div style="display:flex;gap:6px;margin-top:8px;">
        <button class="action-btn" id="cancel-action" style="flex:1;">CANCEL</button>
      </div>
    </div>
  `;
  document.getElementById('app').appendChild(modal);
  const list = modal.querySelector('#action-list');
  ag.actions.forEach(act => {
    const btn = document.createElement('button');
    btn.className = 'action-btn';
    btn.style.width = '100%';
    btn.style.marginBottom = '6px';
    btn.style.textAlign = 'left';
    btn.style.padding = '8px';
    let extra = '';
    if (STATE.verbosity !== 'novice') {
      extra = `<div style="color:var(--green);font-size:8px;text-transform:none;letter-spacing:0;margin-top:3px;">${act.d3fend || ''}</div>`;
    }
    const cost = act.cost || 1;
    const apOk = (STATE.actionPointsUsed + cost <= STATE.actionBudget);
    // v0.4: combo hint — would picking this action *potentially* trigger any combo
    // given what's already queued? (We can't know targets yet, but we can hint by action class.)
    const comboHints = previewComboHints(act.id);
    const comboHTML = comboHints.length > 0
      ? `<div style="font-size:9px;text-transform:none;letter-spacing:0;margin-top:3px;line-height:1.4;">` +
        comboHints.map(c => `<span style="color:${c.color};">▸▸ ${c.name}</span> <span style="color:var(--muted);">${c.condition}</span>`).join('<br>') +
        `</div>`
      : '';
    btn.innerHTML = `<div style="color:${ag.color};display:flex;justify-content:space-between;">
      <span>▸ ${act.name}</span>
      <span style="color:${apOk ? 'var(--cyan)' : 'var(--red)'};font-size:10px;">[${cost}AP]</span>
    </div>
      <div style="color:var(--muted);font-size:9px;font-weight:normal;text-transform:none;letter-spacing:0;margin-top:2px;">${act.desc}</div>
      ${extra}
      ${comboHTML}`;
    if (act.id === 'sever' && !STATE.c2Revealed) {
      btn.disabled = true;
      btn.innerHTML += `<div style="color:var(--red);font-size:9px;text-transform:none;letter-spacing:0;margin-top:2px;">[REQUIRES C2 REVEALED]</div>`;
    } else if (!apOk) {
      btn.disabled = true;
      btn.innerHTML += `<div style="color:var(--red);font-size:9px;text-transform:none;letter-spacing:0;margin-top:2px;">[NOT ENOUGH AP — ${STATE.actionBudget - STATE.actionPointsUsed} REMAINING]</div>`;
    }
    btn.addEventListener('click', () => {
      modal.remove();
      STATE.selectedAction = act.id;
      promptForTarget(i, act);
    });
    list.appendChild(btn);
  });
  modal.querySelector('#cancel-action').addEventListener('click', () => {
    STATE.selectedAgent = null;
    renderAgentStrip();
    modal.remove();
  });
}

// v0.4: Predict which combos *could* trigger if the player commits this action,
// based on what's already queued. Targets aren't known yet so hints are aspirational.
function previewComboHints(actionId) {
  const queued = STATE.plannedActions.map(a => a.actionId);
  const hints = [];
  // RECON STRIKE: scan + disrupt same target
  if (actionId === 'scan' && queued.includes('disrupt')) {
    hints.push({ name: 'RECON STRIKE', color: '#4ee2ff', condition: 'if same target as queued DISRUPT' });
  } else if (actionId === 'disrupt' && queued.includes('scan')) {
    hints.push({ name: 'RECON STRIKE', color: '#4ee2ff', condition: 'if same target as queued SCAN' });
  }
  // KILL BOX: 2 disrupts on adjacent
  if (actionId === 'disrupt' && queued.includes('disrupt')) {
    hints.push({ name: 'KILL BOX', color: '#ff4ea8', condition: 'if adjacent to queued DISRUPT' });
  }
  // BULWARK: 2 hardens on same target
  if (actionId === 'harden' && queued.includes('harden')) {
    hints.push({ name: 'BULWARK', color: '#ffb84d', condition: 'if same target as queued HARDEN' });
  }
  // TRIANGULATE: scan + trace this round
  if (actionId === 'scan' && queued.includes('trace')) {
    hints.push({ name: 'TRIANGULATE', color: '#4ee2ff', condition: 'guaranteed C2 reveal' });
  } else if (actionId === 'trace' && queued.includes('scan')) {
    hints.push({ name: 'TRIANGULATE', color: '#4ee2ff', condition: 'guaranteed C2 reveal' });
  }
  // COVERED RESTORE: disrupt + restore same target
  if (actionId === 'disrupt' && queued.includes('restore')) {
    hints.push({ name: 'COVERED RESTORE', color: '#ffb84d', condition: 'if same target as queued RESTORE' });
  } else if (actionId === 'restore' && queued.includes('disrupt')) {
    hints.push({ name: 'COVERED RESTORE', color: '#ffb84d', condition: 'if same target as queued DISRUPT' });
  }
  return hints;
}

function promptForTarget(agentIdx, action) {
  const ag = STATE.agents[agentIdx];
  if (action.id === 'trace') {
    queueAction(agentIdx, action, null);
    return;
  }
  if (action.id === 'sever') {
    if (!STATE.c2Revealed) return;
    queueAction(agentIdx, action, STATE.c2Node);
    return;
  }
  document.getElementById('tap-hint').textContent = `${ag.id} ▸ ${action.name} — TAP TARGET NODE`;
}

function onMapTap(x, y) {
  if (STATE.phase !== 'PLAN') {
    const n = nearestNode(x, y);
    if (n) inspectNode(n);
    return;
  }
  if (STATE.selectedAgent === null) {
    const n = nearestNode(x, y);
    if (n) inspectNode(n);
    return;
  }
  const n = nearestNode(x, y);
  if (!n) return;
  const ag = STATE.agents[STATE.selectedAgent];
  const action = ag.actions.find(a => a.id === STATE.selectedAction);
  if (!action) return;
  queueAction(STATE.selectedAgent, action, n.id);
}

function queueAction(agentIdx, action, targetId) {
  const ag = STATE.agents[agentIdx];
  // v0.4: Check action point budget
  const cost = action.cost || 1;
  if (STATE.actionPointsUsed + cost > STATE.actionBudget) {
    log(`<span class="log-warn">⚠ Insufficient action points (${STATE.actionBudget - STATE.actionPointsUsed} remaining, ${cost} required)</span>`, 'log-warn');
    STATE.selectedAgent = null;
    STATE.selectedAction = null;
    document.getElementById('tap-hint').textContent = 'SELECT AGENT, THEN TARGET NODE';
    renderAgentStrip();
    return;
  }
  STATE.plannedActions.push({
    agent: agentIdx,
    actionId: action.id,
    actionName: action.name,
    target: targetId,
    cost: cost,
  });
  STATE.actionPointsUsed += cost;
  // v0.4: agents NOT exhausted; AP is the budget. Multiple actions per agent OK.
  log(`<span class="log-${ag.id.toLowerCase()}">${ag.id}</span> queued ▸ ${action.name} <span style="color:var(--muted);">[${cost}AP]</span>${targetId ? ' → ' + targetId : ''}`);
  STATE.selectedAgent = null;
  STATE.selectedTarget = null;
  STATE.selectedAction = null;
  document.getElementById('tap-hint').textContent = 'SELECT AGENT, THEN TARGET NODE';
  renderAgentStrip();
  updateMainButton();
  updateBudgetDisplay();
}

function updateBudgetDisplay() {
  // v0.4: Display action points in status bar
  const budgetEl = document.getElementById('stat-budget');
  if (!budgetEl) return;
  const remaining = STATE.actionBudget - STATE.actionPointsUsed;
  budgetEl.innerHTML = `${remaining}/${STATE.actionBudget}`;
  budgetEl.style.color = remaining === 0 ? 'var(--amber)' : 'var(--cyan)';
}

function nearestNode(x, y) {
  let best = null, bestD = 32 * 32;
  STATE.nodes.forEach(n => {
    if (typeof n.x !== 'number' || typeof n.y !== 'number') return;
    const dx = n.x - x, dy = n.y - y;
    const d = dx*dx + dy*dy;
    if (d < bestD) { bestD = d; best = n; }
  });
  return best;
}

function inspectNode(n) {
  STATE.inspectingNode = n.id;
  STATE.selectedTarget = n.id;
  let stateLabel = n.state.toUpperCase();
  let extra = '';
  if (n.id === STATE.c2Node && STATE.c2Revealed) extra = ' [◢ C2 ◣]';
  if (n.resilience > 0) extra += ` [+${n.resilience} HARDENED]`;
  log(`▸ INSPECT ${n.id} (${n.type}): ${stateLabel}${extra}`, 'log-cyan');
  const ts = STATE.threats.filter(t => t.target === n.id && t.revealed);
  ts.forEach(t => log(`&nbsp;&nbsp;└ INCOMING THREAT phase ${t.phase}/3`, 'log-warn'));
}

function showTechniqueCard(tid) {
  const T = TECHNIQUES[tid];
  if (!T) return;
  const fw = FRAMEWORKS[T.fw];
  // Determine recommendations based on game state + technique tags
  const activeThreats = STATE.threats.filter(t => t.techniqueId === tid && t.revealed);
  const compromisedNodes = STATE.nodes.filter(n => n.state === 'compromised');
  const recs = [];

  if (T.surfaceable_by && T.surfaceable_by.includes('scan')) {
    recs.push({ urgency: 'detect', text: 'VIGIL ▸ DEEP SCAN reveals threats on target node and adjacent nodes.' });
  }
  if (T.attribution && T.attribution.includes('trace') && !STATE.c2Revealed) {
    recs.push({ urgency: 'detect', text: 'VIGIL ▸ TRACE C2 — chance increases as more threats are revealed.' });
  }
  if (T.breakable_by && T.breakable_by.includes('disrupt') && activeThreats.length > 0) {
    const targets = [...new Set(activeThreats.map(t => t.target))];
    recs.push({ urgency: 'high', text: `WRAITH ▸ DISRUPT on ${targets.join(', ')} breaks the active chain.` });
  } else if (T.breakable_by && T.breakable_by.includes('disrupt')) {
    recs.push({ urgency: 'medium', text: 'WRAITH ▸ DISRUPT — applies if this technique becomes active on a node.' });
  }
  if (STATE.c2Revealed && !STATE.c2Severed) {
    recs.push({ urgency: 'critical', text: `WRAITH ▸ SEVER C2 — adversary command at ${STATE.c2Node} is exposed. Severing ends the campaign.` });
  }
  if (T.mitigable_by && T.mitigable_by.includes('harden')) {
    recs.push({ urgency: 'medium', text: 'ANCHOR ▸ HARDEN target — adds resilience charge to absorb the next phase advance.' });
  }
  if (T.recoverable_by && T.recoverable_by.includes('restore') && compromisedNodes.length > 0) {
    recs.push({ urgency: 'high', text: `ANCHOR ▸ RESTORE — recover compromised: ${compromisedNodes.map(n => n.id).join(', ')}` });
  }
  if (T.priority === 'critical') {
    recs.unshift({ urgency: 'critical', text: 'CRITICAL — this is an Impact-tactic technique. Allowing it to complete causes asset compromise.' });
  }

  const recsHTML = recs.map(r => {
    const colorMap = { critical: 'var(--red)', high: 'var(--magenta)', medium: 'var(--amber)', detect: 'var(--cyan)', low: 'var(--muted)' };
    return `<div class="rec-line" style="border-left:2px solid ${colorMap[r.urgency]};padding-left:6px;margin-bottom:4px;font-size:10px;">${r.text}</div>`;
  }).join('');

  const observed = STATE.observedTTPs[tid] || 0;
  const observedLine = observed > 0
    ? `<div style="color:var(--amber);font-size:9px;margin-top:4px;">▸ Observed ${observed}× this run</div>`
    : '';

  const desc = STATE.verbosity === 'novice' ? (T.novice || T.desc) : T.desc;
  const tools = T.tools ? `<div style="color:var(--green);font-size:9px;margin-top:6px;">▸ Detection tools: ${T.tools.join(', ')}</div>` : '';
  const counters = T.counters ? `<div style="color:var(--cyan);font-size:9px;margin-top:4px;">▸ D3FEND: ${T.counters.join('; ')}</div>` : '';

  const modal = document.createElement('div');
  modal.className = 'modal';
  modal.innerHTML = `
    <div class="modal-content" style="max-width:340px;">
      <div class="modal-title" style="display:flex;align-items:center;gap:6px;">
        <span style="color:var(--cyan);">${tid}</span>
        <span class="framework-tag ${fw.cls}">${fw.short}</span>
      </div>
      <div style="color:var(--white);font-weight:bold;margin-bottom:4px;">${T.name}</div>
      <div style="color:var(--muted);font-size:10px;font-style:italic;">${T.tactic}</div>
      ${observedLine}
      <div style="margin-top:10px;color:var(--cyan);font-size:10px;font-weight:bold;letter-spacing:0.05em;">▸ WHAT IT IS</div>
      <div style="color:var(--white);font-size:11px;margin-top:3px;line-height:1.5;">${desc}</div>
      ${STATE.verbosity !== 'novice' ? tools : ''}
      ${STATE.verbosity === 'analyst' ? counters : ''}
      <div style="margin-top:10px;color:var(--green);font-size:10px;font-weight:bold;letter-spacing:0.05em;">▸ RECOMMENDED RESPONSE</div>
      <div style="margin-top:4px;">${recsHTML || '<div style="color:var(--muted);font-size:10px;">No specific countermeasure available — focus on hardening.</div>'}</div>
      <button class="action-btn primary" id="techcard-close" style="width:100%;margin-top:12px;">CLOSE</button>
    </div>
  `;
  document.getElementById('app').appendChild(modal);
  modal.querySelector('#techcard-close').addEventListener('click', () => modal.remove());
  // Tap-outside to dismiss
  modal.addEventListener('click', (e) => {
    if (e.target === modal) modal.remove();
  });
}

function beginGame(missionId) {
  STATE.mission = MISSIONS[missionId];
  STATE.round = 1;
  STATE.threats = [];
  STATE.attackChains = [];
  STATE.particles = [];
  STATE.log = [];
  STATE.resolvedActions = [];
  STATE.c2Revealed = false;
  STATE.c2Severed = false;
  STATE.observedTTPs = {};
  STATE.iocs = [];
  STATE.actorRevealed = false;
  STATE.actorAttribution = 0;
  STATE.pivotEvents = [];
  // v0.4 resets
  STATE.actionPointsUsed = 0;
  STATE.combosTriggered = [];
  STATE.killBoxActive = false;
  STATE.metrics = {
    rounds: [], actions: [], threatSpawns: [],
    firstThreatRevealedRound: null, c2RevealedRound: null, c2SeveredRound: null,
  };

  // v0.5: demo override OR random actor selection
  if (STATE.demoMode && STATE.demoScript) {
    STATE.activeActor = THREAT_ACTORS[STATE.demoScript.actor];
    STATE.difficulty = STATE.demoScript.difficulty || 'operator';
  } else {
    const valid = STATE.mission.validActors || [STATE.mission.defaultActor || 'CRYO'];
    const actorId = valid[Math.floor(Math.random() * valid.length)];
    STATE.activeActor = THREAT_ACTORS[actorId];
  }

  resizeCanvas();
  if (STATE.mission.id === 'BLACKFROST') setupEnergyGrid();
  else if (STATE.mission.id === 'NIGHTWATCH') setupSatelliteOps();
  else if (STATE.mission.id === 'TIDEBREAK') setupMaritimePort();
  setupAgents();

  // v0.5: demo overrides C2 from script
  if (STATE.demoMode && STATE.demoScript) {
    STATE.c2Node = STATE.demoScript.c2Node;
  } else {
    pickC2();
  }

  log(`<b>// JOSHUA PROTOCOL — ${STATE.mission.name}</b>`, 'log-cyan');
  log(`${STATE.mission.sector}`, 'log-info');
  if (STATE.demoMode) {
    log('<b style="color:var(--cyan);">// TUTORIAL DEMO — instructor walkthrough</b>', 'log-cyan');
    const badge = document.getElementById('demo-badge');
    if (badge) badge.style.display = 'inline-block';
  } else {
    const badge = document.getElementById('demo-badge');
    if (badge) badge.style.display = 'none';
  }
  logJoshua('Operator, situational picture coming up. Hostile activity detected. Threat attribution pending.');

  showThreatActorIntro(() => {
    // v0.5 demo: spawn threats from script, not RNG
    if (STATE.demoMode && STATE.demoScript) {
      const r1 = STATE.demoScript.rounds.find(r => r.round === 1);
      if (r1 && r1.threatSpawns) {
        r1.threatSpawns.forEach(s => spawnDemoThreat(s.target, s.techniqueId));
      }
    } else {
      maybeLaunchThreat();
    }
    STATE.threats.forEach(t => {
      const target = getNode(t.target);
      if (target && target.state === 'healthy') target.state = 'attacked';
      spawnAttackChain(t.path, 'attack');
    });
    startIntelPhase();
    requestAnimationFrame(renderLoop);
  });
}

function spawnDemoThreat(targetId, techId) {
  const c2 = getNode(STATE.c2Node);
  const target = getNode(targetId);
  if (!c2 || !target) return;
  const path = bfsPath(STATE.c2Node, targetId) || [STATE.c2Node, targetId];
  STATE.threats.push({
    target: targetId,
    path,
    phase: 0,
    techniqueId: techId,
    revealed: false,
    history: [techId],
    spawnRound: STATE.round,
    pivotedFrom: null,
  });
  STATE.metrics.threatSpawns.push({ round: STATE.round, target: targetId, techniqueId: techId });
  if (target.state === 'healthy') target.state = 'attacked';
}
