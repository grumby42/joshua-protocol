function beginDemo(missionId) {
  const script = DEMOS[missionId];
  if (!script) {
    console.warn('No demo script for', missionId);
    return;
  }
  STATE.demoMode = true;
  STATE.demoScript = script;
  // Show intro narrator card before mission boots — wraps beginGame
  showNarratorCard({
    label: '▸ INSTRUCTOR — INTRO',
    text: script.intro,
    progress: `${script.missionId} DEMO`,
    onContinue: () => {
      hideNarratorCard();
      beginGame(missionId);
    },
    onExit: exitDemo,
  });
}

function exitDemo() {
  STATE.demoMode = false;
  STATE.demoScript = null;
  STATE.demoNarrationQueue = [];
  hideNarratorCard();
  // Reload to fresh state
  location.reload();
}

function spawnDemoThreat(targetId, techId) {
  const c2 = getNode(STATE.c2Node);
  const target = getNode(targetId);
  if (!c2 || !target) return;
  const path = bfsPath(STATE.c2Node, targetId) || [STATE.c2Node, targetId];
  STATE.threats.push({
    target: targetId,
    path,
    phase: 0,
    techniqueId: techId,
    revealed: false,
    history: [techId],
    spawnRound: STATE.round,
    pivotedFrom: null,
  });
  STATE.metrics.threatSpawns.push({ round: STATE.round, target: targetId, techniqueId: techId });
  if (target.state === 'healthy') target.state = 'attacked';
}

// Narrator card management — single-card display, tap CONTINUE to advance
let narratorPendingResolve = null;
function showNarratorCard({ label, text, progress, onContinue, onExit }) {
  const card = document.getElementById('narrator-card');
  if (!card) return;
  document.getElementById('narrator-label').textContent = label || '▸ INSTRUCTOR';
  document.getElementById('narrator-text').textContent = text || '';
  document.getElementById('narrator-progress').textContent = progress || '';
  card.classList.add('shown');
  card.style.display = 'block';
  // Wire fresh handlers (replace prior)
  const cont = document.getElementById('narrator-continue');
  const exit = document.getElementById('narrator-exit');
  cont.onclick = () => { if (onContinue) onContinue(); };
  exit.onclick = () => { if (onExit) onExit(); };
}
function hideNarratorCard() {
  const card = document.getElementById('narrator-card');
  if (card) {
    card.classList.remove('shown');
    card.style.display = 'none';
  }
}

// Step the demo into the next phase: deliver narration beats then auto-queue actions
function demoOnPhaseEnter(phase) {
  if (!STATE.demoMode || !STATE.demoScript) return;
  const roundData = STATE.demoScript.rounds.find(r => r.round === STATE.round);
  if (!roundData) {
    // Demo script ran out — fall back to normal play OR show outro
    return;
  }
  const beats = (roundData.narration || []).filter(n => n.phase === phase);
  if (beats.length > 0) {
    queueDemoNarration(beats, () => demoExecutePhaseActions(phase, roundData));
  } else {
    demoExecutePhaseActions(phase, roundData);
  }
}

function queueDemoNarration(beats, onAllDone) {
  let i = 0;
  function step() {
    if (i >= beats.length) {
      hideNarratorCard();
      if (onAllDone) onAllDone();
      return;
    }
    const beat = beats[i];
    showNarratorCard({
      label: `▸ INSTRUCTOR — R${STATE.round} ${beat.phase}`,
      text: beat.text,
      progress: `BEAT ${i+1}/${beats.length}`,
      onContinue: () => { i++; step(); },
      onExit: exitDemo,
    });
  }
  step();
}

function demoExecutePhaseActions(phase, roundData) {
  if (phase === 'PLAN' && roundData.playerActions) {
    // Auto-queue all the demo's planned actions
    roundData.playerActions.forEach(a => {
      const agentIdx = STATE.agents.findIndex(g => g.id === a.agent);
      if (agentIdx < 0) return;
      const agent = STATE.agents[agentIdx];
      const action = agent.actions.find(x => x.id === a.action);
      if (!action) return;
      queueAction(agentIdx, action, a.target);
    });
    // Brief pause then auto-execute
    setTimeout(() => {
      if (STATE.demoMode && STATE.phase === 'PLAN' && STATE.plannedActions.length > 0) {
        startResolvePhase();
      }
    }, 1400);
  }
}

// Spawn this round's scripted threats during conseq phase (instead of aiPlanThreats)
function demoSpawnNewThreats() {
  if (!STATE.demoMode || !STATE.demoScript) return;
  const next = STATE.demoScript.rounds.find(r => r.round === STATE.round + 1);
  if (!next || !next.threatSpawns) return;
  next.threatSpawns.forEach(s => spawnDemoThreat(s.target, s.techniqueId));
  STATE.threats.forEach(t => {
    if (t.spawnRound === STATE.round + 1) {
      const target = getNode(t.target);
      if (target && target.state === 'healthy') target.state = 'attacked';
      spawnAttackChain(t.path, 'attack');
    }
  });
}

// Show outro after final demo round wins/loses
function demoMaybeShowOutro() {
  if (!STATE.demoMode || !STATE.demoScript) return false;
  if (!STATE.demoScript.outro) return false;
  showNarratorCard({
    label: '▸ INSTRUCTOR — DEBRIEF',
    text: STATE.demoScript.outro,
    progress: 'DEMO COMPLETE',
    onContinue: () => {
      hideNarratorCard();
      // After outro, leave demo mode and let normal debrief render
      STATE.demoMode = false;
    },
    onExit: exitDemo,
  });
  return true;
}

function renderLoop() {
  render();
  requestAnimationFrame(renderLoop);
}

// v0.3: Threat actor intro card
// v0.7: ACH gate — Analysis of Competing Hypotheses before SEVER.
// Pattern: Richards J. Heuer Jr., CIA Center for the Study of Intelligence (1999).
// Forces hypothesis discipline before an irreversible action: list the primary
// hypothesis AND the strongest alternatives, then commit (or back out).
// The gate fires at most once per run (STATE.achGatePassed).
function showACHGate(onConfirm, onReject) {
  const observedTTPs = Object.keys(STATE.observedTTPs || {}).length;
  const iocCount = (STATE.iocs || []).length;
  const revealedThreats = (STATE.threats || []).filter(t => t.revealed).length;
  // Generate alternative hypotheses from the asset topology
  const altNodes = (STATE.nodes || [])
    .filter(n => n.id !== STATE.c2Node)
    .slice(0, 4);
  const altList = altNodes.length > 0
    ? altNodes.map(n => `<li style="margin-bottom:3px;">C2 is actually on <b>${n.id}</b>, and ${STATE.c2Node} is a <i>decoy/jump-host/misattribution</i></li>`).join('')
    : '<li>No alternative candidates on this topology.</li>';
  const evidenceStrength = (observedTTPs * 20) + (iocCount * 15) + (revealedThreats * 10);
  const strengthLabel = evidenceStrength >= 80 ? 'STRONG' : evidenceStrength >= 50 ? 'MODERATE' : 'THIN';
  const strengthColor = evidenceStrength >= 80 ? 'var(--green)' : evidenceStrength >= 50 ? 'var(--amber)' : 'var(--red)';
  const modal = document.createElement('div');
  modal.className = 'modal';
  modal.id = 'ach-modal';
  modal.innerHTML = `
    <div class="modal-content" style="max-width:420px;border-color:var(--amber);box-shadow:0 0 24px rgba(255,184,77,0.4);">
      <div style="color:var(--muted);font-size:9px;letter-spacing:0.15em;">// ACH GATE — IRREVERSIBLE ACTION</div>
      <div class="modal-title" style="color:var(--amber);">BEFORE YOU SEVER</div>
      <div style="color:var(--white);font-size:11px;line-height:1.5;margin-top:6px;">SEVER C2 is a 3-AP action with no undo. Burning the wrong infrastructure tips off the adversary and gives up collection without disruption.</div>

      <div style="margin-top:10px;padding:6px;background:rgba(78,226,255,0.05);border-left:3px solid var(--cyan);">
        <div style="color:var(--cyan);font-size:10px;font-weight:bold;letter-spacing:0.08em;">▸ PRIMARY HYPOTHESIS (H1)</div>
        <div style="color:var(--white);font-size:11px;margin-top:3px;">C2 is at <b>${STATE.c2Node}</b>.</div>
        <div style="color:var(--muted);font-size:10px;margin-top:3px;">Evidence basis: ${observedTTPs} observed TTPs · ${iocCount} IOCs · ${revealedThreats} revealed threats.</div>
        <div style="margin-top:4px;color:${strengthColor};font-size:10px;font-weight:bold;">Evidence strength: ${strengthLabel} (${evidenceStrength})</div>
      </div>

      <div style="margin-top:10px;padding:6px;background:rgba(255,184,77,0.05);border-left:3px solid var(--amber);">
        <div style="color:var(--amber);font-size:10px;font-weight:bold;letter-spacing:0.08em;">▸ COMPETING HYPOTHESES (H2…Hn)</div>
        <ul style="color:var(--white);font-size:10px;margin:4px 0 0 14px;padding:0;line-height:1.4;">
          ${altList}
        </ul>
        <div style="margin-top:6px;color:var(--muted);font-size:10px;line-height:1.4;">
          Also consider: adversary is <b>using ${STATE.c2Node} as a cutout and real C2 is upstream</b>; your attribution was <b>planted by the adversary</b> via T1692.002 reporting-message spoof; attack is a <b>burst-pattern diversion</b> ahead of a second-vector main attack.
        </div>
      </div>

      <div style="margin-top:10px;padding:6px;background:rgba(92,255,138,0.05);border-left:3px solid var(--green);">
        <div style="color:var(--green);font-size:10px;font-weight:bold;letter-spacing:0.08em;">▸ ACH DISCIPLINE</div>
        <div style="color:var(--white);font-size:10px;margin-top:3px;line-height:1.4;">The ACH method (Heuer, 1999) ranks hypotheses by <i>consistency with evidence</i>, not by familiarity. Prefer the hypothesis with the <i>fewest</i> disconfirming observations. If every hypothesis fits, your evidence is thin — collect more before committing.</div>
      </div>

      <div style="display:flex;gap:6px;margin-top:14px;">
        <button class="action-btn" id="ach-abort" style="flex:1;">◀ BACK OUT</button>
        <button class="action-btn primary" id="ach-confirm" style="flex:1;">▶ COMMIT H1 (Enter)</button>
      </div>
      <div style="margin-top:6px;color:var(--muted);font-size:9px;font-style:italic;">The ACH gate fires once per run. After this, SEVER proceeds without gating.</div>
    </div>
  `;
  document.getElementById('app').appendChild(modal);
  const confirmBtn = modal.querySelector('#ach-confirm');
  const abortBtn = modal.querySelector('#ach-abort');
  const close = () => { modal.remove(); document.removeEventListener('keydown', onKey, true); };
  confirmBtn.addEventListener('click', () => { close(); if (onConfirm) onConfirm(); });
  abortBtn.addEventListener('click', () => { close(); if (onReject) onReject(); });
  const onKey = (e) => {
    if (e.key === 'Enter') { e.preventDefault(); confirmBtn.click(); }
    else if (e.key === 'Escape') { e.preventDefault(); abortBtn.click(); }
  };
  document.addEventListener('keydown', onKey, true);
}

// v0.7: OODA reflection modal — Observe → Orient → Relevance → Sufficiency.
// Pattern lifted from DFIR Trainers (grumby42/dfir-trainers) TRAINER_SPEC.md.
// Fires at most once per trigger per run so experienced players aren't blocked.
// Keyboard: Enter/Space/→ dismisses.
function maybeShowOODAReflection(triggerId, content) {
  if (!STATE.reasoningShown) STATE.reasoningShown = {};
  if (STATE.reasoningShown[triggerId]) return;
  STATE.reasoningShown[triggerId] = true;
  const modal = document.createElement('div');
  modal.className = 'modal';
  modal.id = 'ooda-modal';
  modal.innerHTML = `
    <div class="modal-content" style="max-width:400px;border-color:var(--cyan);">
      <div style="color:var(--muted);font-size:9px;letter-spacing:0.15em;">// REASONING LAYER — ${content.when}</div>
      <div class="modal-title" style="margin-top:4px;">${content.title}</div>
      <div style="margin-top:8px;">
        <div style="color:var(--cyan);font-size:10px;font-weight:bold;letter-spacing:0.08em;">▸ OBSERVE</div>
        <div style="color:var(--white);font-size:11px;line-height:1.5;margin:3px 0 10px;">${content.observe}</div>
        <div style="color:var(--cyan);font-size:10px;font-weight:bold;letter-spacing:0.08em;">▸ ORIENT</div>
        <div style="color:var(--white);font-size:11px;line-height:1.5;margin:3px 0 10px;">${content.orient}</div>
        <div style="color:var(--cyan);font-size:10px;font-weight:bold;letter-spacing:0.08em;">▸ RELEVANCE</div>
        <div style="color:var(--white);font-size:11px;line-height:1.5;margin:3px 0 10px;">${content.relevance}</div>
        <div style="color:var(--cyan);font-size:10px;font-weight:bold;letter-spacing:0.08em;">▸ SUFFICIENCY</div>
        <div style="color:var(--white);font-size:11px;line-height:1.5;margin:3px 0 4px;">${content.sufficiency}</div>
      </div>
      <div style="margin-top:10px;color:var(--muted);font-size:9px;font-style:italic;">The Observe → Orient → Relevance → Sufficiency loop is the senior-analyst reasoning layer. It shows at most once per run per trigger.</div>
      <button class="action-btn primary" id="ooda-ack" style="width:100%;margin-top:12px;">▶ ACKNOWLEDGE (Enter)</button>
    </div>
  `;
  document.getElementById('app').appendChild(modal);
  const ack = modal.querySelector('#ooda-ack');
  const close = () => modal.remove();
  ack.addEventListener('click', close);
  const onKey = (e) => {
    if (e.key === 'Enter' || e.key === ' ' || e.key === 'ArrowRight' || e.key === 'Escape') {
      e.preventDefault();
      close();
      document.removeEventListener('keydown', onKey, true);
    }
  };
  document.addEventListener('keydown', onKey, true);
}

function showThreatActorIntro(onDone) {
  const A = STATE.activeActor;
  if (!A) { if (onDone) onDone(); return; }
  const modal = document.createElement('div');
  modal.className = 'modal';
  modal.id = 'actor-intro-modal';
  const sil = buildSilhouetteSVG(A.silhouette, A.color);
  modal.innerHTML = `
    <div class="modal-content" style="max-width:380px;border-color:${A.color};box-shadow:0 0 24px ${A.color}66;">
      <div style="color:var(--muted);font-size:9px;letter-spacing:0.15em;">// THREAT ATTRIBUTION — PARTIAL</div>
      <div style="display:flex;align-items:center;gap:14px;margin-top:8px;">
        <div style="width:80px;height:80px;flex:0 0 80px;">${sil}</div>
        <div style="flex:1;min-width:0;">
          <div style="color:${A.color};font-size:14px;font-weight:bold;letter-spacing:0.1em;">${A.name}</div>
          <div style="color:var(--white);font-size:10px;text-transform:uppercase;letter-spacing:0.08em;margin-top:2px;">${A.tagline}</div>
        </div>
      </div>
      <div style="margin-top:12px;padding-top:8px;border-top:1px solid var(--grid-line);">
        <div style="color:var(--cyan);font-size:9px;font-weight:bold;letter-spacing:0.05em;">▸ OBSERVED PATTERN</div>
        <div style="color:var(--white);font-size:10px;line-height:1.5;margin-top:4px;font-style:italic;">${A.pattern}</div>
      </div>
      <div style="margin-top:8px;">
        <div style="color:var(--cyan);font-size:9px;font-weight:bold;letter-spacing:0.05em;">▸ ARCHETYPAL BEHAVIOR</div>
        <div style="color:var(--white);font-size:10px;line-height:1.5;margin-top:4px;">${A.summary}</div>
      </div>
      ${A.adaptive ? '<div style="margin-top:8px;color:var(--magenta);font-size:9px;letter-spacing:0.05em;">⚠ ADAPTIVE — pivots when disrupted</div>' : ''}
      ${A.insiderMode ? '<div style="margin-top:8px;color:var(--magenta);font-size:9px;letter-spacing:0.05em;">⚠ INSIDER — no external C2; identify foothold to contain</div>' : ''}
      ${A.burstPattern ? '<div style="margin-top:8px;color:var(--amber);font-size:9px;letter-spacing:0.05em;">⚠ BURST PATTERN — alternating tempo</div>' : ''}
      ${A.dwellMode ? '<div style="margin-top:8px;color:var(--magenta);font-size:9px;letter-spacing:0.05em;">⚠ PRE-POSITIONING — wins by accumulating ' + A.dwellRoundsToWin + ' undetected dwell rounds, not by Impact. Hunt them.</div>' : ''}
      ${A.tempo === 'slow_dwell_fast_impact' ? '<div style="margin-top:8px;color:var(--amber);font-size:9px;letter-spacing:0.05em;">⚠ SLOW-DWELL + FAST-IMPACT — recon ' + (A.dwellRoundsBeforeImpact || 2) + ' rounds, then detonation. Catch window is EARLY.</div>' : ''}
      ${A.doubleExtortion ? '<div style="margin-top:4px;color:var(--amber);font-size:9px;letter-spacing:0.05em;">⚠ DOUBLE EXTORTION — exfils before encrypt. Data is already gone when the ransom note appears.</div>' : ''}
      ${A.handoffAfterRounds ? '<div style="margin-top:8px;color:var(--amber);font-size:9px;letter-spacing:0.05em;">⚠ INITIAL ACCESS BROKER — recon-only. Hands off to a successor actor after round ' + A.handoffAfterRounds + '. Re-attribution required.</div>' : ''}
      ${A.externalCredSource ? '<div style="margin-top:8px;color:var(--magenta);font-size:9px;letter-spacing:0.05em;">⚠ EXTERNAL-CRED SOURCE — looks like insider, isn\'t one. Rotate credentials, don\'t investigate the user.</div>' : ''}
      ${A.availabilityFocused ? '<div style="margin-top:8px;color:var(--amber);font-size:9px;letter-spacing:0.05em;">⚠ AVAILABILITY-FOCUSED — DDoS and defacement, not data theft. Loud, fast, symbolic.</div>' : ''}
      ${A.cellularBeaconMode ? '<div style="margin-top:8px;color:var(--magenta);font-size:9px;letter-spacing:0.05em;">⚠ OUT-OF-BAND C2 — vendor-equipment cellular modem bypasses your IT firewall entirely. Traffic is invisible to NetFlow. Carrier-level SIM visibility is the only enterprise detection path.</div>' : ''}
      ${A.lolBins ? '<div style="margin-top:8px;padding-top:6px;border-top:1px solid var(--grid-line);"><div style="color:var(--cyan);font-size:9px;font-weight:bold;letter-spacing:0.05em;">▸ LIVING-OFF-THE-LAND TOOLING</div><div style="color:var(--white);font-size:9px;line-height:1.5;margin-top:3px;font-family:monospace;">' + A.lolBins.join(' · ') + '</div></div>' : ''}
      ${A.lolChain ? '<div style="margin-top:6px;"><div style="color:var(--cyan);font-size:9px;font-weight:bold;letter-spacing:0.05em;">▸ STAGE CHAIN (per advisory)</div><div style="color:var(--white);font-size:9px;line-height:1.5;margin-top:3px;">' + A.lolChain.map(s => '<span style="color:var(--amber)">' + s.stage + '</span>: <span style="font-family:monospace;color:var(--cyan-dim);">' + s.tools.slice(0,3).join(', ') + (s.tools.length > 3 ? '…' : '') + '</span>').join('<br>') + '</div><div style="color:var(--muted);font-size:8px;margin-top:3px;font-style:italic;">Full command fingerprints in CODEX ▸ Volt Typhoon pattern.</div></div>' : ''}
      ${A.aerospaceChain ? '<div style="margin-top:6px;"><div style="color:var(--cyan);font-size:9px;font-weight:bold;letter-spacing:0.05em;">▸ AEROSPACE KILL CHAIN (SPARTA + public reporting)</div><div style="color:var(--white);font-size:9px;line-height:1.5;margin-top:3px;">' + A.aerospaceChain.map(s => '<span style="color:var(--amber)">' + s.stage + '</span> <span style="color:var(--cyan-dim);font-family:monospace;">[' + s.ttp + ']</span>').join('<br>') + '</div><div style="color:var(--muted);font-size:8px;margin-top:3px;font-style:italic;">Full tools + documented incidents in CODEX ▸ Aerospace APT pattern.</div></div>' : ''}
      ${A.sources && A.sources.length ? '<div style="margin-top:8px;color:var(--muted);font-size:8px;font-style:italic;">Model sources: ' + A.sources.join(' · ') + '</div>' : (A.source ? '<div style="margin-top:8px;color:var(--muted);font-size:8px;font-style:italic;">Model source: ' + A.source + '</div>' : '')}
      <button class="action-btn primary" id="actor-intro-ack" style="width:100%;margin-top:14px;">▶ ACKNOWLEDGE</button>
    </div>
  `;
  document.getElementById('app').appendChild(modal);
  modal.querySelector('#actor-intro-ack').addEventListener('click', () => {
    modal.remove();
    if (onDone) onDone();
  });
}

function buildSilhouetteSVG(shape, color) {
  const s = `viewBox="0 0 80 80" xmlns="http://www.w3.org/2000/svg" style="display:block;width:100%;height:100%;"`;
  if (shape === 'skull') {
    return `<svg ${s}>
      <path d="M 40 8 L 64 22 L 64 50 L 56 64 L 40 72 L 24 64 L 16 50 L 16 22 Z" fill="none" stroke="${color}" stroke-width="2"/>
      <circle cx="30" cy="36" r="5" fill="${color}"/>
      <circle cx="50" cy="36" r="5" fill="${color}"/>
      <path d="M 30 52 L 35 56 L 40 52 L 45 56 L 50 52" fill="none" stroke="${color}" stroke-width="2"/>
    </svg>`;
  }
  if (shape === 'eye') {
    return `<svg ${s}>
      <ellipse cx="40" cy="40" rx="34" ry="18" fill="none" stroke="${color}" stroke-width="2"/>
      <circle cx="40" cy="40" r="14" fill="none" stroke="${color}" stroke-width="2"/>
      <circle cx="40" cy="40" r="6" fill="${color}"/>
      <line x1="6" y1="6" x2="74" y2="74" stroke="${color}" stroke-width="1" opacity="0.4"/>
      <line x1="74" y1="6" x2="6" y2="74" stroke="${color}" stroke-width="1" opacity="0.4"/>
    </svg>`;
  }
  if (shape === 'flag') {
    return `<svg ${s}>
      <path d="M 16 70 L 16 12 L 64 12 L 56 30 L 64 48 L 16 48" fill="${color}" fill-opacity="0.2" stroke="${color}" stroke-width="2"/>
      <path d="M 28 22 L 28 38 M 36 22 L 36 38 M 44 22 L 44 38" stroke="${color}" stroke-width="2"/>
    </svg>`;
  }
  if (shape === 'mask') {
    return `<svg ${s}>
      <path d="M 20 24 Q 40 12 60 24 L 60 48 Q 40 60 20 48 Z" fill="${color}" fill-opacity="0.15" stroke="${color}" stroke-width="2"/>
      <rect x="24" y="32" width="14" height="6" fill="${color}"/>
      <rect x="42" y="32" width="14" height="6" fill="${color}"/>
      <line x1="20" y1="48" x2="60" y2="48" stroke="${color}" stroke-width="2"/>
      <path d="M 30 56 L 30 70 M 50 56 L 50 70" stroke="${color}" stroke-width="2" stroke-dasharray="3 3"/>
    </svg>`;
  }
  if (shape === 'key') {
    return `<svg ${s}>
      <circle cx="22" cy="40" r="14" fill="none" stroke="${color}" stroke-width="2"/>
      <circle cx="22" cy="40" r="5" fill="${color}"/>
      <line x1="36" y1="40" x2="68" y2="40" stroke="${color}" stroke-width="3"/>
      <line x1="56" y1="40" x2="56" y2="52" stroke="${color}" stroke-width="3"/>
      <line x1="64" y1="40" x2="64" y2="48" stroke="${color}" stroke-width="3"/>
    </svg>`;
  }
  if (shape === 'keyhole') {
    // v0.9: HOLLOWKEY — hollow keyhole, suggesting credentials stolen and reused
    return `<svg ${s}>
      <rect x="20" y="12" width="40" height="56" rx="4" fill="none" stroke="${color}" stroke-width="2"/>
      <circle cx="40" cy="34" r="7" fill="none" stroke="${color}" stroke-width="2"/>
      <rect x="37" y="38" width="6" height="18" fill="${color}"/>
      <line x1="26" y1="60" x2="54" y2="60" stroke="${color}" stroke-width="1" stroke-dasharray="2 2"/>
    </svg>`;
  }
  if (shape === 'wave') {
    // TIDEMARK — wave/tide motif suggesting supply-chain swell
    return `<svg ${s}>
      <path d="M 8 28 Q 20 16 32 28 T 56 28 T 76 28" fill="none" stroke="${color}" stroke-width="2"/>
      <path d="M 8 42 Q 20 30 32 42 T 56 42 T 76 42" fill="none" stroke="${color}" stroke-width="2.5"/>
      <path d="M 8 56 Q 20 44 32 56 T 56 56 T 76 56" fill="none" stroke="${color}" stroke-width="2"/>
      <circle cx="40" cy="42" r="3" fill="${color}"/>
      <line x1="40" y1="42" x2="40" y2="68" stroke="${color}" stroke-width="1" stroke-dasharray="2 2"/>
    </svg>`;
  }
  if (shape === 'lotus') {
    // VOLTFORGE — layered concentric petals suggesting hidden depth and
    // dormant presence. Lives beneath the surface, patient, almost invisible.
    return `<svg ${s}>
      <circle cx="40" cy="40" r="30" fill="none" stroke="${color}" stroke-width="1" stroke-dasharray="2 3" opacity="0.5"/>
      <circle cx="40" cy="40" r="20" fill="none" stroke="${color}" stroke-width="1.5" stroke-dasharray="3 2"/>
      <circle cx="40" cy="40" r="12" fill="none" stroke="${color}" stroke-width="2"/>
      <circle cx="40" cy="40" r="4" fill="${color}"/>
      <line x1="40" y1="10" x2="40" y2="18" stroke="${color}" stroke-width="1"/>
      <line x1="40" y1="62" x2="40" y2="70" stroke="${color}" stroke-width="1"/>
      <line x1="10" y1="40" x2="18" y2="40" stroke="${color}" stroke-width="1"/>
      <line x1="62" y1="40" x2="70" y2="40" stroke="${color}" stroke-width="1"/>
    </svg>`;
  }
  return `<svg ${s}>
    <path d="M 40 10 L 70 40 L 40 70 L 10 40 Z" fill="none" stroke="${color}" stroke-width="2"/>
  </svg>`;
}

resizeCanvas();

// v0.8: Load persisted preferences before boot so the mission-select cards see them
const _savedPrefs = loadPrefs();
if (_savedPrefs) {
  if (_savedPrefs.verbosity) STATE.verbosity = _savedPrefs.verbosity;
  if (_savedPrefs.difficulty) STATE.difficulty = _savedPrefs.difficulty;
  if (_savedPrefs.speed) STATE.speed = _savedPrefs.speed;
}

// v0.8: Save best-effort on tab close.
window.addEventListener('beforeunload', () => {
  try { saveRun(); } catch (e) {}
});
// pagehide fires in more cases on mobile (iOS Safari especially)
window.addEventListener('pagehide', () => {
  try { saveRun(); } catch (e) {}
});

setTimeout(bootTick, 300);
</script>
</body>
</html>
