function spawnParticles() {
  STATE.links.forEach(([a, b]) => {
    if (Math.random() < 0.012) {
      STATE.particles.push({
        from: a, to: b, t: 0, speed: 0.012 + Math.random() * 0.01,
        color: '#4ee2ff',
      });
    }
  });
}
function updateParticles() {
  spawnParticles();
  STATE.particles.forEach(p => p.t += p.speed);
  STATE.particles = STATE.particles.filter(p => p.t < 1);
}
function drawParticles() {
  STATE.particles.forEach(p => {
    const a = getNode(p.from);
    const b = getNode(p.to);
    if (!a || !b) return;
    const x = a.x + (b.x - a.x) * p.t;
    const y = a.y + (b.y - a.y) * p.t;
    ctx.fillStyle = hexA(p.color, 0.7);
    ctx.beginPath(); ctx.arc(x, y, 1.5, 0, Math.PI * 2); ctx.fill();
  });
}

function spawnAttackChain(path, kind) {
  STATE.attackChains.push({
    path: path.slice(),
    progress: 0,
    speed: 0.012,
    kind: kind || 'attack',
    sparks: [],
  });
  // v0.6: persistent attack trail — record every link this chain will cross so
  // the whole kill chain remains visible as a dim glow after the animation ends.
  // Only attack-kind chains record; counter chains (DISRUPT animations) don't.
  if ((kind || 'attack') === 'attack' && path && path.length >= 2) {
    if (!STATE.attackTrail) STATE.attackTrail = {};
    for (let i = 0; i < path.length - 1; i++) {
      const a = path[i], b = path[i + 1];
      // Canonicalize link direction so A→B and B→A share the same bucket
      const key = a < b ? a + '→' + b : b + '→' + a;
      STATE.attackTrail[key] = (STATE.attackTrail[key] || 0) + 1;
    }
  }
}
function updateAttackChains() {
  STATE.attackChains.forEach(c => {
    c.progress += c.speed;
    if (Math.random() < 0.5 && c.path.length > 1) {
      const segIdx = Math.min(Math.floor(c.progress * (c.path.length - 1)), c.path.length - 2);
      const localT = (c.progress * (c.path.length - 1)) - segIdx;
      const a = getNode(c.path[segIdx]);
      const b = getNode(c.path[segIdx + 1]);
      if (a && b && typeof a.x === 'number' && typeof b.x === 'number') {
        c.sparks.push({
          x: a.x + (b.x - a.x) * localT + (Math.random() - 0.5) * 6,
          y: a.y + (b.y - a.y) * localT + (Math.random() - 0.5) * 6,
          life: 1, vx: (Math.random()-0.5)*0.5, vy: (Math.random()-0.5)*0.5,
        });
      }
    }
    c.sparks.forEach(s => { s.life -= 0.05; s.x += s.vx; s.y += s.vy; });
    c.sparks = c.sparks.filter(s => s.life > 0);
  });
  STATE.attackChains = STATE.attackChains.filter(c => c.progress < 1 || c.sparks.length > 0);
}
// v0.6: Persistent kill-chain trail. Drawn under live attack chains and link
// baselines, so the operator can read the full attack path in a single frame
// — a technique borrowed in spirit from Rail Breach's trail model.
function drawAttackTrail() {
  if (!STATE.attackTrail) return;
  const keys = Object.keys(STATE.attackTrail);
  if (keys.length === 0) return;
  // Build a lookup from node id to node for all nodes in the mission
  const nodeById = {};
  STATE.nodes.forEach(n => { nodeById[n.id] = n; });
  ctx.lineCap = 'round';
  for (const key of keys) {
    const count = STATE.attackTrail[key];
    const [a, b] = key.split('→');
    const na = nodeById[a], nb = nodeById[b];
    if (!na || !nb || typeof na.x !== 'number' || typeof nb.x !== 'number') continue;
    // Intensity rises with repeat traversals, caps at 0.55 so it stays below the
    // live attack chain's brightness.
    const alpha = Math.min(0.15 + count * 0.12, 0.55);
    const width = Math.min(1.5 + count * 0.6, 4);
    ctx.strokeStyle = `rgba(255, 58, 58, ${alpha})`;
    ctx.lineWidth = width;
    ctx.shadowColor = 'rgba(255, 58, 58, 0.4)';
    ctx.shadowBlur = 6;
    ctx.beginPath();
    ctx.moveTo(na.x, na.y);
    ctx.lineTo(nb.x, nb.y);
    ctx.stroke();
  }
  ctx.shadowBlur = 0;
}

function drawAttackChains() {
  STATE.attackChains.forEach(c => {
    if (c.path.length < 2) return;
    const color = c.kind === 'attack' ? '#ff3a3a' : '#5cff8a';
    const totalSegs = c.path.length - 1;
    const filledSegs = Math.floor(c.progress * totalSegs);
    const localT = (c.progress * totalSegs) - filledSegs;
    ctx.lineWidth = 2.5;
    ctx.strokeStyle = color;
    ctx.shadowColor = color;
    ctx.shadowBlur = 10;
    for (let i = 0; i < filledSegs; i++) {
      const a = getNode(c.path[i]);
      const b = getNode(c.path[i+1]);
      if (!a || !b || typeof a.x !== 'number' || typeof b.x !== 'number') continue;
      ctx.beginPath();
      ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y);
      ctx.stroke();
    }
    if (filledSegs < totalSegs) {
      const a = getNode(c.path[filledSegs]);
      const b = getNode(c.path[filledSegs+1]);
      if (a && b && typeof a.x === 'number' && typeof b.x === 'number') {
        const x = a.x + (b.x - a.x) * localT;
        const y = a.y + (b.y - a.y) * localT;
        ctx.beginPath();
        ctx.moveTo(a.x, a.y); ctx.lineTo(x, y);
        ctx.stroke();
        ctx.fillStyle = color;
        ctx.beginPath(); ctx.arc(x, y, 4, 0, Math.PI * 2); ctx.fill();
      }
    }
    ctx.shadowBlur = 0;
    c.sparks.forEach(s => {
      ctx.fillStyle = hexA(color, s.life);
      ctx.beginPath(); ctx.arc(s.x, s.y, 1.5, 0, Math.PI * 2); ctx.fill();
    });
  });
}

function pickC2() {
  const actor = STATE.activeActor;
  // Insider mode: C2 is one of the assets itself.
  if (actor && actor.insiderMode) {
    if (STATE.mission.id === 'BLACKFROST') {
      const candidates = STATE.nodes.filter(n => n.type === 'substation' || n.type === 'generator');
      STATE.c2Node = candidates[Math.floor(Math.random() * candidates.length)].id;
    } else if (STATE.mission.id === 'NIGHTWATCH') {
      STATE.c2Node = Math.random() < 0.5 ? 'KEYSTONE' : 'MCC';
    } else if (STATE.mission.id === 'TIDEBREAK') {
      // Insider sits on TOS, PCS, or VTS — IT/coordination layer
      const candidates = STATE.nodes.filter(n => n.type === 'it' || n.type === 'control');
      STATE.c2Node = candidates[Math.floor(Math.random() * candidates.length)].id;
    } else if (STATE.mission.id === 'HEARTLINE') {
      // v0.9.3: Insider in healthcare sits on a clinical workstation / AD
      // (EHR snooping / HR fallout vector per HHS OCR insider breach reporting).
      const candidates = STATE.nodes.filter(n => n.type === 'clinical-it' || n.type === 'identity');
      STATE.c2Node = candidates[Math.floor(Math.random() * candidates.length)].id;
    } else if (STATE.mission.id === 'RAILGUARD') {
      // v0.9.4: Insider in rail — dispatch console or back-office. APTA
      // insider-threat guidance documents dispatch-console insiders as a
      // real but low-base-rate pattern; TSA 1580/82 Security Directives
      // require insider-threat programs.
      const candidates = STATE.nodes.filter(n => n.type === 'dispatch' || n.type === 'rail-back-office');
      STATE.c2Node = candidates[Math.floor(Math.random() * candidates.length)].id;
    }
    return;
  }
  // Standard external C2 (i.e., the foothold node from which adversary launches threats)
  if (STATE.mission.id === 'BLACKFROST') {
    const candidates = STATE.nodes.filter(n => n.type !== 'control');
    STATE.c2Node = candidates[Math.floor(Math.random() * candidates.length)].id;
  } else if (STATE.mission.id === 'NIGHTWATCH') {
    STATE.c2Node = Math.random() < 0.5 ? 'KEYSTONE' : 'MCC';
  } else if (STATE.mission.id === 'TIDEBREAK') {
    // External C2 likely on edge-facing IT nodes (Houston pattern: web server / PCS / TOS)
    // For TIDEMARK supply-chain: GANTRY or VTS (vendor remote access points)
    if (actor && actor.archetype === 'supply_chain') {
      const candidates = STATE.nodes.filter(n => n.type === 'crane' || n.type === 'comms');
      STATE.c2Node = candidates[Math.floor(Math.random() * candidates.length)].id;
    } else {
      // Other actors: prefer IT nodes (Houston-style)
      const candidates = STATE.nodes.filter(n => n.type === 'it' || n.type === 'comms');
      STATE.c2Node = candidates[Math.floor(Math.random() * candidates.length)].id;
    }
  } else if (STATE.mission.id === 'HEARTLINE') {
    // v0.9.3: Healthcare external C2 — the Change Healthcare 2024 pattern says
    // edge VPN gateway without MFA is the archetypal entry; CISA #StopRansomware
    // Hospital guides corroborate. Default foothold is EDGE. HOLLOWKEY (external
    // creds) can also land on AD. VOLTFORGE prefers clinical-it (long-dwell
    // credential theft against operator consoles).
    if (actor && actor.archetype === 'compromised_credentials') {
      STATE.c2Node = Math.random() < 0.6 ? 'EDGE' : 'AD';
    } else if (actor && actor.archetype === 'pre_positioning') {
      const candidates = STATE.nodes.filter(n => n.type === 'clinical-it' || n.type === 'identity' || n.type === 'edge');
      STATE.c2Node = candidates[Math.floor(Math.random() * candidates.length)].id;
    } else {
      // CRYO ransomware / WARDEN broker / default: edge VPN per sector pattern
      STATE.c2Node = 'EDGE';
    }
  } else if (STATE.mission.id === 'RAILGUARD') {
    // v0.9.4: Rail external C2 varies by actor shape.
    // - IRONHAZE (hacktivist / Belarus Cyber-Partisans + Polish RF pattern):
    //   either AD-side (encrypt dispatch) or VHF-LINK (RF command injection)
    // - HOLLOWKEY (external cred against operator console): AD
    // - VOLTFORGE (long-dwell pre-position): rail-back-office preferred
    // - WARDEN (broker): AD typical entry
    // - CRYO (ransomware against dispatch IT per Taiwan TRA pattern): AD
    if (actor && actor.archetype === 'hacktivist') {
      STATE.c2Node = Math.random() < 0.5 ? 'AD' : 'VHF-LINK';
    } else if (actor && actor.archetype === 'compromised_credentials') {
      STATE.c2Node = 'AD';
    } else if (actor && actor.archetype === 'pre_positioning') {
      const candidates = STATE.nodes.filter(n => n.type === 'rail-back-office' || n.type === 'identity');
      STATE.c2Node = candidates[Math.floor(Math.random() * candidates.length)].id;
    } else {
      // CRYO / WARDEN / default — AD entry (Taiwan TRA 2022-2024 archetype)
      STATE.c2Node = 'AD';
    }
  }
}

function aiPlanThreats() {
  // v0.5: in demo mode, threats spawn from script during conseq. Skip RNG-driven AI.
  if (STATE.demoMode) {
    demoSpawnNewThreats();
    return;
  }
  const actor = STATE.activeActor;
  if (!actor) return;
  const attacked = STATE.threats.length;
  let baseDesired;
  // v0.3: actor spawn-rate modifier
  if (actor.archetype === 'ransomware' || actor.archetype === 'hacktivist' || actor.archetype === 'cybercriminal') {
    baseDesired = STATE.round <= 2 ? 1 : 2;
  } else {
    baseDesired = STATE.round <= 3 ? 1 : 2;
  }
  // WARDEN burst pattern: spawn more on odd rounds, none on even
  if (actor.burstPattern) {
    baseDesired = (STATE.round % 2 === 1) ? Math.ceil(baseDesired * 1.5) : 0;
  }
  // v0.9: CRYO-style slow_dwell_fast_impact — few threats early, surge after dwell
  if (actor.tempo === 'slow_dwell_fast_impact') {
    const dwellRounds = actor.dwellRoundsBeforeImpact || 2;
    if (STATE.round <= dwellRounds) {
      baseDesired = 1;  // just the dwell footprint; mostly recon/lateral in quiet
    } else {
      // Detonation phase: aggressive multi-vector spawning. This is the
      // "70-minute explosive window" per Huntress/M-Trends 2026 patterns —
      // compressed to in-game tempo.
      baseDesired = Math.max(baseDesired, 2) + 1;
    }
  }
  // Difficulty multiplier
  const diffMod = STATE.difficulty === 'analyst' ? 1.3 : STATE.difficulty === 'novice' ? 0.7 : 1.0;
  const desired = Math.max(0, Math.round(baseDesired * actor.spawnRateMod * diffMod));
  const launches = Math.max(0, desired - attacked);
  for (let i = 0; i < launches; i++) maybeLaunchThreat();
}

function maybeLaunchThreat(opts) {
  opts = opts || {};
  const c2 = getNode(STATE.c2Node);
  if (!c2) return;
  const actor = STATE.activeActor;
  // Insider: spawns originate from the foothold node, not external C2 (same node id)
  const sourceId = STATE.c2Node;
  const candidates = STATE.nodes.filter(n =>
    n.id !== sourceId &&
    n.state !== 'compromised' &&
    !STATE.threats.some(t => t.target === n.id) &&
    (!opts.excludeTarget || n.id !== opts.excludeTarget)
  );
  if (candidates.length === 0) return;
  // Weight by node type (mission-specific high-value targeting)
  const weighted = [];
  candidates.forEach(n => {
    let w = 1;
    if (STATE.mission.id === 'BLACKFROST') {
      if (n.type === 'control') w = 3;
      else if (n.type === 'generator') w = 2;
    } else if (STATE.mission.id === 'NIGHTWATCH') {
      if (n.type === 'sat-leo') w = 3;
      else if (n.type === 'sat-geo') w = 2;
      else if (n.type === 'mcc') w = 2;
    } else if (STATE.mission.id === 'TIDEBREAK') {
      // Maersk lesson: TOS compromise paralyzes everything. ZPMC: cranes are vector.
      if (n.id === 'TOS') w = 3;
      else if (n.id === 'CTRL') w = 3;
      else if (n.type === 'crane') w = 2;
      else if (n.id === 'DALI') w = 2;
    } else if (STATE.mission.id === 'HEARTLINE') {
      // Healthcare targeting: EHR is clinical control plane (highest), AD is
      // identity backbone (ransomware pivots through it), biomed devices are
      // life-safety targets. PACS/LAB/PHARM are clinical IT (moderate).
      if (n.id === 'EHR') w = 3;
      else if (n.id === 'AD') w = 3;
      else if (n.type === 'biomed') w = 2;
      else if (n.type === 'clinical-it') w = 2;
    } else if (STATE.mission.id === 'RAILGUARD') {
      // Rail targeting: DISPATCH is coordination plane (Belarus Partisans
      // pattern); interlockings and grade-crossing are life-safety; PTC
      // and freight-TMS are back-office control; VHF-LINK is the RF vector.
      if (n.id === 'DISPATCH') w = 3;
      else if (n.type === 'interlock') w = 2;
      else if (n.id === 'GRADE-X') w = 2;
      else if (n.type === 'rail-back-office') w = 2;
    }
    for (let i = 0; i < w; i++) weighted.push(n);
  });
  // If a preferred target is specified (e.g., adaptive pivot), use it directly
  let target;
  if (opts.preferTarget && candidates.find(c => c.id === opts.preferTarget)) {
    target = candidates.find(c => c.id === opts.preferTarget);
  } else {
    target = weighted[Math.floor(Math.random() * weighted.length)];
  }
  let path = bfsPath(sourceId, target.id) || [sourceId, target.id];
  // v0.3: Pick technique from actor's initial-access bias if available, otherwise from threat mix
  let techPool = (actor && actor.biasInitialAccess && actor.biasInitialAccess.length > 0)
    ? actor.biasInitialAccess.filter(tid => STATE.mission.threatMix.includes(tid))
    : [];
  if (techPool.length === 0) {
    // Fallback: any IA/Recon technique from mission's mix
    techPool = STATE.mission.threatMix.filter(tid => {
      const t = TECHNIQUES[tid];
      return t && (t.tactic.includes('Initial Access') || t.tactic.includes('Reconnaissance'));
    });
  }
  if (techPool.length === 0) techPool = STATE.mission.threatMix;
  const techId = techPool[Math.floor(Math.random() * techPool.length)];
  STATE.threats.push({
    target: target.id,
    path,
    phase: 0,
    techniqueId: techId,
    revealed: false,
    history: [techId],
    spawnRound: STATE.round,
    pivotedFrom: opts.pivotedFrom || null,  // v0.3: track adaptive-pivot lineage
  });
  STATE.metrics.threatSpawns.push({ round: STATE.round, target: target.id, techniqueId: techId });
  if (target.state === 'healthy') target.state = 'attacked';
}

// v0.2.1: Metrics capture
function recordAction(agentId, actionId, targetId, outcome, wasteReason, techniqueIds) {
  STATE.metrics.actions.push({
    round: STATE.round,
    agentId, actionId, targetId,
    outcome,         // 'effective' | 'wasted' | 'partial'
    wasteReason,     // null or string like 'empty target', 'redundant', 'no c2'
    techniqueIds: techniqueIds || [],
  });
}

function recordTechniqueObserved(tid) {
  if (!tid) return;
  STATE.observedTTPs[tid] = (STATE.observedTTPs[tid] || 0) + 1;
  if (STATE.metrics.firstThreatRevealedRound === null) {
    STATE.metrics.firstThreatRevealedRound = STATE.round;
  }
}

function captureRoundMetrics() {
  const round = STATE.round;
  const actionsThisRound = STATE.metrics.actions.filter(a => a.round === round);
  const effective = actionsThisRound.filter(a => a.outcome === 'effective').length;
  const wasted = actionsThisRound.filter(a => a.outcome === 'wasted').length;
  const compromisedNow = STATE.nodes.filter(n => n.state === 'compromised').length;
  const prev = STATE.metrics.rounds[STATE.metrics.rounds.length - 1];
  const compromisedThisRound = compromisedNow - (prev ? prev.compromisedTotal : 0);
  STATE.metrics.rounds.push({
    round,
    threatsActive: STATE.threats.length,
    threatsRevealed: STATE.threats.filter(t => t.revealed).length,
    effectiveActions: effective,
    wastedActions: wasted,
    compromisedTotal: compromisedNow,
    compromisedThisRound,
    hardeningCharges: STATE.nodes.reduce((s, n) => s + (n.resilience || 0), 0),
  });
}

// Find repeat-failure patterns: same agent doing the same wasteful thing more than once
function detectRepeatFailures() {
  const wasted = STATE.metrics.actions.filter(a => a.outcome === 'wasted');
  const seen = new Map();   // key = `${agent}:${action}:${reason}` -> first round
  const repeats = [];
  wasted.forEach(a => {
    const key = `${a.agentId}:${a.actionId}:${a.wasteReason}`;
    if (seen.has(key)) {
      repeats.push({
        round: a.round, agentId: a.agentId, actionId: a.actionId,
        wasteReason: a.wasteReason, firstRound: seen.get(key),
      });
    } else {
      seen.set(key, a.round);
    }
  });
  return repeats;
}

// Compute final rubric scores for debrief
function computeRubric() {
  const m = STATE.metrics;
  const rounds = m.rounds.length || 1;
  const totalActions = m.actions.length || 1;
  const effective = m.actions.filter(a => a.outcome === 'effective').length;
  const wasted = m.actions.filter(a => a.outcome === 'wasted').length;
  const compromised = STATE.nodes.filter(n => n.state === 'compromised').length;
  const cascadeHits = m.rounds.reduce((s, r) => s + Math.max(0, r.compromisedThisRound - 1), 0);

  // 1. Detection speed: lower round number = better. Score 100 if revealed by round 2.
  let detectionScore = 0;
  if (m.firstThreatRevealedRound !== null) {
    const r = m.firstThreatRevealedRound;
    detectionScore = Math.max(0, Math.min(100, 100 - (r - 2) * 15));
  }

  // 2. C2 attribution: optimal by round 4. 100 if revealed early, 0 if never.
  let attributionScore = 0;
  if (m.c2RevealedRound !== null) {
    const r = m.c2RevealedRound;
    attributionScore = Math.max(0, Math.min(100, 100 - (r - 4) * 12));
  }

  // 3. Agent efficiency: % effective
  const efficiencyScore = Math.round((effective / totalActions) * 100);

  // 4. Hardening economy: charges absorbed / charges spent
  // We don't track absorbed yet — approximate via current resilience vs max ever
  const hardenActions = m.actions.filter(a => a.actionId === 'harden' && a.outcome === 'effective').length;
  const restoreActions = m.actions.filter(a => a.actionId === 'restore' && a.outcome === 'effective').length;
  // Heuristic: if you hardened and few cascade hits = good economy
  let hardeningScore = 50;
  if (hardenActions > 0) {
    const ratio = (hardenActions - cascadeHits) / hardenActions;
    hardeningScore = Math.round(Math.max(0, Math.min(100, 50 + ratio * 50)));
  } else if (cascadeHits === 0 && compromised <= 1) {
    hardeningScore = 70;  // didn't need to harden
  } else {
    hardeningScore = 25;  // didn't harden when you should have
  }

  // 5. Cascade containment
  const cascadeScore = compromised === 0
    ? 100
    : Math.max(0, Math.min(100, 100 - cascadeHits * 25 - compromised * 10));

  // 6. Doctrine
  let doctrineScore = 0;
  if (STATE.c2Severed) doctrineScore = 100;
  else if (STATE.phase === 'WIN') doctrineScore = 70;
  else doctrineScore = 0;

  return {
    detection: { score: detectionScore, label: scoreLabel(detectionScore),
      detail: m.firstThreatRevealedRound !== null
        ? `First threat revealed: round ${m.firstThreatRevealedRound}/${STATE.mission.maxRounds} (target: ≤2)`
        : 'No threats revealed during run.' },
    attribution: { score: attributionScore, label: scoreLabel(attributionScore),
      detail: m.c2RevealedRound !== null
        ? `C2 located: round ${m.c2RevealedRound} (optimal: ≤4)`
        : 'C2 never located.' },
    efficiency: { score: efficiencyScore, label: scoreLabel(efficiencyScore),
      detail: `${effective}/${totalActions} actions produced effect (${Math.round(effective/totalActions*100)}%). Wasted: ${wasted}.` },
    hardening: { score: hardeningScore, label: scoreLabel(hardeningScore),
      detail: `${hardenActions} HARDEN, ${restoreActions} RESTORE applied. Cascades: ${cascadeHits}.` },
    cascade: { score: cascadeScore, label: scoreLabel(cascadeScore),
      detail: `${compromised} compromised, ${cascadeHits} cascade hit${cascadeHits !== 1 ? 's' : ''}.` },
    doctrine: { score: doctrineScore, label: doctrineLabel(),
      detail: STATE.c2Severed ? 'C2 severed — adversary command neutralized.'
        : STATE.phase === 'WIN' ? 'Defense held through round limit.'
        : 'Defense breached.' },
  };
}

function scoreLabel(s) {
  if (s >= 85) return 'EXCELLENT';
  if (s >= 65) return 'GOOD';
  if (s >= 45) return 'ADEQUATE';
  if (s >= 25) return 'POOR';
  return 'CRITICAL';
}
function doctrineLabel() {
  if (STATE.c2Severed) return 'DECISIVE';
  if (STATE.phase === 'WIN') return 'DEFENSIVE HOLD';
  return 'BREACHED';
}

function generateCFINote(rubric) {
  const notes = [];
  const A = STATE.activeActor;
  const diff = STATE.difficulty;

  // Lead with adversary attribution
  if (A) {
    if (A.adaptive && (diff !== 'novice')) {
      const pivots = STATE.pivotEvents.length;
      if (pivots > 0) notes.push(`Faced ${A.name} — adaptive actor pivoted ${pivots} time${pivots>1?'s':''} during run.`);
      else notes.push(`Faced ${A.name} — adaptive actor; minimal disruption denied them pivot opportunities.`);
    } else if (A.insiderMode) {
      notes.push(`Faced ${A.name} — insider campaign required identification rather than C2 sever.`);
    } else if (A.burstPattern) {
      notes.push(`Faced ${A.name} — burst-pattern actor; alternating tempo demands rhythm matching.`);
    } else if (A.archetype === 'supply_chain') {
      notes.push(`Faced ${A.name} — supply-chain compromise via vendor remote-access. Patient and cascading.`);
    } else if (A.archetype === 'pre_positioning') {
      notes.push(`Faced ${A.name} — pre-positioning operator in the Volt Typhoon mold (per CISA AA24-038A). Their win condition was undetected dwell, not Impact; detection speed and attribution mattered more than disruption. LotL tradecraft evades signature detection, so VIGIL ▸ DEEP SCAN carried the mission.`);
    } else if (A.archetype === 'ransomware' && A.tempo === 'slow_dwell_fast_impact') {
      const dwellR = A.dwellRoundsBeforeImpact || 2;
      notes.push(`Faced ${A.name} — modern RaaS tempo per Mandiant M-Trends 2026: ~14-day median dwell before detonation (compressed to ${dwellR} game rounds). The quiet first rounds are the window to catch them — once backups fall and exfil begins, it's too late.`);
    } else if (A.archetype === 'initial_access_broker') {
      const handed = STATE.handoffFired ? 'did' : 'did not';
      notes.push(`Faced ${A.name} — initial access broker. ${handed === 'did' ? 'Attribution shifted mid-run as the IAB sold the foothold to a buyer per Rapid7 2025 pattern.' : 'IAB did not reach handoff; your containment denied the sale.'}`);
    } else if (A.archetype === 'compromised_credentials') {
      notes.push(`Faced ${A.name} — compromised credentials, not a real insider. Per Ponemon 2025, this is ~20% of what organizations label "insider threats." Response differs: rotate credentials, kill sessions, enforce device-bound tokens — do not treat the account owner as hostile.`);
    } else if (A.archetype === 'hacktivist' && A.availabilityFocused) {
      notes.push(`Faced ${A.name} — DDoS-primary hacktivist in the NoName057(16) / CyberAv3ngers mold. Availability was the target, not persistence. Mitigation lives at the edge (CDN scrubbing, rate limiting, BCP 38) more than at the endpoint.`);
    } else if (A.archetype === 'nation_state' && A.aerospaceChain) {
      notes.push(`Faced ${A.name} — aerospace APT in the composite ViaSat-KA-SAT (ground-segment) + Black-Sea-GPS-spoofing (RF) mold per CSIS Space Threat Assessment and USSF Space Delta 15 reporting. Phased kill chain is Recon(RF+OSINT) → Ground-IT access → MCC lateral → operator-identity theft → uplink staging → on-orbit payload. The catch window is before uplink staging; past that, in-orbit effects are hard to reverse. Treat ground-segment IT as mission-critical, not corporate.`);
    }
  }

  if (rubric.detection.score < 50) notes.push('Detection lag exposed assets early. Front-load VIGIL ▸ DEEP SCAN before committing offensive actions.');
  if (rubric.attribution.score < 50 && STATE.metrics.c2RevealedRound === null) {
    const label = A && A.insiderMode ? 'foothold identification' : 'C2 attribution';
    notes.push(`Without ${label}, you cannot ${A && A.insiderMode ? 'contain the insider' : 'SEVER'}. TRACE C2 yields better odds after multiple threats are revealed.`);
  }
  if (rubric.efficiency.score < 60) notes.push('Wasted actions reduced your effective tempo. SCAN before DISRUPT — confirm threat presence first.');
  if (rubric.hardening.score < 50) notes.push('Hardening economy was inefficient — applied either too late or to wrong targets.');
  // v0.4: combo recognition
  const comboCount = (STATE.combosTriggered || []).length;
  const totalRounds = STATE.round;
  if (comboCount === 0 && totalRounds >= 4) {
    notes.push('No combos triggered. Coordinated multi-agent actions on shared targets unlock force-multiplier effects.');
  } else if (comboCount > 0) {
    const ratePerRound = comboCount / Math.max(1, totalRounds);
    if (ratePerRound >= 0.5) notes.push(`${comboCount} combo${comboCount>1?'s':''} triggered — strong tactical coordination.`);
    else notes.push(`${comboCount} combo${comboCount>1?'s':''} triggered. Combos amplify effects; consider stacking actions on shared targets more often.`);
  }
  const repeats = detectRepeatFailures();
  if (repeats.length > 0) notes.push(`${repeats.length} repeat failure pattern${repeats.length > 1 ? 's' : ''} detected — see MOVES tab.`);
  if (rubric.cascade.score >= 85) notes.push('Excellent cascade containment.');
  // v0.9.1: TIDEBREAK sector-cascade doctrine note (Maersk NotPetya 2017)
  if (STATE.metrics && STATE.metrics.sectorCascade) {
    const sc = STATE.metrics.sectorCascade;
    if (sc.doctrineRef === 'Maersk NotPetya 2017') {
      notes.push(`Sector cascade fired on round ${sc.round} when ${sc.triggerNode} compromised — ${sc.doctrineRef} pattern. In the real-world Maersk incident ($300M loss, 76 terminals offline, 10-day recovery), the lesson was: TOS is not an IT system in an OT port, it is the control plane for everything that moves. Bulwark it day one; recover it with isolated rebuild capacity, not by replaying backups into the production domain.`);
    } else if (sc.doctrineRef === 'NHS WannaCry 2017') {
      notes.push(`Clinical cascade fired on round ${sc.round} when ${sc.triggerNode} compromised — ${sc.doctrineRef} pattern. In the real NHS WannaCry incident (~19,000 appointments cancelled, surgeries diverted, £92M in direct/indirect loss), the ransomware itself did not kill patients — the loss of the information backbone that coordinates care did, by forcing clinicians onto manual workflows at a tempo they could not sustain safely. Bulwark EHR day one; have a tested paper/manual-mode runbook; practice it before you need it.`);
    } else if (sc.doctrineRef === 'Belarusian Cyber-Partisans / BelZhD Jan 2022') {
      notes.push(`Operational cascade fired on round ${sc.round} when ${sc.triggerNode} compromised — ${sc.doctrineRef} pattern. In the real BelZhD incident, dispatch servers were encrypted during Russian troop movements into Belarus; movement authorities froze while trackside signaling and locomotives remained physically operational. The operational effect was days of service suspension even though no OT equipment was touched. For a U.S. operator, the equivalent lesson is TSA Security Directive 1580/82 compliance (incident response plan, operational-fallback procedures, access-control review): practice the dispatch-less day before you have one.`);
    } else {
      notes.push(`Sector cascade fired on round ${sc.round} when ${sc.triggerNode} compromised — ${sc.doctrineRef} pattern.`);
    }
  }
  if (STATE.mission && STATE.mission.id === 'TIDEBREAK' && STATE.phase === 'LOSE') {
    notes.push('Maritime loss analysis: Port of Houston 2021 (CVE-2021-40539, Volt Typhoon pattern via ManageEngine) and Maersk NotPetya 2017 both prove the same point — the perimeter CVE is the headline, but the OT consequence is the body. Patch the known-exploited edge appliance list (CISA KEV catalog) continuously; TOS is the crown jewel.');
  }
  // v0.9.3: HEARTLINE healthcare-specific debrief notes
  if (STATE.mission && STATE.mission.id === 'HEARTLINE') {
    const lse = (STATE.lifeSafetyEvents || []).length;
    if (lse > 0) {
      const nodes = STATE.lifeSafetyEvents.map(e => e.node).join(', ');
      notes.push(`${lse} life-safety event${lse > 1 ? 's' : ''} this run (${nodes}). Compromise of a patient-connected device is a CARE-DELIVERY event, not a data-integrity event — hospital policy requires Patient Safety notification, manual-mode fallback with bedside confirmation of every dose/parameter, and ultimately a device-fleet isolation. FDA Medical Device Cybersecurity Guidance (2023) and HHS 405(d) HICP both treat this as reportable. Dollar-loss metrics will understate what actually happened here.`);
    }
    if (STATE.phase === 'LOSE') {
      notes.push('Healthcare loss analysis: Change Healthcare Feb 2024 (ALPHV/BlackCat, $872M direct loss, pharmacy claims nationwide offline for weeks) is the modern pattern — the ransomware operator understood that healthcare has thin recovery capacity, limited downtime tolerance, and a willingness to pay. The defensive move isn\'t "better backups alone" — it is pre-tested manual-mode clinical workflows and (per HHS 405(d) HICP Practice #4) a tested crisis-management plan that assumes the information backbone will be unavailable for days to weeks.');
    }
  }
  // v0.9.4: RAILGUARD rail-specific debrief notes
  if (STATE.mission && STATE.mission.id === 'RAILGUARD') {
    const lse = (STATE.lifeSafetyEvents || []).length;
    if (lse > 0) {
      const nodes = STATE.lifeSafetyEvents.map(e => e.node).join(', ');
      notes.push(`${lse} life-safety event${lse > 1 ? 's' : ''} this run (${nodes}). Compromise of trackside signaling or a grade-crossing controller is a PASSENGER- or MOTORIST-safety event. Per FRA 49 CFR Part 236 Subpart H, operators must have fallback procedures for PTC/signaling degradation; per TSA Security Directive 1580/82-2022-01A, incident response and operational-fallback procedures are a compliance requirement, not optional. The Polish Aug 2023 ABW investigation documented 20+ unauthorized VHF stop signals causing emergency braking — no fatalities, but the safety margin was spent.`);
    }
    if (STATE.phase === 'LOSE') {
      notes.push('Rail loss analysis: three concurrent public patterns inform the defensive posture — Belarus Cyber-Partisans Jan 2022 (dispatch encrypted, days of service lost), Polish Aug 2023 radio-stop (cleartext VHF command injection, no authentication by legacy design), Taiwan TRA 2022-2024 (phishing → ransomware against back-office). The common thread is that rail signaling grew up with safety-engineering authentication (fail-safe design) but limited cybersecurity authentication (no cryptographic command signing on legacy VHF). TSA 1580/82-2022-01A compliance is table stakes; CENELEC 50159 (safety-critical rail communications) and FRA 49 CFR 236 Subpart H together frame the next-generation posture — cryptographic signing on command messages, dual-authority on parameter changes, and dispatch-less fallback procedures practiced routinely.');
    }
  }
  if (rubric.doctrine.score === 100) notes.push('Decisive operational result.');
  if (diff === 'analyst' && rubric.doctrine.score >= 70) notes.push('Result achieved on ANALYST difficulty — significant operational acumen demonstrated.');
  if (notes.length === 0) notes.push('Run within parameters. Consider higher difficulty.');
  return notes.join(' ');
}


function setPhase(p) {
  STATE.phase = p;
  document.getElementById('stat-phase').textContent = `▸ ${p} PHASE`;
  updateMainButton();
  updateStatusBar();
}

function updateStatusBar() {
  if (!STATE.mission) return;
  document.getElementById('stat-round').textContent =
    `${String(STATE.round).padStart(2,'0')}/${String(STATE.mission.maxRounds).padStart(2,'0')}`;
  const compromised = STATE.nodes.filter(n => n.state === 'compromised').length;
  const attacked = STATE.nodes.filter(n => n.state === 'attacked').length;
  let level = 'LOW', cls = 'threat-low';
  if (compromised >= 2 || attacked >= 3) { level = 'HIGH'; cls = 'threat-high'; }
  else if (compromised >= 1 || attacked >= 2) { level = 'MED'; cls = 'threat-med'; }
  STATE.threatLevel = level;
  const el = document.getElementById('stat-threat');
  el.textContent = level;
  el.className = 'status-val ' + cls;
  const stat = document.getElementById('grid-stat');
  if (STATE.mission.id === 'BLACKFROST') {
    const onlineCount = STATE.nodes.filter(n => n.state !== 'compromised').length;
    stat.textContent = `NODES: ${onlineCount}/8`;
  } else {
    const sats = STATE.nodes.filter(n => n.type === 'sat-leo' || n.type === 'sat-geo');
    const satOk = sats.filter(n => n.state !== 'compromised').length;
    stat.textContent = `SATS: ${satOk}/${sats.length}`;
  }
  document.getElementById('sector-label').textContent = `// ${STATE.mission.sector}`;
}

function updateMainButton() {
  const main = document.getElementById('btn-main');
  const back = document.getElementById('btn-back');
  back.disabled = false;
  main.classList.remove('attract');
  main.className = main.className.replace(/\bdanger\b/g, '');
  switch (STATE.phase) {
    case 'INTEL':
      main.textContent = STATE.round === 1 ? '▶ BEGIN PLAN' : 'BEGIN PLAN ▶';
      main.disabled = false;
      back.disabled = true;
      if (STATE.round === 1) main.classList.add('attract');
      break;
    case 'PLAN':
      // v0.4: AP-based status
      const apUsed = STATE.actionPointsUsed;
      const apMax = STATE.actionBudget;
      if (apUsed === 0) main.textContent = `EXECUTE (0/${apMax}AP) ▶`;
      else main.textContent = `EXECUTE (${apUsed}/${apMax}AP) ▶`;
      main.disabled = STATE.plannedActions.length === 0;
      break;
    case 'RESOLVE':
      main.textContent = '⏳ RESOLVING';
      main.disabled = true;
      back.disabled = true;
      break;
    case 'CONSEQ':
      main.textContent = '⏳ ADVERSARY';
      main.disabled = true;
      back.disabled = true;
      break;
    case 'WIN':
      main.textContent = '◢ MISSION COMPLETE';
      main.disabled = true;
      back.disabled = true;
      break;
    case 'LOSE':
      main.textContent = '◢ MISSION FAILED';
      main.classList.add('danger');
      main.disabled = true;
      back.disabled = true;
      break;
  }
}

function startIntelPhase() {
  setPhase('INTEL');
  document.getElementById('tap-hint').textContent = 'INTEL UPDATE — REVIEW LOG';
  logDivider();
  log(`<b>// ROUND ${STATE.round} — INTEL PHASE</b>`, 'log-cyan');
  const visibleThreats = STATE.threats.filter(t => t.revealed);
  if (visibleThreats.length === 0 && STATE.threats.length > 0) {
    log(verbose('No confirmed threats. Anomalous traffic detected.',
                'No confirmed threats. Beacon-like patterns observed in egress.',
                'IDS quiet. Zeek conn.log shows beacon-pattern jitter on egress; no Suricata signature match yet.'),
        'log-warn');
  }
  visibleThreats.forEach(t => {
    log(`Active threat → ${t.target} [phase ${t.phase}/3]`, 'log-warn');
    logTechnique(t.techniqueId);
  });
  if (STATE.c2Revealed && !STATE.c2Severed) {
    log(`◢ C2 LOCATED at ${STATE.c2Node}. Recommend SEVER.`, 'log-crit');
  }
  if (STATE.round === 1) {
    setTimeout(() => {
      const A = STATE.activeActor;
      let line;
      if (!A) line = 'Hostile activity detected. Stand by.';
      else if (A.archetype === 'ransomware') line = 'Initial access detected. Common phishing vector. Detonation imminent if unchecked.';
      else if (A.archetype === 'nation_state') line = 'Multi-vector campaign converging. Patient adversary; expect long-dwell tactics.';
      else if (A.archetype === 'hacktivist') line = 'Opportunistic intrusion against public-facing assets. Loud and fast.';
      else if (A.archetype === 'insider') line = 'Anomalies in authorized credentials. Hostile may already be inside the perimeter.';
      else if (A.archetype === 'cybercriminal') line = 'Initial-access broker pattern detected. Expect bursts and possible buyer handoff.';
      else if (A.archetype === 'supply_chain') line = 'Anomalies traced to vendor remote-access channels. Trusted maintenance pathways may be compromised.';
      else if (A.archetype === 'initial_access_broker') line = 'Reconnaissance-pattern activity detected. Signature matches an initial access broker — expect the foothold to be sold to a successor actor within the operational window.';
      else if (A.archetype === 'compromised_credentials') line = 'Credential-abuse signature from external geography. Account belongs to a legitimate user but behavior is not. Infostealer-sourced credentials likely.';
      else line = 'Hostile activity detected. Stand by.';
      logJoshua(line);
    }, 800);
  }
  if (STATE.activeActor && STATE.activeActor.archetype === 'nation_state' && STATE.round === 4 && !STATE.c2Revealed) {
    setTimeout(() => {
      logJoshua('Tradecraft consistent with long-dwell APT. C2 likely on ground segment.');
    }, 600);
  }
  if (STATE.activeActor && STATE.activeActor.insiderMode && STATE.round === 3 && !STATE.c2Revealed) {
    setTimeout(() => {
      logJoshua('Anomalies suggest authorized credentials behaving abnormally. Foothold may be one of our own assets.');
    }, 600);
  }
  // v0.5: Demo narrator hook — fire INTEL beats then advance to PLAN via callback
  if (STATE.demoMode) {
    setTimeout(() => {
      const roundData = STATE.demoScript.rounds.find(r => r.round === STATE.round);
      if (!roundData) {
        // Script ran out — exit demo mode, let player take over
        STATE.demoMode = false;
        const badge = document.getElementById('demo-badge');
        if (badge) badge.style.display = 'none';
        logJoshua('Demo script complete. You have the controls, Operator.');
        return;
      }
      const beats = (roundData.narration || []).filter(n => n.phase === 'INTEL');
      if (beats.length > 0) {
        queueDemoNarration(beats, () => startPlanPhase());
      } else {
        startPlanPhase();
      }
    }, 1200);
  }
}

function startPlanPhase() {
  setPhase('PLAN');
  STATE.plannedActions = [];
  STATE.resolvedActions = [];
  STATE.actionPointsUsed = 0;     // v0.4
  STATE.agents.forEach(a => a.exhausted = false);
  STATE.selectedAgent = null;
  STATE.selectedTarget = null;
  document.getElementById('tap-hint').textContent = 'SELECT AGENT, THEN TARGET NODE';
  logDivider();
  log('<b>// PLAN PHASE — Queue agent actions</b>', 'log-cyan');
  log(`<span class="log-cyan">▸ Action budget: ${STATE.actionBudget} AP this round</span>`);
  renderAgentStrip();
  updateBudgetDisplay();

  // v0.5: demo narrator hook — fire PLAN beats then auto-queue actions
  if (STATE.demoMode) {
    const roundData = STATE.demoScript.rounds.find(r => r.round === STATE.round);
    if (!roundData) return;
    const beats = (roundData.narration || []).filter(n => n.phase === 'PLAN');
    const autoQueue = () => {
      // Queue all actions from the demo script
      (roundData.playerActions || []).forEach(a => {
        const agentIdx = STATE.agents.findIndex(g => g.id === a.agent);
        if (agentIdx < 0) return;
        const agent = STATE.agents[agentIdx];
        const action = agent.actions.find(x => x.id === a.action);
        if (!action) return;
        queueAction(agentIdx, action, a.target);
      });
      // Auto-execute after a brief beat so player sees the queue
      setTimeout(() => {
        if (STATE.demoMode && STATE.phase === 'PLAN' && STATE.plannedActions.length > 0) {
          startResolvePhase();
        }
      }, 1500);
    };
    if (beats.length > 0) {
      setTimeout(() => queueDemoNarration(beats, autoQueue), 400);
    } else {
      setTimeout(autoQueue, 400);
    }
  }
}

function startResolvePhase() {
  setPhase('RESOLVE');
  document.getElementById('tap-hint').textContent = 'RESOLVING';
  logDivider();
  log('<b>// RESOLVE PHASE — Operator actions</b>', 'log-cyan');
  // v0.4: detect combos BEFORE actions execute. Bonuses apply atop resolution.
  STATE.killBoxActive = false;
  // v0.5: demo RESOLVE narration — fire pre-resolve beats first
  if (STATE.demoMode) {
    const roundData = STATE.demoScript.rounds.find(r => r.round === STATE.round);
    const beats = roundData ? (roundData.narration || []).filter(n => n.phase === 'RESOLVE') : [];
    if (beats.length > 0) {
      queueDemoNarration(beats, () => doResolveStart());
      return;
    }
  }
  doResolveStart();
}

function doResolveStart() {
  const combos = detectAndApplyCombos();
  if (combos.length > 0) {
    gate(900, () => resolveNextAction(0));
  } else {
    resolveNextAction(0);
  }
}

function resolveNextAction(i) {
  if (i >= STATE.plannedActions.length) {
    gate(500, startConseqPhase);
    return;
  }
  const a = STATE.plannedActions[i];
  const ag = STATE.agents[a.agent];
  executeAction(ag, a);
  gate(900, () => resolveNextAction(i + 1));
}

function executeAction(ag, a) {
  const target = a.target ? getNode(a.target) : null;
  const speak = (txt) => logAgent(ag.id, txt);
  const action = ag.actions.find(x => x.id === a.actionId);
  STATE.resolvedActions.push({
    agentId: ag.id, agentColor: ag.color,
    actionId: a.actionId, actionName: a.actionName,
    targetId: a.target,
    d3fend: action ? action.d3fend : null,
    tools: action ? action.tools : [],
    kind: 'counter',
  });

  if (a.actionId === 'scan') {
    speak(verbose('Deep scan running.',
                  'Deep scan: Suricata + Zeek correlation on target and adjacent.',
                  'IDS sweep deployed: Suricata sig hunt + Zeek conn.log diff across target ±1 hop.'));
    const reveal = [target, ...adjacent(target.id)];
    let foundCount = 0;
    const foundTechs = [];
    reveal.forEach(n => {
      STATE.threats.forEach(t => {
        if (t.target === n.id && !t.revealed) {
          t.revealed = true;
          foundCount++;
          foundTechs.push(t.techniqueId);
          recordTechniqueObserved(t.techniqueId);
          log(`&nbsp;&nbsp;└ Threat exposed at ${n.id}`, 'log-warn');
          logTechnique(t.techniqueId);
        }
      });
    });
    if (foundCount === 0) {
      speak('No active threats detected on scanned nodes.');
      recordAction(ag.id, a.actionId, a.target, 'wasted', 'no threats present', []);
    } else {
      recordAction(ag.id, a.actionId, a.target, 'effective', null, foundTechs);
    }
  }
  else if (a.actionId === 'trace') {
    speak(verbose('Tracing C2.',
                  'Initiating C2 traceback via beacon correlation.',
                  'C2 trace: pivot/jitter analysis on Zeek conn.log + STIX/TAXII enrichment + MISP cross-ref.'));
    if (STATE.c2Revealed) {
      speak('C2 location already known.');
      recordAction(ag.id, a.actionId, a.target, 'wasted', 'c2 already located', []);
    } else {
      const revealedCount = STATE.threats.filter(t => t.revealed).length;
      // v0.3: Difficulty + actor detection window affects trace odds
      let chance = 0.30 + revealedCount * 0.20;
      if (STATE.activeActor) {
        chance = chance / STATE.activeActor.detectionWindow;
      }
      if (STATE.difficulty === 'novice') chance += 0.15;
      if (STATE.difficulty === 'analyst') chance -= 0.10;
      chance = clamp(chance, 0.10, 0.95);
      if (Math.random() < chance) {
        STATE.c2Revealed = true;
        STATE.metrics.c2RevealedRound = STATE.round;
        const insiderLabel = STATE.activeActor && STATE.activeActor.insiderMode ? 'INSIDER FOOTHOLD' : 'C2';
        log(`&nbsp;&nbsp;└ <b>${insiderLabel} IDENTIFIED → ${STATE.c2Node}</b>`, 'log-crit');
        recordAction(ag.id, a.actionId, a.target, 'effective', null, []);
        STATE.iocs.push(`Beacon source attributed → ${STATE.c2Node}`);
        const followUp = STATE.activeActor && STATE.activeActor.insiderMode
          ? 'Insider foothold located. Recommend ANCHOR ▸ RESTORE the affected asset.'
          : 'Adversary command node located. Severing recommended.';
        setTimeout(() => logJoshua(followUp), 400);
        // v0.7: OODA reflection on first C2 reveal (any path)
        setTimeout(() => maybeShowOODAReflection('first_c2_reveal', {
          when: 'first C2 attribution',
          title: 'C2 LOCATED — ORIENTATION MOMENT',
          observe: `C2 traced to ${STATE.c2Node}. ${Object.keys(STATE.observedTTPs).length} unique TTPs observed en route. ${STATE.iocs.length} IOCs collected.`,
          orient: `Attribution is a reasoning step, not a mechanical reveal. In the real version you'd correlate beacon jitter against known-good egress profiles, pivot through DNS/HTTP metadata, and cross-reference IOCs against TI feeds (MISP / STIX-TAXII).`,
          relevance: `C2 attribution unlocks SEVER (3 AP). But SEVER is irreversible — if your hypothesis is wrong you burn infrastructure, don't disrupt the adversary, and tip them off.`,
          sufficiency: `Do you have enough? Low observed-TTP count = weak evidence. Multiple corroborating actions = strong. The ACH gate before SEVER will ask you to list competing hypotheses — be ready.`,
        }), 1200);
      } else {
        speak('Trace incomplete. Beacon obfuscated. More intel needed.');
        recordAction(ag.id, a.actionId, a.target, 'wasted', 'insufficient intel', []);
      }
    }
  }
  else if (a.actionId === 'disrupt') {
    speak(verbose(`Disrupting attack on ${target.id}.`,
                  `Disrupting kill chain on ${target.id} via Velociraptor.`,
                  `Velociraptor flow on ${target.id}: process eviction + memory dump for IOC extraction.`));
    const ts = STATE.threats.filter(t => t.target === target.id);
    if (ts.length === 0) {
      speak('No active threat on target. Action wasted.');
      recordAction(ag.id, a.actionId, a.target, 'wasted', 'empty target', []);
    } else {
      const techs = ts.map(t => t.techniqueId);
      ts.forEach(t => {
        spawnAttackChain(t.path.slice().reverse(), 'counter');
        log(`&nbsp;&nbsp;└ Kill chain broken at ${target.id}`, 'log-good');
      });
      // v0.3: ADAPTIVE PIVOT — adaptive actors re-emerge on adjacent node
      // v0.4: KILL_BOX combo blocks all pivots this round
      const actor = STATE.activeActor;
      const isAdaptive = actor && actor.adaptive;
      const willPivot = STATE.killBoxActive ? false : (
        (STATE.difficulty === 'novice') ? false :
        (STATE.difficulty === 'operator') ? isAdaptive :
        (STATE.difficulty === 'analyst') ? (isAdaptive || Math.random() < 0.5) : false
      );
      if (STATE.killBoxActive && isAdaptive) {
        log(`&nbsp;&nbsp;└ <span style="color:#ff4ea8;">KILL BOX prevented adversary pivot</span>`, 'log-good');
      }
      if (willPivot) {
        const adjacents = adjacent(target.id).filter(n =>
          n.state !== 'compromised' &&
          !STATE.threats.some(t2 => t2.target === n.id)
        );
        if (adjacents.length > 0) {
          const pivotTarget = adjacents[Math.floor(Math.random() * adjacents.length)];
          // Queue pivot to fire NEXT round so player has agency
          STATE.pivotEvents.push({
            round: STATE.round,
            from: target.id,
            to: pivotTarget.id,
            actor: actor.id,
          });
          log(`&nbsp;&nbsp;└ <b style="color:var(--magenta);">⚠ ADVERSARY ADAPTING — campaign pivoting to ${pivotTarget.id}</b>`, 'log-warn');
          // Spawn the pivoted threat now so it's in motion next conseq phase
          maybeLaunchThreat({ preferTarget: pivotTarget.id, pivotedFrom: target.id });
          // The pivoted threat is automatically revealed (we saw the pivot happen)
          const pivot = STATE.threats[STATE.threats.length - 1];
          if (pivot) pivot.revealed = true;
        }
      }
      STATE.threats = STATE.threats.filter(t => t.target !== target.id);
      if (target.state === 'attacked') target.state = 'stressed';
      // v0.6: DISRUPT also restores telemetry (operator view divergence cleared)
      if (target.operatorState) {
        delete target.operatorState;
        log(`&nbsp;&nbsp;└ <span style="color:var(--green);">Telemetry on ${target.id} verified against ground truth</span>`, 'log-good');
      }
      recordAction(ag.id, a.actionId, a.target, 'effective', null, techs);
    }
  }
  else if (a.actionId === 'sever') {
    const isInsider = STATE.activeActor && STATE.activeActor.insiderMode;
    speak(verbose(
      isInsider ? 'Containing insider.' : 'Cutting C2 link.',
      isInsider ? 'Containing insider — credential lockout, asset isolation.' : 'Severing C2 — burning persistence, isolating egress.',
      isInsider ? 'Cred revocation + session termination + UEBA-flagged asset quarantine.' : 'BGP blackhole + firewall block + cred rotation. Burning all observed adversary infra.'
    ));
    if (!STATE.c2Revealed) {
      speak(isInsider ? 'ERROR — Foothold not identified.' : 'ERROR — C2 location unknown.');
      recordAction(ag.id, a.actionId, a.target, 'wasted', 'c2 not revealed', []);
      return;
    }
    STATE.c2Severed = true;
    STATE.metrics.c2SeveredRound = STATE.round;
    const c2 = getNode(STATE.c2Node);
    STATE.nodes.forEach(n => {
      if (n.id !== c2.id) {
        const p = bfsPath(n.id, c2.id);
        if (p) spawnAttackChain(p, 'counter');
      }
    });
    log(`&nbsp;&nbsp;└ <b>${isInsider ? 'INSIDER CONTAINED. Foothold isolated.' : 'C2 SEVERED. Adversary command lost.'}</b>`, 'log-good');
    STATE.threats = [];
    STATE.nodes.forEach(n => { if (n.state === 'attacked') n.state = 'stressed'; });
    // Insider: also restore the foothold node since they were sitting on it
    if (isInsider && c2 && c2.state !== 'healthy') {
      c2.state = 'stressed';
    }
    recordAction(ag.id, a.actionId, a.target, 'effective', null, []);
    setTimeout(() => {
      logJoshua('A strange game. The only winning move is to play it well. WELL PLAYED.');
      checkWinCondition();
    }, 1200);
  }
  else if (a.actionId === 'harden') {
    speak(verbose(`Hardening ${target.id}.`,
                  `Applying patches and segmentation to ${target.id}.`,
                  `Ansible hardening + SCAP baseline + microsegmentation push to ${target.id}.`));
    if (target.resilience >= 3) {
      speak(`${target.id} already at maximum resilience.`);
      recordAction(ag.id, a.actionId, a.target, 'wasted', 'already maxed', []);
    } else {
      target.resilience = Math.min(target.resilience + 1, 3);
      log(`&nbsp;&nbsp;└ ${target.id} resilience +1 (now ${target.resilience})`, 'log-good');
      recordAction(ag.id, a.actionId, a.target, 'effective', null, []);
    }
  }
  else if (a.actionId === 'restore') {
    speak(verbose(`Restoring ${target.id}.`,
                  `Restoring ${target.id} from clean backups.`,
                  `Velociraptor IR collection complete. Restoring ${target.id} from immutable backup; rotating creds.`));
    if (target.state === 'compromised') {
      target.state = 'stressed';
      if (target.operatorState) delete target.operatorState;  // v0.6
      log(`&nbsp;&nbsp;└ ${target.id} restored to STRESSED`, 'log-good');
      recordAction(ag.id, a.actionId, a.target, 'effective', null, []);
    } else if (target.state === 'attacked') {
      target.state = 'stressed';
      if (target.operatorState) delete target.operatorState;  // v0.6
      log(`&nbsp;&nbsp;└ ${target.id} attack contained`, 'log-good');
      recordAction(ag.id, a.actionId, a.target, 'effective', null, []);
    } else {
      speak(`${target.id} did not require restoration.`);
      recordAction(ag.id, a.actionId, a.target, 'wasted', 'target healthy', []);
    }
  }
}

function startConseqPhase() {
  if (STATE.c2Severed) return;
  setPhase('CONSEQ');
  document.getElementById('tap-hint').textContent = 'ADVERSARY ACTING';
  logDivider();
  log('<b>// CONSEQUENCES — Adversary advances</b>', 'log-crit');
  // Snapshot threats before advancement so AI launch doesn't mix in
  const threatsToAdvance = STATE.threats.slice();
  advanceThreatGated(threatsToAdvance, 0);
}

function advanceThreatGated(threatList, i) {
  if (i >= threatList.length) {
    // After all threats advanced, AI plans new launches
    aiPlanThreats();
    STATE.threats.forEach(t => {
      const target = getNode(t.target);
      if (target && target.state === 'healthy') target.state = 'attacked';
    });
    STATE.threats.forEach(t => {
      if (t.phase === 0) spawnAttackChain(t.path, 'attack');
    });
    gate(900, () => {
      // Capture metrics for this round before potentially advancing
      captureRoundMetrics();
      if (STATE.resolvedActions.length > 0) {
        showKillChainReplay(() => advanceRound());
      } else {
        advanceRound();
      }
    });
    return;
  }
  advanceThreat(threatList[i]);
  gate(700, () => advanceThreatGated(threatList, i + 1));
}

function advanceThreat(t) {
  const target = getNode(t.target);
  if (!target) return;
  if (target.state === 'compromised') return;
  STATE.resolvedActions.push({
    agentId: 'ADVERSARY',
    actionName: 'KILL CHAIN ADVANCE',
    targetId: t.target,
    techniqueId: t.techniqueId,
    kind: 'attack',
  });
  if (target.resilience > 0 && Math.random() < 0.7) {
    target.resilience--;
    log(`Hardening on ${target.id} blunted attack. Resilience -1.`, 'log-good');
    return;
  }
  t.phase++;
  const nextTech = pickNextPhaseTech(t);
  if (nextTech) {
    t.techniqueId = nextTech;
    t.history.push(nextTech);
  }
  log(`Threat advances on ${target.id} [phase ${t.phase}/3]`, 'log-warn');
  logTechnique(t.techniqueId);
  recordTechniqueObserved(t.techniqueId);
  spawnAttackChain(t.path, 'attack');
  // v0.6: Telemetry-trust mechanic. Certain techniques create a divergence
  // between ground truth and what the operators see.
  // T1692.002 / T0856 = Unauthorized reporting message → operator sees healthy
  // T0832 = Manipulation of View → operator sees healthy (false telemetry)
  // T0829 = Loss of View → operator state freezes at last-known
  const spoofers = new Set(['T1692.002','T0856','T0832']);
  const freezers = new Set(['T0829']);
  if (spoofers.has(t.techniqueId)) {
    target.operatorState = 'healthy';
    log(`&nbsp;&nbsp;└ <span style="color:var(--amber);">⚠ Operator telemetry spoofed on ${target.id} — control room sees HEALTHY</span>`, 'log-warn');
  } else if (freezers.has(t.techniqueId)) {
    target.operatorState = target.operatorState || target.state;  // freeze on current
    log(`&nbsp;&nbsp;└ <span style="color:var(--amber);">⚠ Loss of view on ${target.id} — operator state frozen</span>`, 'log-warn');
  }
  if (t.phase >= 3) {
    target.state = 'compromised';
    log(`&nbsp;&nbsp;└ <b>${target.id} COMPROMISED</b>`, 'log-crit');
    STATE.threats = STATE.threats.filter(x => x !== t);
    // v0.9.4: timeline-tab capture — per-round list of compromises
    STATE.metrics = STATE.metrics || {};
    STATE.metrics.compromisesByRound = STATE.metrics.compromisesByRound || [];
    STATE.metrics.compromisesByRound.push({ round: STATE.round, target: target.id, techniqueId: t.techniqueId });
    // v0.9: Actor-specific impact flavor
    const A = STATE.activeActor;
    if (A && A.doubleExtortion) {
      log(`&nbsp;&nbsp;└ <span style="color:var(--red);">⚠ Data exfil detected on ${target.id} (per double-extortion pattern — exfil preceded encryption)</span>`, 'log-crit');
      // Record exfil as an IOC proxy
      STATE.iocs = STATE.iocs || [];
      STATE.iocs.push(`Exfil staging detected → ${target.id} (double-extortion precursor)`);
    }
    const cascadeChance = (A && typeof A.cascadeChance === 'number') ? A.cascadeChance : 0.3;
    adjacent(target.id).forEach(adj => {
      if (adj.state === 'healthy' && Math.random() < cascadeChance) {
        adj.state = 'stressed';
        log(`&nbsp;&nbsp;└ Cascade stress on ${adj.id}`, 'log-warn');
      }
    });
    // v0.9.3: Life-safety event — fires when a mission-designated
    // patient-connected node compromises. One-shot per node id, so a second
    // biomed compromise doesn't re-trigger. Narrator beat + metrics capture.
    const LS = STATE.mission && STATE.mission.lifeSafetyNodes;
    if (LS && LS.includes(target.id)) {
      STATE.lifeSafetyEvents = STATE.lifeSafetyEvents || [];
      if (!STATE.lifeSafetyEvents.find(e => e.node === target.id)) {
        STATE.lifeSafetyEvents.push({ round: STATE.round, node: target.id });
        log(`&nbsp;&nbsp;└ <b style="color:var(--red);">⚠⚠ LIFE-SAFETY EVENT</b>`, 'log-crit');
        log(`&nbsp;&nbsp;&nbsp;&nbsp;${STATE.mission.lifeSafetyNarration || 'Patient-connected device compromised.'}`, 'log-crit');
      }
    }
    // v0.9.1: Mission-level sector cascade (e.g., TIDEBREAK Maersk pattern)
    // When the mission designates a trigger node AND it's just compromised,
    // apply the mission's sector cascade. One-shot — fires once per run.
    const SC = STATE.mission && STATE.mission.sectorCascade;
    if (SC && SC.triggerNode === target.id && !STATE.sectorCascadeFired) {
      STATE.sectorCascadeFired = true;
      log(`&nbsp;&nbsp;└ <b style="color:var(--red);">⚠⚠ SECTOR CASCADE</b>`, 'log-crit');
      log(`&nbsp;&nbsp;&nbsp;&nbsp;${SC.narration}`, 'log-crit');
      (SC.effectNodes || []).forEach(nid => {
        const n = getNode(nid);
        if (n && n.state === 'healthy') {
          n.state = SC.effectState || 'stressed';
          log(`&nbsp;&nbsp;&nbsp;&nbsp;└ ${nid} → ${n.state} (operationally paralyzed; ${SC.doctrineRef || 'sector pattern'})`, 'log-warn');
        }
      });
      // Capture the moment in metrics for debrief doctrine scoring
      STATE.metrics = STATE.metrics || {};
      STATE.metrics.sectorCascade = {
        round: STATE.round,
        triggerNode: target.id,
        doctrineRef: SC.doctrineRef,
      };
    }
    // v0.7: OODA reflection on first compromise — relevance/sufficiency teaching moment
    setTimeout(() => maybeShowOODAReflection('first_compromise', {
      when: 'first node compromised',
      title: 'FIRST COMPROMISE — WAS YOUR READ SUFFICIENT?',
      observe: `${target.id} reached phase 3. Final technique: ${t.techniqueId}. Full chain history: ${t.history.join(' → ')}.`,
      orient: `A compromise means the player had the decision window and did not close it — either SCAN didn't fire on this target, DISRUPT missed, or HARDEN was spent elsewhere. The question isn't blame, it's pattern.`,
      relevance: `Replay the last 2 rounds mentally: did you have observable signal that this target was escalating? If yes, the gap was prioritization. If no, the gap was detection coverage.`,
      sufficiency: `Senior-level question: what's the *earliest* round you could have known this chain would land here? That's where to invest VIGIL ▸ SCAN next run — the detection-latency improvement is worth more than the DISRUPT you spent too late.`,
    }), 900);
  }
}

function pickNextPhaseTech(t) {
  const phaseTactics = {
    1: ['Execution','Persistence','ML Attack Staging'],
    2: ['Lateral Movement','Persistence','Impair Process Control','Execution'],
    3: ['Impact','Loss','Manipulation','Disruption'],
  };
  const allowed = phaseTactics[t.phase] || ['Impact'];
  const A = STATE.activeActor;
  // v0.3: prefer actor's biased techniques first
  let pool = [];
  if (A) {
    if (t.phase === 3 && A.biasImpact) pool = A.biasImpact;
    else if (t.phase === 2 && A.biasExecution) pool = A.biasExecution;
    else if (A.techniqueAffinity) pool = A.techniqueAffinity;
  }
  // Filter to phase-appropriate techniques in mission mix that haven't been used yet
  const filterPool = pool.filter(tid => {
    const T = TECHNIQUES[tid];
    return T && allowed.some(a => T.tactic.includes(a)) &&
           !t.history.includes(tid) &&
           STATE.mission.threatMix.includes(tid);
  });
  if (filterPool.length > 0) return filterPool[Math.floor(Math.random() * filterPool.length)];
  // Fallback: any phase-appropriate tech in mission mix
  const matches = STATE.mission.threatMix.filter(tid => {
    const T = TECHNIQUES[tid];
    return T && allowed.some(a => T.tactic.includes(a)) && !t.history.includes(tid);
  });
  if (matches.length > 0) return matches[Math.floor(Math.random() * matches.length)];
  const impactMatches = STATE.mission.impactTechs.filter(tid => !t.history.includes(tid));
  return impactMatches[0] || t.techniqueId;
}

function advanceRound() {
  const compromised = STATE.nodes.filter(n => n.state === 'compromised').length;
  if (compromised >= STATE.mission.loseThreshold) {
    triggerLose(`${compromised} assets compromised. Threshold breached.`);
    return;
  }
  // v0.6: VOLTFORGE pre-positioning dwell check.
  // If the actor is a dwell-mode operator and at least one threat remains
  // active and UNREVEALED this round, they accumulate dwell credit. Reach
  // dwellRoundsToWin and they achieve persistent pre-positioning victory
  // — their actual goal per CISA AA24-038A.
  const A = STATE.activeActor;
  if (A && A.dwellMode) {
    const unrevealed = STATE.threats.filter(t => !t.revealed).length;
    if (unrevealed > 0) {
      STATE.dwellRoundsAccumulated++;
      log(`<span style="color:${A.color};">▸ Pre-positioning dwell: ${STATE.dwellRoundsAccumulated}/${A.dwellRoundsToWin}</span>`, 'log-warn');
      if (STATE.dwellRoundsAccumulated >= A.dwellRoundsToWin) {
        triggerLose(`${A.name} achieved persistent pre-positioning (${STATE.dwellRoundsAccumulated} undetected dwell rounds). Adversary has strategic access for future disruption.`);
        return;
      }
    } else {
      // All threats revealed this round — dwell counter decays, doesn't reset
      // (hunting them down takes real work; small win still accumulates).
      STATE.dwellRoundsAccumulated = Math.max(0, STATE.dwellRoundsAccumulated - 1);
    }
  }
  if (STATE.round >= STATE.mission.maxRounds) {
    if (compromised < STATE.mission.loseThreshold) {
      triggerWin(`Survived ${STATE.mission.maxRounds} rounds. Defense held.`);
      return;
    }
  }
  STATE.round++;
  STATE.killBoxActive = false;  // v0.4: combo effect expires at round end
  // v0.9: WARDEN handoff — after N rounds the IAB "sells access" and a successor
  // takes over execution. Attribution shift mid-mission is the real IAB signature.
  if (A && A.handoffAfterRounds && A.successorPool && STATE.round === A.handoffAfterRounds + 1 && !STATE.handoffFired) {
    STATE.handoffFired = true;
    STATE.metrics.handoffRound = STATE.round;  // v0.9.4: timeline capture
    const successorId = A.successorPool[Math.floor(Math.random() * A.successorPool.length)];
    const successor = THREAT_ACTORS[successorId];
    if (successor) {
      const prevName = A.name;
      STATE.metrics.handoffFrom = A.id;
      STATE.metrics.handoffTo = successor.id;
      STATE.activeActor = successor;
      STATE.actorRevealed = false;  // player re-earns attribution for the new actor
      STATE.actorAttribution = Math.max(0, STATE.actorAttribution - 30);  // partial carry-over
      log(`<b style="color:${successor.color};">▸▸ ATTRIBUTION SHIFT — ${prevName} appears to have handed off access</b>`, 'log-crit');
      log(`<span style="color:var(--muted);">New activity signature matches ${successor.name} (${successor.tagline}). Re-attribute.</span>`);
      setTimeout(() => logJoshua(`Attribution shift, Operator. ${prevName} sold the foothold. ${successor.name} is now in the driver's seat. Their TTPs differ — adjust your hypothesis.`), 900);
    }
  }
  updateStatusBar();
  // v0.8: snapshot the run at each round boundary so a tab close doesn't lose progress
  if (!STATE.demoMode) saveRun();
  startIntelPhase();
}

function checkWinCondition() {
  if (STATE.c2Severed) {
    triggerWin('C2 severed. Adversary command structure neutralized.');
  }
}

function triggerWin(reason) {
  setPhase('WIN');
  // Capture final round metrics (in case advanceRound never gets called)
  if (STATE.metrics.rounds.length === 0 || STATE.metrics.rounds[STATE.metrics.rounds.length-1].round !== STATE.round) {
    captureRoundMetrics();
  }
  clearSavedRun();  // v0.8: completed run — nothing to resume
  // v0.5: demo outro before replay/debrief
  const finishWin = () => {
    if (STATE.resolvedActions.length > 0) {
      showKillChainReplay(() => showDebrief(true, reason));
    } else {
      showDebrief(true, reason);
    }
  };
  if (STATE.demoMode && STATE.demoScript && STATE.demoScript.outro) {
    showNarratorCard({
      label: '▸ INSTRUCTOR — DEBRIEF',
      text: STATE.demoScript.outro,
      progress: 'DEMO COMPLETE',
      onContinue: () => {
        hideNarratorCard();
        STATE.demoMode = false;  // exit demo mode so debrief renders normally
        finishWin();
      },
      onExit: exitDemo,
    });
  } else {
    finishWin();
  }
}
function triggerLose(reason) {
  setPhase('LOSE');
  if (STATE.metrics.rounds.length === 0 || STATE.metrics.rounds[STATE.metrics.rounds.length-1].round !== STATE.round) {
    captureRoundMetrics();
  }
  clearSavedRun();  // v0.8: completed run — nothing to resume
  if (STATE.resolvedActions.length > 0) {
    showKillChainReplay(() => showDebrief(false, reason));
  } else {
    showDebrief(false, reason);
  }
}

// v0.2.1: Full-screen Pylons-style debrief with RUBRIC / TRENDS / MOVES tabs
function showDebrief(win, reason) {
  const overlay = document.createElement('div');
  overlay.id = 'debrief-overlay';
  overlay.className = 'debrief-overlay';
  const color = win ? 'var(--green)' : 'var(--red)';
  const title = win ? 'MISSION COMPLETE' : 'MISSION FAILED';
  let rubric, cfiNote;
  let prepError = null;
  try {
    rubric = computeRubric();
    cfiNote = generateCFINote(rubric);
  } catch (err) {
    prepError = err;
    rubric = null;
    cfiNote = null;
    try { console.error('Debrief prep error', err); } catch(_){}
  }

  overlay.innerHTML = `
    <div class="debrief-header" style="border-bottom:2px solid ${color};">
      <div style="color:${color};font-size:14px;font-weight:bold;letter-spacing:0.15em;">${title}</div>
      <div style="color:var(--muted);font-size:10px;margin-top:2px;">${STATE.mission.name} · Round ${STATE.round}/${STATE.mission.maxRounds} · ${reason}</div>
      ${JOSHUA_SEED ? `<div style="color:var(--cyan-dim);font-size:9px;margin-top:2px;font-family:monospace;">seed: ${JOSHUA_SEED.raw} · deterministic replay</div>` : ''}
    </div>
    <div class="debrief-tabs">
      <button class="debrief-tab active" data-dtab="rubric">RUBRIC</button>
      <button class="debrief-tab" data-dtab="timeline">TIMELINE</button>
      <button class="debrief-tab" data-dtab="trends">TRENDS</button>
      <button class="debrief-tab" data-dtab="moves">MOVES</button>
    </div>
    <div class="debrief-body" id="debrief-body"></div>
    <div class="debrief-footer">
      <button class="action-btn" id="db-mission-select" style="flex:1;">◀ MISSION SELECT</button>
      <button class="action-btn" id="db-share" style="flex:0 0 auto;" title="Copy a shareable replay URL (?seed=…) to clipboard — same seed reproduces this run.">SHARE</button>
      <button class="action-btn" id="db-export" style="flex:0 0 auto;" title="Export case log as JSON — dfir-trainers compatible">EXPORT</button>
      <button class="action-btn primary" id="db-retry" style="flex:1;">▶ RETRY</button>
    </div>
  `;
  document.getElementById('app').appendChild(overlay);

  let dtab = 'rubric';
  function renderDtab() {
    const body = document.getElementById('debrief-body');
    if (!body) return;
    if (prepError) {
      body.innerHTML = `<div style="color:var(--red);font-size:11px;padding:14px;line-height:1.5;">
        <div style="font-weight:bold;margin-bottom:8px;">⚠ Debrief preparation error</div>
        <div style="color:var(--white);font-family:monospace;font-size:10px;background:rgba(255,80,80,0.06);padding:8px;border:1px solid var(--red);">
          ${(prepError.message || String(prepError)).replace(/</g,'&lt;')}
        </div>
        <div style="color:var(--muted);margin-top:10px;font-size:10px;">
          computeRubric or generateCFINote threw before debrief could render.
          <br>Mission: ${(STATE.mission && STATE.mission.id) || '?'} ·
          Round: ${STATE.round} ·
          Actor: ${(STATE.activeActor && STATE.activeActor.id) || '?'}
        </div>
      </div>`;
      return;
    }
    try {
      let html = '';
      if (dtab === 'rubric') html = renderRubricTab(rubric, cfiNote, win);
      else if (dtab === 'timeline') html = renderTimelineTab();
      else if (dtab === 'trends') html = renderTrendsTab();
      else if (dtab === 'moves') html = renderMovesTab();
      if (!html || html.trim().length === 0) {
        html = `<div style="color:var(--amber);">⚠ Debrief renderer returned empty for tab "${dtab}". Please report.</div>`;
      }
      body.innerHTML = html;
    } catch (err) {
      // Defensive: show the error inline rather than leaving blank screen
      body.innerHTML = `<div style="color:var(--red);font-size:11px;padding:14px;line-height:1.5;">
        <div style="font-weight:bold;margin-bottom:8px;">⚠ Debrief render error</div>
        <div style="color:var(--white);font-family:monospace;font-size:10px;background:rgba(255,80,80,0.06);padding:8px;border:1px solid var(--red);">
          ${(err && err.message ? err.message : String(err)).replace(/</g,'&lt;')}
        </div>
        <div style="color:var(--muted);margin-top:10px;font-size:10px;">
          Mission: ${(STATE.mission && STATE.mission.id) || '?'} ·
          Round: ${STATE.round} ·
          Actor: ${(STATE.activeActor && STATE.activeActor.id) || '?'} ·
          Combos: ${(STATE.combosTriggered || []).length} ·
          Pivots: ${(STATE.pivotEvents || []).length}
        </div>
      </div>`;
      // also surface to console for further debugging
      try { console.error('Debrief render error', err); } catch(_){}
    }
  }
  renderDtab();

  overlay.querySelectorAll('.debrief-tab').forEach(b => {
    b.addEventListener('click', () => {
      dtab = b.dataset.dtab;
      overlay.querySelectorAll('.debrief-tab').forEach(x => x.classList.toggle('active', x.dataset.dtab === dtab));
      renderDtab();
    });
  });
  // v0.9.4: wire timeline round-header clicks to populate the detail panel.
  // Delegation via overlay since renderDtab replaces inner HTML on tab switch.
  overlay.addEventListener('click', (ev) => {
    const head = ev.target.closest('.tl-round-head');
    if (!head) return;
    const r = parseInt(head.dataset.round, 10);
    if (!r) return;
    const detail = overlay.querySelector('#tl-round-detail');
    if (detail) detail.innerHTML = renderTimelineRoundDetail(r);
  });
  overlay.querySelector('#db-retry').addEventListener('click', () => location.reload());
  overlay.querySelector('#db-mission-select').addEventListener('click', () => location.reload());
  const exportBtn = overlay.querySelector('#db-export');
  if (exportBtn) {
    exportBtn.addEventListener('click', () => exportCaseLog(rubric, cfiNote, win, reason));
  }
  // v0.9.2: SHARE — copy a seeded replay URL to the clipboard. If the current
  // run was not seeded at boot, mint a short seed from current Math.random so
  // the share is still reproducible (noting we don't retro-reseed this run).
  const shareBtn = overlay.querySelector('#db-share');
  if (shareBtn) {
    shareBtn.addEventListener('click', () => {
      const forceNew = !JOSHUA_SEED;  // only mint if no seed is live
      const url = buildShareURL(forceNew);
      const label = JOSHUA_SEED ? ('reproduces this run — seed: ' + JOSHUA_SEED.raw) : 'opens a new seeded run (minted)';
      let copied = false;
      try {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(url).then(
            () => { shareBtn.textContent = '✓ COPIED'; setTimeout(() => shareBtn.textContent = 'SHARE', 1800); },
            () => { prompt('Copy this replay URL:\n(' + label + ')', url); }
          );
          copied = true;
        }
      } catch (e) { /* fall through */ }
      if (!copied) {
        // Fallback: prompt the user with the URL so they can copy manually.
        try { prompt('Copy this replay URL:\n(' + label + ')', url); } catch (e) {}
      }
    });
  }
}

// v0.8: Case-log export in a dfir-trainers-compatible shape. JSON blob
// downloaded to the user's device for sharing / comparing with peers. Includes:
// build stamp, mission/actor/difficulty, rubric scores, per-round metrics,
// per-action log, combos triggered, pivots, IOCs. Nothing sensitive — this
// is a game record, no personal data.
function exportCaseLog(rubric, cfiNote, win, reason) {
  const now = new Date();
  const payload = {
    schema: 'joshua-protocol.case-log.v1',
    build: BUILD_ID,
    stamp_utc: STAMP_UTC,
    exported_at: now.toISOString(),
    outcome: win ? 'WIN' : 'LOSE',
    outcome_reason: reason,
    mission: {
      id: STATE.mission && STATE.mission.id,
      name: STATE.mission && STATE.mission.name,
      domain: STATE.mission && STATE.mission.domain,
      max_rounds: STATE.mission && STATE.mission.maxRounds,
      lose_threshold: STATE.mission && STATE.mission.loseThreshold,
    },
    adversary: {
      id: STATE.activeActor && STATE.activeActor.id,
      archetype: STATE.activeActor && STATE.activeActor.archetype,
      attribution_pct: STATE.actorAttribution || 0,
      source: STATE.activeActor && STATE.activeActor.source || null,
    },
    settings: {
      difficulty: STATE.difficulty,
      verbosity: STATE.verbosity,
      speed: STATE.speed,
      action_budget: STATE.actionBudget,
    },
    // v0.9.2: seed capture — present when the run was launched via ?seed=…
    seed: JOSHUA_SEED ? { raw: JOSHUA_SEED.raw, int: JOSHUA_SEED.int } : null,
    // v0.9.3: life-safety events (healthcare + any mission with lifeSafetyNodes)
    life_safety_events: STATE.lifeSafetyEvents || [],
    final_round: STATE.round,
    c2: {
      node: STATE.c2Node,
      revealed_round: (STATE.metrics && STATE.metrics.c2RevealedRound) || null,
      severed_round: (STATE.metrics && STATE.metrics.c2SeveredRound) || null,
    },
    rubric,
    cfi_note: cfiNote,
    rounds: (STATE.metrics && STATE.metrics.rounds) || [],
    actions: (STATE.metrics && STATE.metrics.actions) || [],
    threat_spawns: (STATE.metrics && STATE.metrics.threatSpawns) || [],
    combos_triggered: STATE.combosTriggered || [],
    pivot_events: STATE.pivotEvents || [],
    observed_ttps: STATE.observedTTPs || {},
    iocs: STATE.iocs || [],
    diamond: {
      adversary: !!STATE.actorRevealed,
      capability: Object.keys(STATE.observedTTPs || {}).length > 0,
      infrastructure: !!STATE.c2Revealed,
      victim: !!STATE.mission,
    },
  };
  const json = JSON.stringify(payload, null, 2);
  const blob = new Blob([json], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const ts = now.toISOString().replace(/[:.]/g,'-').replace('T','_').slice(0,19);
  a.href = url;
  a.download = `joshua-protocol-caselog-${(STATE.mission && STATE.mission.id) || 'mission'}-${ts}.json`;
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { document.body.removeChild(a); URL.revokeObjectURL(url); }, 500);
}

function renderRubricTab(rubric, cfiNote, win) {
  const order = ['detection', 'attribution', 'efficiency', 'hardening', 'cascade', 'doctrine'];
  const labels = {
    detection: 'DETECTION SPEED',
    attribution: 'C2 ATTRIBUTION',
    efficiency: 'AGENT EFFICIENCY',
    hardening: 'HARDENING ECONOMY',
    cascade: 'CASCADE CONTAINMENT',
    doctrine: 'DOCTRINE',
  };
  const rows = order.map(k => {
    const r = rubric[k];
    const barColor = r.score >= 65 ? 'var(--green)' : r.score >= 45 ? 'var(--cyan)' : r.score >= 25 ? 'var(--amber)' : 'var(--red)';
    const filled = Math.round(r.score / 10);
    const bar = '█'.repeat(filled) + '░'.repeat(10 - filled);
    return `
      <div class="rubric-row">
        <div class="rubric-label">${labels[k]}</div>
        <div class="rubric-bar-row">
          <span class="rubric-bar" style="color:${barColor};">${bar}</span>
          <span class="rubric-score">${r.score}</span>
          <span class="rubric-tag" style="color:${barColor};">${r.label}</span>
        </div>
        <div class="rubric-detail">${r.detail}</div>
      </div>
    `;
  }).join('');
  const overall = Math.round(order.reduce((s, k) => s + rubric[k].score, 0) / order.length);
  return `
    <div class="rubric-overall">
      <div style="font-size:9px;color:var(--muted);letter-spacing:0.1em;">OVERALL</div>
      <div style="font-size:24px;font-weight:bold;color:${overall >= 65 ? 'var(--green)' : overall >= 45 ? 'var(--cyan)' : 'var(--amber)'};">${overall}</div>
      <div style="font-size:10px;color:var(--muted);">${scoreLabel(overall)}</div>
    </div>
    ${rows}
    <div class="cfi-note" style="margin-top:14px;border-left:3px solid var(--cyan);padding-left:8px;">
      <div style="color:var(--cyan);font-size:10px;font-weight:bold;letter-spacing:0.05em;margin-bottom:4px;">▸ JOSHUA — DEBRIEF NOTE</div>
      <div style="font-size:11px;line-height:1.6;color:var(--white);">${cfiNote}</div>
    </div>
  `;
}

function renderTrendsTab() {
  const m = STATE.metrics;
  if (m.rounds.length === 0) {
    return '<div style="color:var(--muted);">No round data captured.</div>';
  }
  function sparkline(values, max, color) {
    const blocks = '▁▂▃▄▅▆▇█';
    const safeMax = (typeof max === 'number' && isFinite(max) && max > 0) ? max : 1;
    return values.map(v => {
      // v0.8: NaN/undefined safety — a missing round-metric field was producing
      // literal "NaN" strings in the trends panel. Coerce to a valid rung.
      const safeV = (typeof v === 'number' && isFinite(v)) ? Math.max(0, v) : 0;
      const idx = Math.min(blocks.length - 1, Math.max(0, Math.round((safeV / safeMax) * (blocks.length - 1))));
      return `<span style="color:${color};">${blocks[idx]}</span>`;
    }).join('');
  }
  // v0.8: Normalize every round-metric field at read-time so a missing field
  // can't poison the whole pipeline.
  const safe = r => ({
    compromisedTotal: Number(r.compromisedTotal) || 0,
    wastedActions:    Number(r.wastedActions)    || 0,
    effectiveActions: Number(r.effectiveActions) || 0,
    threatsActive:    Number(r.threatsActive)    || 0,
  });
  const safeRounds = m.rounds.map(safe);
  const compromiseSeries = safeRounds.map(r => r.compromisedTotal);
  const wastedSeries = safeRounds.map(r => r.wastedActions);
  const effectiveSeries = safeRounds.map(r => r.effectiveActions);
  const threatsActiveSeries = safeRounds.map(r => r.threatsActive);
  const maxComp = STATE.mission.loseThreshold;
  const maxWaste = Math.max(1, ...wastedSeries);
  const maxEff = Math.max(1, ...effectiveSeries);
